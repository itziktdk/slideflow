<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GTA City</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#000;font-family:'Segoe UI',Arial,sans-serif;touch-action:none;user-select:none}
canvas#game{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#hud *{pointer-events:auto}
#minimap-wrap{position:fixed;bottom:20px;left:20px;z-index:20}
#minimap{border-radius:50%;border:3px solid rgba(255,255,255,0.3);display:block}
#health-wrap{position:fixed;bottom:10px;left:130px;z-index:20;display:flex;align-items:center;gap:6px}
#health-bar-bg{width:120px;height:14px;background:rgba(0,0,0,0.6);border-radius:7px;overflow:hidden}
#health-bar{width:100%;height:100%;background:#4f4;border-radius:7px;transition:width 0.3s}
#health-icon{color:#4f4;font-size:18px;font-weight:bold}
#money{position:fixed;top:20px;right:20px;color:#4f4;font-size:22px;font-weight:bold;text-shadow:2px 2px 4px #000;z-index:20}
#wanted{position:fixed;top:50px;right:20px;font-size:24px;z-index:20;display:flex;gap:2px}
.star{color:rgba(255,255,255,0.2);text-shadow:1px 1px 2px #000}.star.active{color:#fc4}
#speed-display{position:fixed;bottom:20px;right:20px;color:#fff;font-size:20px;font-weight:bold;text-shadow:2px 2px 4px #000;z-index:20;display:none}
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,0.5);font-size:24px;z-index:15;pointer-events:none}
#fps-counter{position:fixed;top:20px;left:20px;color:#ff0;font-size:14px;z-index:20;display:none}
#inventory-bar{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:20}
.inv-slot{width:50px;height:50px;background:rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.3);border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;cursor:pointer}
.inv-slot.active{border-color:#fc4;background:rgba(255,200,0,0.2)}
#interact-prompt{position:fixed;top:60%;left:50%;transform:translateX(-50%);color:#fff;font-size:18px;text-shadow:2px 2px 4px #000;z-index:20;display:none;background:rgba(0,0,0,0.5);padding:8px 16px;border-radius:8px}
#controls-info{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,0.5);font-size:12px;z-index:20;text-align:center}
/* Settings */
#settings-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:100;display:none;align-items:center;justify-content:center}
#settings-panel{background:#1a1a2e;border:2px solid #333;border-radius:12px;padding:30px;width:340px;max-width:90vw;color:#fff}
#settings-panel h2{margin-bottom:16px;color:#fc4;text-align:center}
.setting-row{margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.setting-row label{font-size:14px}
.setting-row input[type=range]{width:140px}
.setting-row input[type=checkbox]{width:18px;height:18px}
#settings-close{display:block;margin:16px auto 0;padding:8px 24px;background:#fc4;color:#000;border:none;border-radius:6px;font-size:16px;cursor:pointer;font-weight:bold}
/* Mobile */
#mobile-controls{display:none;z-index:30}
body.mobile #mobile-controls{display:block}
body.mobile #controls-info{display:none!important}
body.mobile #minimap-wrap{bottom:160px;left:20px}
body.mobile #health-wrap{bottom:155px;left:130px}
body.mobile #money{top:15px;right:60px;font-size:18px}
body.mobile #wanted{top:38px;right:60px;font-size:20px}
body.mobile .inv-slot{width:42px;height:42px;font-size:16px}
body.mobile #inventory-bar{bottom:auto;top:70px;left:50%}
#joystick-area{position:fixed;bottom:30px;left:20px;width:120px;height:120px;z-index:30}
#joystick-base{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.1);border:2px solid rgba(255,255,255,0.2);position:relative}
#joystick-thumb{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,0.4);position:absolute;top:35px;left:35px}
.mobile-btn{position:fixed;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.15);border:2px solid rgba(255,255,255,0.25);color:#fff;font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:30;cursor:pointer}
#btn-jump{bottom:100px;right:20px}
#btn-attack{bottom:40px;right:80px}
#btn-sprint{bottom:160px;right:20px}
#btn-interact{bottom:40px;right:150px}
#btn-horn{bottom:100px;right:90px;display:none}
#btn-settings{position:fixed;top:20px;right:20px;width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.5);border:2px solid rgba(255,255,255,0.3);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;z-index:30;cursor:pointer}
/* media query removed — mobile styles handled by body.mobile class */
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="minimap-wrap"><canvas id="minimap" width="100" height="100"></canvas></div>
  <div id="health-wrap"><span id="health-icon">+</span><div id="health-bar-bg"><div id="health-bar"></div></div></div>
  <div id="money">$ 0</div>
  <div id="wanted"><span class="star">*</span><span class="star">*</span><span class="star">*</span><span class="star">*</span><span class="star">*</span></div>
  <div id="speed-display">0 km/h</div>
  <div id="crosshair">+</div>
  <div id="fps-counter">FPS: 0</div>
  <div id="inventory-bar"></div>
  <div id="interact-prompt">[E] Interact</div>
  <div id="controls-info">WASD=Move | Mouse=Look | Shift=Run | Space=Jump | E=Interact | LMB=Attack | ESC=Settings</div>
</div>

<div id="settings-overlay">
  <div id="settings-panel">
    <h2>-- SETTINGS --</h2>
    <div class="setting-row"><label>Mouse Sensitivity</label><input type="range" id="s-sens" min="1" max="20" value="5"></div>
    <div class="setting-row"><label>Camera Distance</label><input type="range" id="s-camdist" min="3" max="20" value="8"></div>
    <div class="setting-row"><label>Walk Speed</label><input type="range" id="s-speed" min="1" max="20" value="8"></div>
    <div class="setting-row"><label>Volume</label><input type="range" id="s-vol" min="0" max="100" value="50"></div>
    <div class="setting-row"><label>Show FPS</label><input type="checkbox" id="s-fps"></div>
    <div class="setting-row"><label>Particles</label><input type="checkbox" id="s-particles" checked></div>
    <button id="settings-close">CLOSE</button>
  </div>
</div>

<div id="mobile-controls">
  <div id="joystick-area"><div id="joystick-base"><div id="joystick-thumb"></div></div></div>
  <div class="mobile-btn" id="btn-jump">JMP</div>
  <div class="mobile-btn" id="btn-attack">ATK</div>
  <div class="mobile-btn" id="btn-sprint">RUN</div>
  <div class="mobile-btn" id="btn-interact">E</div>
  <div class="mobile-btn" id="btn-horn">HRN</div>
  <div id="btn-settings">G</div>
</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
'use strict';
// ==================== GLOBALS ====================
const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if(isMobile) document.body.classList.add('mobile');
const PI = Math.PI, PI2 = PI*2, HALF_PI = PI/2;
const clock = new THREE.Clock();
let scene, camera, renderer, listener;
let sunLight, ambientLight;

// Settings
const settings = {
  sensitivity: 0.005, camDist: 8, walkSpeed: 8, runMult: 1.8,
  volume: 0.5, showFps: false, particles: true, jumpForce: 12, gravity: 30
};

// State
const keys = {};
let mouseX = 0, mouseY = 0;
let camTheta = 0, camPhi = 0.35;
let player, playerInCar = null;
let health = 100, money = 0, wantedLevel = 0, wantedTimer = 0;
let inventory = [{name:'Fist',icon:'O',type:'melee'},{name:'',icon:''},{name:'',icon:''},{name:'',icon:''},{name:'',icon:''}];
let activeSlot = 0;
let playerVelY = 0, onGround = true, isJumping = false;
let attacking = false, attackTimer = 0;
let interactTarget = null;

// Cars
const cars = [];
// NPCs
const npcs = [];
// Chests
const chests = [];
// City
const buildings = [];
const ROAD_W = 12, BLOCK_SIZE = 50, GRID = 5;
const CITY_SIZE = GRID * BLOCK_SIZE;
const HALF_CITY = CITY_SIZE / 2;

// Audio
let audioCtx, masterGain;
let footstepTimer = 0, engineOsc = null, engineGain = null;

// FPS
let fpsFrames = 0, fpsTime = 0;

// Day/Night
let dayTime = 0; // 0-1, 0.25=noon, 0.75=midnight
const DAY_CYCLE = 300; // 5 min

// ==================== INIT ====================
function init() {
  scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x88aacc, 50, 250);
  scene.background = new THREE.Color(0x88aacc);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.5, 500);

  renderer = new THREE.WebGLRenderer({canvas: document.getElementById('game'), antialias: true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  // Lights
  ambientLight = new THREE.AmbientLight(0x6688aa, 0.4);
  scene.add(ambientLight);

  sunLight = new THREE.DirectionalLight(0xffeedd, 1.0);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  sunLight.shadow.camera.left = -100;
  sunLight.shadow.camera.right = 100;
  sunLight.shadow.camera.top = 100;
  sunLight.shadow.camera.bottom = -100;
  sunLight.shadow.camera.near = 0.5;
  sunLight.shadow.camera.far = 300;
  scene.add(sunLight);

  buildCity();
  createPlayer();
  spawnCars();
  spawnNPCs();
  spawnChests();
  buildInventoryBar();
  initAudio();
  initControls();

  window.addEventListener('resize', onResize);
  onResize();
  animate();
}

// ==================== CITY ====================
function buildCity() {
  // Ground
  const groundGeo = new THREE.PlaneGeometry(CITY_SIZE+60, CITY_SIZE+60);
  const groundCanvas = document.createElement('canvas');
  groundCanvas.width = 512; groundCanvas.height = 512;
  const gctx = groundCanvas.getContext('2d');
  gctx.fillStyle = '#3a5a3a';
  gctx.fillRect(0,0,512,512);
  for(let i=0;i<2000;i++){
    gctx.fillStyle = `rgb(${50+Math.random()*30},${75+Math.random()*40},${50+Math.random()*30})`;
    gctx.fillRect(Math.random()*512,Math.random()*512,2+Math.random()*3,2+Math.random()*3);
  }
  const groundTex = new THREE.CanvasTexture(groundCanvas);
  groundTex.wrapS = groundTex.wrapT = THREE.RepeatWrapping;
  groundTex.repeat.set(8,8);
  const groundMat = new THREE.MeshLambertMaterial({map: groundTex});
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -HALF_PI;
  ground.receiveShadow = true;
  scene.add(ground);

  // Roads
  const roadMat = new THREE.MeshLambertMaterial({color: 0x333333});
  const sidewalkMat = new THREE.MeshLambertMaterial({color: 0x999999});

  for(let i = 0; i <= GRID; i++){
    const x = -HALF_CITY + i * BLOCK_SIZE;
    // Vertical road
    const vRoad = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_W, CITY_SIZE+20), roadMat);
    vRoad.rotation.x = -HALF_PI; vRoad.position.set(x, 0.01, 0);
    vRoad.receiveShadow = true; scene.add(vRoad);
    // Sidewalks
    for(let side of [-1,1]){
      const sw = new THREE.Mesh(new THREE.PlaneGeometry(2, CITY_SIZE+20), sidewalkMat);
      sw.rotation.x = -HALF_PI; sw.position.set(x + side*(ROAD_W/2+1), 0.02, 0);
      sw.receiveShadow = true; scene.add(sw);
    }
    // Horizontal road
    const hRoad = new THREE.Mesh(new THREE.PlaneGeometry(CITY_SIZE+20, ROAD_W), roadMat);
    hRoad.rotation.x = -HALF_PI;
    const z = -HALF_CITY + i * BLOCK_SIZE;
    hRoad.position.set(0, 0.01, z);
    hRoad.receiveShadow = true; scene.add(hRoad);
    for(let side of [-1,1]){
      const sw = new THREE.Mesh(new THREE.PlaneGeometry(CITY_SIZE+20, 2), sidewalkMat);
      sw.rotation.x = -HALF_PI; sw.position.set(0, 0.02, z + side*(ROAD_W/2+1));
      sw.receiveShadow = true; scene.add(sw);
    }
  }

  // Road lines (dashed center lines)
  const lineMat = new THREE.MeshBasicMaterial({color: 0xffff00});
  for(let i=0;i<=GRID;i++){
    const x = -HALF_CITY + i*BLOCK_SIZE;
    for(let d=-HALF_CITY;d<HALF_CITY;d+=4){
      const ln = new THREE.Mesh(new THREE.PlaneGeometry(0.3,2), lineMat);
      ln.rotation.x=-HALF_PI; ln.position.set(x,0.03,d); scene.add(ln);
    }
    const z = -HALF_CITY + i*BLOCK_SIZE;
    for(let d=-HALF_CITY;d<HALF_CITY;d+=4){
      const ln = new THREE.Mesh(new THREE.PlaneGeometry(2,0.3), lineMat);
      ln.rotation.x=-HALF_PI; ln.position.set(d,0.03,z); scene.add(ln);
    }
  }

  // Buildings
  const bColors = [0x8b4513, 0xa0522d, 0x6b6b6b, 0x4a708b, 0xb8860b, 0x556b2f, 0x8b0000, 0x2f4f4f, 0xcd853f, 0x808080];
  for(let bx=0; bx<GRID; bx++){
    for(let bz=0; bz<GRID; bz++){
      const cx = -HALF_CITY + bx*BLOCK_SIZE + BLOCK_SIZE/2;
      const cz = -HALF_CITY + bz*BLOCK_SIZE + BLOCK_SIZE/2;
      const innerSize = BLOCK_SIZE - ROAD_W - 6;
      // 1-4 buildings per block
      const count = 1 + Math.floor(Math.random()*3);
      for(let b=0;b<count;b++){
        const w = 6 + Math.random()*12;
        const d = 6 + Math.random()*12;
        const h = 8 + Math.random()*30;
        const ox = (Math.random()-0.5)*(innerSize - w);
        const oz = (Math.random()-0.5)*(innerSize - d);

        const col = bColors[Math.floor(Math.random()*bColors.length)];
        const bMat = new THREE.MeshLambertMaterial({color: col});
        const bMesh = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), bMat);
        bMesh.position.set(cx+ox, h/2, cz+oz);
        bMesh.castShadow = true; bMesh.receiveShadow = true;
        scene.add(bMesh);
        buildings.push({mesh:bMesh, x:cx+ox, z:cz+oz, w, d, h, col});

        // Windows
        const winMat = new THREE.MeshBasicMaterial({color: 0x88ccff});
        const winMatNight = new THREE.MeshBasicMaterial({color: 0xffeeaa, emissive: 0xffeeaa, emissiveIntensity: 0.5});
        bMesh.userData.winMats = [];
        for(let wy=3; wy<h-2; wy+=4){
          for(let face=0;face<4;face++){
            if(Math.random()<0.3) continue;
            const wm = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 2), winMat.clone());
            const wx = (Math.random()-0.5)*(face%2===0?w*0.7:d*0.7);
            if(face===0){ wm.position.set(wx, wy-h/2, d/2+0.05); }
            else if(face===1){ wm.position.set(wx, wy-h/2, -d/2-0.05); wm.rotation.y=PI; }
            else if(face===2){ wm.position.set(w/2+0.05, wy-h/2, wx); wm.rotation.y=HALF_PI; }
            else { wm.position.set(-w/2-0.05, wy-h/2, wx); wm.rotation.y=-HALF_PI; }
            bMesh.add(wm);
            bMesh.userData.winMats.push(wm.material);
          }
        }

        // Door
        const doorMat = new THREE.MeshLambertMaterial({color: 0x4a2810});
        const door = new THREE.Mesh(new THREE.PlaneGeometry(2,3), doorMat);
        door.position.set(0, 1.5-h/2, d/2+0.05);
        bMesh.add(door);
      }
    }
  }

  // Street lamps (instanced)
  const lampPostGeo = new THREE.CylinderGeometry(0.15, 0.15, 6, 6);
  const lampBulbGeo = new THREE.SphereGeometry(0.4, 8, 8);
  const lampPostMat = new THREE.MeshLambertMaterial({color: 0x444444});
  const lampBulbMat = new THREE.MeshBasicMaterial({color: 0xffffcc});

  window.streetLamps = [];
  for(let i=0;i<=GRID;i++){
    for(let j=-HALF_CITY+10; j<HALF_CITY; j+=20){
      const x = -HALF_CITY + i*BLOCK_SIZE;
      for(let side of [-1,1]){
        const lx = x + side*(ROAD_W/2+2);
        const post = new THREE.Mesh(lampPostGeo, lampPostMat);
        post.position.set(lx, 3, j);
        post.castShadow = true;
        scene.add(post);
        const bulb = new THREE.Mesh(lampBulbGeo, lampBulbMat.clone());
        bulb.position.set(lx, 6.2, j);
        scene.add(bulb);
        const pl = new THREE.PointLight(0xffeeaa, 0, 15);
        pl.position.copy(bulb.position);
        scene.add(pl);
        streetLamps.push({bulb, light: pl});
      }
      // Same for horizontal roads
      const z2 = -HALF_CITY + i*BLOCK_SIZE;
      for(let side of [-1,1]){
        const lz = z2 + side*(ROAD_W/2+2);
        const post = new THREE.Mesh(lampPostGeo, lampPostMat);
        post.position.set(j, 3, lz); post.castShadow=true; scene.add(post);
        const bulb = new THREE.Mesh(lampBulbGeo, lampBulbMat.clone());
        bulb.position.set(j, 6.2, lz); scene.add(bulb);
        const pl = new THREE.PointLight(0xffeeaa, 0, 15);
        pl.position.copy(bulb.position); scene.add(pl);
        streetLamps.push({bulb, light: pl});
      }
    }
  }

  // Traffic lights at intersections
  for(let i=0;i<=GRID;i++){
    for(let j=0;j<=GRID;j++){
      const x = -HALF_CITY + i*BLOCK_SIZE;
      const z = -HALF_CITY + j*BLOCK_SIZE;
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,4,6), new THREE.MeshLambertMaterial({color:0x333333}));
      pole.position.set(x+ROAD_W/2+1, 2, z+ROAD_W/2+1);
      scene.add(pole);
      const box = new THREE.Mesh(new THREE.BoxGeometry(0.6,1.5,0.6), new THREE.MeshLambertMaterial({color:0x222222}));
      box.position.set(x+ROAD_W/2+1, 4.5, z+ROAD_W/2+1);
      scene.add(box);
      // Red/Yellow/Green lights
      const colors = [0xff0000, 0xffff00, 0x00ff00];
      colors.forEach((c,ci)=>{
        const l = new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8), new THREE.MeshBasicMaterial({color:c}));
        l.position.set(x+ROAD_W/2+1, 5+ci*(-0.4), z+ROAD_W/2+1.35);
        scene.add(l);
      });
    }
  }

  // Trees (instanced)
  const treeTrunkGeo = new THREE.CylinderGeometry(0.2, 0.3, 3, 6);
  const treeTopGeo = new THREE.SphereGeometry(1.5, 8, 6);
  const treeTrunkMat = new THREE.MeshLambertMaterial({color:0x8b4513});
  const treeTopMat = new THREE.MeshLambertMaterial({color:0x228b22});

  for(let i=0;i<200;i++){
    const tx = (Math.random()-0.5)*CITY_SIZE;
    const tz = (Math.random()-0.5)*CITY_SIZE;
    // Skip if on road
    let onRoad = false;
    for(let g=0;g<=GRID;g++){
      const r = -HALF_CITY + g*BLOCK_SIZE;
      if(Math.abs(tx-r)<ROAD_W/2+3 || Math.abs(tz-r)<ROAD_W/2+3) { onRoad=true; break; }
    }
    if(onRoad && Math.random()>0.15) continue;

    const trunk = new THREE.Mesh(treeTrunkGeo, treeTrunkMat);
    trunk.position.set(tx, 1.5, tz);
    trunk.castShadow = true;
    scene.add(trunk);
    const top = new THREE.Mesh(treeTopGeo, treeTopMat);
    top.position.set(tx, 4, tz);
    top.castShadow = true;
    scene.add(top);
  }
}

// ==================== PLAYER ====================
function createHumanoid(skinColor, shirtColor, pantsColor, scale) {
  const group = new THREE.Group();
  const skinMat = new THREE.MeshLambertMaterial({color: skinColor});
  const shirtMat = new THREE.MeshLambertMaterial({color: shirtColor});
  const pantsMat = new THREE.MeshLambertMaterial({color: pantsColor});
  const shoeMat = new THREE.MeshLambertMaterial({color: 0x222222});

  // Head
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), skinMat);
  head.position.y = 1.85; head.castShadow=true; group.add(head);

  // Torso
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.8,0.4), shirtMat);
  torso.position.y = 1.2; torso.castShadow=true; group.add(torso);

  // Arms
  const armGeo = new THREE.BoxGeometry(0.25,0.7,0.25);
  const lArm = new THREE.Mesh(armGeo, shirtMat);
  lArm.position.set(-0.5, 1.2, 0); lArm.castShadow=true; group.add(lArm);
  const rArm = new THREE.Mesh(armGeo, shirtMat);
  rArm.position.set(0.5, 1.2, 0); rArm.castShadow=true; group.add(rArm);

  // Legs
  const legGeo = new THREE.BoxGeometry(0.25,0.7,0.25);
  const lLeg = new THREE.Mesh(legGeo, pantsMat);
  lLeg.position.set(-0.2, 0.45, 0); lLeg.castShadow=true; group.add(lLeg);
  const rLeg = new THREE.Mesh(legGeo, pantsMat);
  rLeg.position.set(0.2, 0.45, 0); rLeg.castShadow=true; group.add(rLeg);

  // Shoes
  const shoeGeo = new THREE.BoxGeometry(0.28,0.15,0.35);
  const lShoe = new THREE.Mesh(shoeGeo, shoeMat);
  lShoe.position.set(-0.2,0.08,0.05); group.add(lShoe);
  const rShoe = new THREE.Mesh(shoeGeo, shoeMat);
  rShoe.position.set(0.2,0.08,0.05); group.add(rShoe);

  group.userData = {lArm, rArm, lLeg, rLeg, head, torso, animTime:0};
  if(scale) group.scale.setScalar(scale);
  return group;
}

function createPlayer(){
  player = createHumanoid(0xdeb887, 0x1a1a8b, 0x2f2f2f, 1);
  player.position.set(0, 0, 0);
  player.castShadow = true;
  scene.add(player);

  // Sword (hidden initially)
  const swordGroup = new THREE.Group();
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.2, 0.04), new THREE.MeshLambertMaterial({color:0xcccccc}));
  blade.position.y = 0.6;
  const hilt = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.1, 0.08), new THREE.MeshLambertMaterial({color:0x8b4513}));
  swordGroup.add(blade); swordGroup.add(hilt);
  swordGroup.visible = false;
  player.userData.rArm.add(swordGroup);
  player.userData.sword = swordGroup;
  player.userData.facing = 0;
}

// ==================== CARS ====================
function createCar(color){
  const group = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({color});

  // Body
  const body = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 4.5), bodyMat);
  body.position.y = 0.7; body.castShadow=true; group.add(body);

  // Roof
  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2.2), bodyMat);
  roof.position.set(0, 1.5, -0.3); roof.castShadow=true; group.add(roof);

  // Windshield
  const glassMat = new THREE.MeshLambertMaterial({color: 0x88ccff, transparent:true, opacity:0.5});
  const ws = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 0.8), glassMat);
  ws.position.set(0, 1.4, 0.82); ws.rotation.x = -0.3; group.add(ws);
  // Rear window
  const rw = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 0.6), glassMat);
  rw.position.set(0, 1.4, -1.42); rw.rotation.x = 0.3; rw.rotation.y = PI; group.add(rw);

  // Headlights
  const hlMat = new THREE.MeshBasicMaterial({color:0xffffcc});
  const hl1 = new THREE.Mesh(new THREE.SphereGeometry(0.15,6,6), hlMat);
  hl1.position.set(-0.7, 0.7, 2.3); group.add(hl1);
  const hl2 = new THREE.Mesh(new THREE.SphereGeometry(0.15,6,6), hlMat);
  hl2.position.set(0.7, 0.7, 2.3); group.add(hl2);

  // Taillights
  const tlMat = new THREE.MeshBasicMaterial({color:0xff0000});
  const tl1 = new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6), tlMat);
  tl1.position.set(-0.7, 0.7, -2.3); group.add(tl1);
  const tl2 = new THREE.Mesh(new THREE.SphereGeometry(0.12,6,6), tlMat);
  tl2.position.set(0.7, 0.7, -2.3); group.add(tl2);

  // Wheels
  const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 12);
  const wheelMat = new THREE.MeshLambertMaterial({color:0x111111});
  const wheels = [];
  const positions = [[-1,0.35,1.5],[1,0.35,1.5],[-1,0.35,-1.5],[1,0.35,-1.5]];
  positions.forEach(p=>{
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = HALF_PI;
    w.position.set(p[0],p[1],p[2]);
    w.castShadow = true;
    group.add(w);
    wheels.push(w);
  });

  group.userData = {
    speed: 0, steer: 0, maxSpeed: 40, accel: 15, brakeForce: 20,
    friction: 5, wheels, heading: 0, velocity: new THREE.Vector3()
  };
  return group;
}

function spawnCars(){
  const carColors = [0xff0000,0x0044ff,0x00aa00,0xffff00,0xff00ff,0x00ffff,0xff8800,0xffffff,0x444444,0x880088];
  const spots = [
    [25,0,25],[75,0,-30],[-40,0,60],[-80,0,-70],[50,0,-80],
    [-20,0,20],[60,0,40],[-60,0,-30],[10,0,-50],[-70,0,50]
  ];
  spots.forEach((s,i)=>{
    const car = createCar(carColors[i % carColors.length]);
    car.position.set(s[0], 0, s[2]);
    car.rotation.y = Math.random()*PI2;
    car.userData.heading = car.rotation.y;

    cars.push(car);
  });
}

// ==================== NPCs ====================
function spawnNPCs(){

function randomLoot(){

function buildInventoryBar(){

  bar.innerHTML = '';
  inventory.forEach((item,i)=>{
    const slot = document.createElement('div');
    slot.className = 'inv-slot' + (i===activeSlot?' active':'');
    slot.textContent = item.icon || '';
    slot.onclick = ()=>{ selectSlot(i); };
    bar.appendChild(slot);
  });
  updateWeaponVisibility();
}

function selectSlot(i){
  activeSlot = i;
  buildInventoryBar();
}

function updateWeaponVisibility(){

    const item = inventory[activeSlot];
    player.userData.sword.visible = (item && item.type === 'weapon');

// ==================== AUDIO ====================
function initAudio(){
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  masterGain = audioCtx.createGain();
  masterGain.gain.value = settings.volume;
  masterGain.connect(audioCtx.destination);
}

function resumeAudio(){ if(audioCtx && audioCtx.state==='suspended') audioCtx.resume(); }

function playFootstep(){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'triangle';
  o.frequency.value = 80+Math.random()*40;
  g.gain.setValueAtTime(0.15*settings.volume, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.1);
  o.connect(g); g.connect(masterGain);
  o.start(); o.stop(audioCtx.currentTime+0.1);
}

function startEngine(){
  if(engineOsc || !audioCtx) return;
  engineOsc = audioCtx.createOscillator();
  engineGain = audioCtx.createGain();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 60;
  engineGain.gain.value = 0.08*settings.volume;
  engineOsc.connect(engineGain);
  engineGain.connect(masterGain);
  engineOsc.start();
}

function stopEngine(){
  if(engineOsc){ engineOsc.stop(); engineOsc=null; engineGain=null; }
}

function updateEngine(speed){
  if(engineOsc){
    engineOsc.frequency.value = 60 + Math.abs(speed)*3;
    engineGain.gain.value = (0.05 + Math.abs(speed)*0.003)*settings.volume;
  }
}

function playHorn(){
  if(!audioCtx) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.value = 350;
  g.gain.setValueAtTime(0.2*settings.volume, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.5);
  o.connect(g); g.connect(masterGain);
  o.start(); o.stop(audioCtx.currentTime+0.5);
}

// ==================== CONTROLS ====================
function initControls(){
  document.addEventListener('keydown', e=>{
    keys[e.code]=true;
    if(e.code==='Escape') toggleSettings();
    if(e.code==='KeyH' && playerInCar) playHorn();
    if(e.code==='KeyE') tryInteract();
    if(e.code==='Digit1') selectSlot(0);
    if(e.code==='Digit2') selectSlot(1);
    if(e.code==='Digit3') selectSlot(2);
    if(e.code==='Digit4') selectSlot(3);
    if(e.code==='Digit5') selectSlot(4);
    resumeAudio();
  });
  document.addEventListener('keyup', e=>{ keys[e.code]=false; });

  document.addEventListener('click', e=>{
    if(!document.pointerLockElement && !isMobile && !e.target.closest('#hud') && !e.target.closest('#settings-overlay') && !e.target.closest('#mobile-controls')){
      document.body.requestPointerLock();
    }
    resumeAudio();
    doAttack();
  });

  document.addEventListener('mousemove', e=>{
    if(document.pointerLockElement){
      camTheta -= e.movementX * settings.sensitivity;
      camPhi = Math.max(0.1, Math.min(PI*0.45, camPhi - e.movementY * settings.sensitivity));
    }
  });

  // Mobile
  if(isMobile) initMobileControls();

  // Settings
  document.getElementById('settings-close').onclick = toggleSettings;
  document.getElementById('s-sens').oninput = e=>{ settings.sensitivity = e.target.value*0.002; };
  document.getElementById('s-camdist').oninput = e=>{ settings.camDist = +e.target.value; };
  document.getElementById('s-speed').oninput = e=>{ settings.walkSpeed = +e.target.value; };
  document.getElementById('s-vol').oninput = e=>{ settings.volume = e.target.value/100; if(masterGain) masterGain.gain.value = settings.volume; };
  document.getElementById('s-fps').onchange = e=>{ settings.showFps = e.target.checked; document.getElementById('fps-counter').style.display = settings.showFps?'block':'none'; };
  document.getElementById('s-particles').onchange = e=>{ settings.particles = e.target.checked; };
}

let joystickData = {active:false, dx:0, dy:0};
let mobileSprint = false;

function initMobileControls(){
  const base = document.getElementById('joystick-base');
  const thumb = document.getElementById('joystick-thumb');

  let touchId = null;
  let startX, startY;

  base.addEventListener('touchstart', e=>{
    e.preventDefault();
    const t = e.changedTouches[0];
    touchId = t.identifier;
    const r = base.getBoundingClientRect();
    startX = r.left + 60;
    startY = r.top + 60;
    joystickData.active = true;
  });

  const moveHandler = e=>{
    for(let t of e.changedTouches){
      if(t.identifier === touchId){
        let dx = t.clientX - startX;
        let dy = t.clientY - startY;
        const dist = Math.sqrt(dx*dx+dy*dy);
        const maxR = 50;
        if(dist > maxR){ dx = dx/dist*maxR; dy = dy/dist*maxR; }
        thumb.style.left = (35+dx)+'px';
        thumb.style.top = (35+dy)+'px';
        joystickData.dx = dx/maxR;
        joystickData.dy = dy/maxR;
      }
    }
  };
  document.addEventListener('touchmove', moveHandler);

  const endHandler = e=>{
    for(let t of e.changedTouches){
      if(t.identifier === touchId){
        touchId = null;
        joystickData.active = false;
        joystickData.dx = 0; joystickData.dy = 0;
        thumb.style.left = '35px'; thumb.style.top = '35px';
      }
    }
  };
  document.addEventListener('touchend', endHandler);

  // Camera drag
  let camTouchId = null, camLastX, camLastY;
  document.getElementById('game').addEventListener('touchstart', e=>{
    if(e.target.id === 'game' && camTouchId === null){
      const t = e.changedTouches[0];
      camTouchId = t.identifier;
      camLastX = t.clientX;
      camLastY = t.clientY;
    }
  });
  document.addEventListener('touchmove', e=>{
    for(let t of e.changedTouches){
      if(t.identifier === camTouchId){
        camTheta -= (t.clientX - camLastX) * 0.005;
        camPhi = Math.max(0.1, Math.min(PI*0.45, camPhi - (t.clientY - camLastY)*0.005));
        camLastX = t.clientX;
        camLastY = t.clientY;
      }
    }
  });
  document.addEventListener('touchend', e=>{
    for(let t of e.changedTouches){
      if(t.identifier === camTouchId) camTouchId = null;
    }
  });

  // Buttons
  document.getElementById('btn-jump').addEventListener('touchstart', e=>{e.preventDefault(); keys['Space']=true;});
  document.getElementById('btn-jump').addEventListener('touchend', e=>{keys['Space']=false;});
  document.getElementById('btn-attack').addEventListener('touchstart', e=>{e.preventDefault(); doAttack(); resumeAudio();});
  document.getElementById('btn-sprint').addEventListener('touchstart', e=>{e.preventDefault(); mobileSprint=true;});
  document.getElementById('btn-sprint').addEventListener('touchend', e=>{mobileSprint=false;});
  document.getElementById('btn-interact').addEventListener('touchstart', e=>{e.preventDefault(); tryInteract(); resumeAudio();});
  document.getElementById('btn-horn').addEventListener('touchstart', e=>{e.preventDefault(); playHorn();});
  document.getElementById('btn-settings').addEventListener('touchstart', e=>{e.preventDefault(); toggleSettings();});
}

function toggleSettings(){
  const o = document.getElementById('settings-overlay');
  o.style.display = o.style.display==='flex'?'none':'flex';
}

// ==================== INTERACT ====================
function tryInteract(){
  resumeAudio();
  if(playerInCar){
    exitCar();
    return;
  }
  // Check car entry
  const pp = player.position;
  for(let car of cars){
    if(pp.distanceTo(car.position)<5){
      enterCar(car);
      return;
    }
  }
  // Check chest
  for(let ch of chests){
    if(!ch.userData.opened && pp.distanceTo(ch.position)<3){
      openChest(ch);
      return;
    }
  }
}

function enterCar(car){
  playerInCar = car;
  player.visible = false;
  startEngine();
  document.getElementById('speed-display').style.display = 'block';
  if(isMobile) document.getElementById('btn-horn').style.display = 'flex';
}

function exitCar(){
  if(!playerInCar) return;
  const car = playerInCar;
  player.position.set(car.position.x+3, 0, car.position.z);
  player.visible = true;
  playerInCar = null;
  car.userData.speed = 0;
  stopEngine();
  document.getElementById('speed-display').style.display = 'none';
  if(isMobile) document.getElementById('btn-horn').style.display = 'none';
}

function openChest(ch){
  ch.userData.opened = true;
  // Animate lid
  ch.children[1].position.y = 1.2;
  ch.children[1].rotation.x = -0.8;

  const loot = ch.userData.loot;
  if(loot.money){
    money += loot.money;
  }
  if(loot.type === 'weapon'){
    // Add to first empty slot
    for(let i=0;i<inventory.length;i++){
      if(!inventory[i].name){
        inventory[i] = {name:loot.weaponName, icon:'/', type:'weapon'};
        buildInventoryBar();
        break;
      }
    }
  }
}

// ==================== ATTACK ====================
function doAttack(){
  if(playerInCar) return;
  attacking = true;
  attackTimer = 0.3;

  // Check NPC hit
  const pp = player.position;
  const fwd = new THREE.Vector3(-Math.sin(player.userData.facing), 0, -Math.cos(player.userData.facing));
  for(let npc of npcs){
    const toNpc = new THREE.Vector3().subVectors(npc.position, pp);
    toNpc.y = 0;
    if(toNpc.length()<3 && toNpc.normalize().dot(fwd)>0.3){
      wantedLevel = Math.min(5, wantedLevel+1);
      wantedTimer = 30;
      // Knock NPC back
      npc.position.add(fwd.multiplyScalar(2));
      break;
    }
  }
}

// ==================== UPDATE ====================
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  // FPS
  fpsFrames++;
  fpsTime += dt;
  if(fpsTime >= 1){ document.getElementById('fps-counter').textContent = 'FPS: '+fpsFrames; fpsFrames=0; fpsTime=0; }

  // Day/Night
  dayTime = (dayTime + dt/DAY_CYCLE) % 1;
  updateDayNight();

  // Wanted decay
  if(wantedTimer > 0){
    wantedTimer -= dt;
    if(wantedTimer <= 0){ wantedLevel = Math.max(0, wantedLevel-1); wantedTimer = wantedLevel>0?15:0; }
  }

  if(playerInCar){
    updateCarDriving(dt);
  } else {
    updatePlayerMovement(dt);
  }

  updateNPCs(dt);
  updateCamera();
  updateHUD();
  updateMinimap();
  updateAttack(dt);

  renderer.render(scene, camera);
}

function updatePlayerMovement(dt){
  let moveX=0, moveZ=0;
  const running = keys['ShiftLeft'] || keys['ShiftRight'] || mobileSprint;
  const speed = settings.walkSpeed * (running?settings.runMult:1);

  if(isMobile && joystickData.active){
    moveX = joystickData.dx;
    moveZ = joystickData.dy;
  } else {
    if(keys['KeyW']||keys['ArrowUp']) moveZ = -1;
    if(keys['KeyS']||keys['ArrowDown']) moveZ = 1;
    if(keys['KeyA']||keys['ArrowLeft']) moveX = -1;
    if(keys['KeyD']||keys['ArrowRight']) moveX = 1;
  }

  if(moveX!==0 || moveZ!==0){
    const angle = camTheta;
    const sin = Math.sin(angle), cos = Math.cos(angle);
    const dx = (moveX*cos - moveZ*sin) * speed * dt;
    const dz = (moveX*sin + moveZ*cos) * speed * dt;

    const newX = player.position.x + dx;
    const newZ = player.position.z + dz;

    // Building collision
    if(!checkBuildingCollision(newX, newZ, 0.5)){
      player.position.x = newX;
      player.position.z = newZ;
    }

    player.userData.facing = Math.atan2(-dx, -dz);
    player.rotation.y = player.userData.facing;

    // Animation
    const anim = player.userData;
    anim.animTime += dt * (running?12:8);
    const swing = Math.sin(anim.animTime)*0.6;
    anim.lArm.rotation.x = swing;
    anim.rArm.rotation.x = -swing;
    anim.lLeg.rotation.x = -swing;
    anim.rLeg.rotation.x = swing;

    // Footsteps
    footstepTimer -= dt;
    if(footstepTimer <= 0){
      playFootstep();
      footstepTimer = running?0.25:0.4;
    }
  } else {
    // Idle
    const anim = player.userData;
    anim.lArm.rotation.x *= 0.9;
    anim.rArm.rotation.x *= 0.9;
    anim.lLeg.rotation.x *= 0.9;
    anim.rLeg.rotation.x *= 0.9;
  }

  // Jump
  if(keys['Space'] && onGround){
    playerVelY = settings.jumpForce;
    onGround = false;
  }
  playerVelY -= settings.gravity * dt;
  player.position.y += playerVelY * dt;
  if(player.position.y <= 0){
    player.position.y = 0;
    playerVelY = 0;
    onGround = true;
  }

  // Clamp to city
  player.position.x = Math.max(-HALF_CITY-20, Math.min(HALF_CITY+20, player.position.x));
  player.position.z = Math.max(-HALF_CITY-20, Math.min(HALF_CITY+20, player.position.z));
}

function checkBuildingCollision(x, z, radius){
  for(let b of buildings){
    const hw = b.w/2 + radius;
    const hd = b.d/2 + radius;
    if(Math.abs(x - b.x) < hw && Math.abs(z - b.z) < hd) return true;
  }
  return false;
}

function updateCarDriving(dt){
  const car = playerInCar;
  const ud = car.userData;

  let accelInput = 0, steerInput = 0;
  if(isMobile && joystickData.active){
    accelInput = -joystickData.dy;
    steerInput = -joystickData.dx;
  } else {
    if(keys['KeyW']||keys['ArrowUp']) accelInput = 1;
    if(keys['KeyS']||keys['ArrowDown']) accelInput = -1;
    if(keys['KeyA']||keys['ArrowLeft']) steerInput = 1;
    if(keys['KeyD']||keys['ArrowRight']) steerInput = -1;
  }

  if(accelInput > 0) ud.speed += ud.accel * dt * accelInput;
  else if(accelInput < 0) ud.speed += ud.brakeForce * dt * accelInput;
  else ud.speed *= (1 - ud.friction*dt);

  ud.speed = Math.max(-ud.maxSpeed/2, Math.min(ud.maxSpeed, ud.speed));
  if(Math.abs(ud.speed)<0.1) ud.speed = 0;

  // Steering
  if(Math.abs(ud.speed)>0.5){
    ud.heading += steerInput * 2.5 * dt * Math.sign(ud.speed);
  }

  // Move
  const dx = -Math.sin(ud.heading)*ud.speed*dt;
  const dz = -Math.cos(ud.heading)*ud.speed*dt;
  const newX = car.position.x + dx;
  const newZ = car.position.z + dz;

  if(!checkBuildingCollision(newX, newZ, 2.5)){
    car.position.x = newX;
    car.position.z = newZ;
  } else {
    ud.speed *= -0.3; // bounce
  }

  car.rotation.y = ud.heading;

  // Wheel rotation
  const wheelRot = ud.speed*dt*2;
  ud.wheels.forEach(w=>{ w.rotation.x += wheelRot; });

  // Clamp
  car.position.x = Math.max(-HALF_CITY-20, Math.min(HALF_CITY+20, car.position.x));
  car.position.z = Math.max(-HALF_CITY-20, Math.min(HALF_CITY+20, car.position.z));

  updateEngine(ud.speed);
}

function updateNPCs(dt){
  npcs.forEach(npc=>{
    const ud = npc.userData;
    ud.changeDirTimer -= dt;
    if(ud.changeDirTimer <= 0){
      ud.walkDir.set(Math.random()-0.5, 0, Math.random()-0.5).normalize();
      ud.changeDirTimer = 3+Math.random()*5;
    }

    const nx = npc.position.x + ud.walkDir.x*ud.walkSpeed*dt;
    const nz = npc.position.z + ud.walkDir.z*ud.walkSpeed*dt;

    if(!checkBuildingCollision(nx, nz, 0.5) && Math.abs(nx)<HALF_CITY+10 && Math.abs(nz)<HALF_CITY+10){
      npc.position.x = nx;
      npc.position.z = nz;
    } else {
      ud.walkDir.negate();
      ud.changeDirTimer = 1;
    }

    npc.rotation.y = Math.atan2(ud.walkDir.x, ud.walkDir.z);

    // Animation
    ud.animTime += dt*6;
    const s = Math.sin(ud.animTime)*0.5;
    ud.lArm.rotation.x = s;
    ud.rArm.rotation.x = -s;
    ud.lLeg.rotation.x = -s;
    ud.rLeg.rotation.x = s;
  });
}

function updateAttack(dt){
  if(attackTimer > 0){
    attackTimer -= dt;
    const swing = Math.sin((0.3-attackTimer)/0.3*PI)*1.5;
    player.userData.rArm.rotation.x = -swing;
    if(attackTimer <= 0) attacking = false;
  }
}

function updateCamera(){
  const target = playerInCar ? playerInCar.position : player.position;
  const dist = settings.camDist;

  const x = target.x + dist*Math.sin(camTheta)*Math.cos(camPhi);
  const y = target.y + dist*Math.sin(camPhi) + 2;
  const z = target.z + dist*Math.cos(camTheta)*Math.cos(camPhi);

  camera.position.lerp(new THREE.Vector3(x,y,z), 0.1);
  camera.lookAt(target.x, target.y+1.5, target.z);

  // Sun follows camera roughly
  sunLight.position.set(target.x + 50, 80, target.z + 50);
  sunLight.target.position.copy(target);
  sunLight.target.updateMatrixWorld();
}

// ==================== DAY/NIGHT ====================
function updateDayNight(){
  // dayTime: 0=sunrise, 0.25=noon, 0.5=sunset, 0.75=midnight
  const sunAngle = dayTime * PI2;
  const sunY = Math.sin(sunAngle);
  const isNight = sunY < 0;
  const nightFactor = isNight ? Math.min(1, -sunY*2) : 0;
  const dayFactor = isNight ? 0 : Math.min(1, sunY*2);

  // Sky color
  const skyR = 0.2 + dayFactor*0.4;
  const skyG = 0.3 + dayFactor*0.4;
  const skyB = 0.5 + dayFactor*0.3;
  scene.background.setRGB(skyR*(1-nightFactor*0.8), skyG*(1-nightFactor*0.85), skyB*(1-nightFactor*0.7));
  scene.fog.color.copy(scene.background);

  sunLight.intensity = Math.max(0.1, dayFactor);
  ambientLight.intensity = 0.15 + dayFactor*0.35;

  // Street lamps
  const lampOn = nightFactor > 0.2;
  if(window.streetLamps){
    window.streetLamps.forEach(l=>{
      l.light.intensity = lampOn ? 1.5 : 0;
      l.bulb.material.emissive = lampOn ? new THREE.Color(0xffeeaa) : new THREE.Color(0);
      l.bulb.material.emissiveIntensity = lampOn ? 1 : 0;
    });
  }

  // Building windows at night
  buildings.forEach(b=>{
    if(b.mesh.userData.winMats){
      b.mesh.userData.winMats.forEach(m=>{
        if(nightFactor > 0.3){
          m.emissive = new THREE.Color(0xffeeaa);
          m.emissiveIntensity = 0.8;
          m.color.set(0xffeeaa);
        } else {
          m.emissive = new THREE.Color(0);
          m.emissiveIntensity = 0;
          m.color.set(0x88ccff);
        }
      });
    }
  });
}

// ==================== HUD ====================
function updateHUD(){
  document.getElementById('money').textContent = '$ ' + money;
  document.getElementById('health-bar').style.width = health+'%';

  const stars = document.querySelectorAll('.star');
  stars.forEach((s,i)=>{ s.className = 'star'+(i<wantedLevel?' active':''); });

  if(playerInCar){
    const spd = Math.abs(Math.round(playerInCar.userData.speed * 3.6));
    document.getElementById('speed-display').textContent = spd + ' km/h';
  }

  // Interact prompt
  const prompt = document.getElementById('interact-prompt');
  interactTarget = null;
  if(!playerInCar){
    const pp = player.position;
    for(let car of cars){
      if(pp.distanceTo(car.position)<5){ interactTarget = 'car'; break; }
    }
    if(!interactTarget){
      for(let ch of chests){
        if(!ch.userData.opened && pp.distanceTo(ch.position)<3){ interactTarget = 'chest'; break; }
      }
    }
  } else {
    interactTarget = 'exit';
  }

  if(interactTarget === 'car') { prompt.textContent = '[E] Enter Car'; prompt.style.display='block'; }
  else if(interactTarget === 'chest') { prompt.textContent = '[E] Open Chest'; prompt.style.display='block'; }
  else if(interactTarget === 'exit') { prompt.textContent = '[E] Exit Car'; prompt.style.display='block'; }
  else prompt.style.display = 'none';
}

// ==================== MINIMAP ====================
function updateMinimap(){
  const mc = document.getElementById('minimap');
  const ctx = mc.getContext('2d');
  const size = 100, half = size/2;
  const scale = size/(CITY_SIZE*0.5);

  ctx.clearRect(0,0,size,size);

  // Background
  ctx.fillStyle = '#1a2a1a';
  ctx.beginPath();
  ctx.arc(half,half,half,0,PI2);
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(half,half,half-2,0,PI2);
  ctx.clip();

  const target = playerInCar ? playerInCar.position : player.position;
  const facing = playerInCar ? playerInCar.userData.heading : player.userData.facing;

  ctx.translate(half, half);
  ctx.rotate(-facing);

  // Roads
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 2;
  for(let i=0;i<=GRID;i++){
    const r = (-HALF_CITY+i*BLOCK_SIZE - target.x)*scale;
    ctx.beginPath(); ctx.moveTo(r,-half*2); ctx.lineTo(r,half*2); ctx.stroke();
    const r2 = (-HALF_CITY+i*BLOCK_SIZE - target.z)*scale;
    ctx.beginPath(); ctx.moveTo(-half*2,r2); ctx.lineTo(half*2,r2); ctx.stroke();
  }

  // Buildings
  ctx.fillStyle = 'rgba(100,100,100,0.6)';
  buildings.forEach(b=>{
    const bx = (b.x-target.x)*scale;
    const bz = (b.z-target.z)*scale;
    ctx.fillRect(bx-b.w*scale/2, bz-b.d*scale/2, b.w*scale, b.d*scale);
  });

  // Cars
  ctx.fillStyle = '#ff0';
  cars.forEach(c=>{
    const cx = (c.position.x-target.x)*scale;
    const cz = (c.position.z-target.z)*scale;
    ctx.fillRect(cx-2,cz-2,4,4);
  });

  ctx.restore();

  // Player arrow (always center, pointing up)
  ctx.fillStyle = '#0f0';
  ctx.beginPath();
  ctx.moveTo(half, half-6);
  ctx.lineTo(half-4, half+4);
  ctx.lineTo(half+4, half+4);
  ctx.closePath();
  ctx.fill();

  // Border
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(half,half,half-1,0,PI2);
  ctx.stroke();
}

// ==================== RESIZE ====================
function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ==================== START ====================
init();
</script>
