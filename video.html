<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideFlow — יוצר סרטונים</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&display=swap');
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--p:#7c3aed;--p2:#a78bfa;--bg:#09090b;--s1:#18181b;--s2:#1e1e24;--s3:#27272a;--t1:#fafafa;--t2:#a1a1aa;--t3:#71717a;--brd:rgba(255,255,255,0.06);--r:12px;--ease:cubic-bezier(0.16,1,0.3,1)}
        body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--t1);height:100vh;display:flex;flex-direction:column;overflow:hidden}
        .ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
        
        .toolbar{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--s1);border-bottom:1px solid var(--brd);flex-wrap:wrap}
        .tb-btn{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:8px;background:transparent;color:var(--t2);border:1px solid transparent;cursor:pointer;font-family:inherit;font-size:.82em;font-weight:500;transition:all .2s;white-space:nowrap}
        .tb-btn:hover{background:var(--s2);color:var(--t1);border-color:var(--brd)}
        .tb-btn.active{background:var(--p);color:#fff}
        .tb-div{width:1px;height:26px;background:var(--brd);margin:0 3px}
        .btn-icon{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--s2);border:1px solid var(--brd);color:var(--t2);cursor:pointer;transition:all .2s;text-decoration:none}
        .btn-icon:hover{color:var(--t1);border-color:var(--p2)}
        .btn-primary{background:var(--p);border-color:var(--p);color:#fff;padding:7px 18px;border-radius:10px;font-family:inherit;font-size:.85em;font-weight:600;cursor:pointer;border:none;transition:all .3s;display:flex;align-items:center;gap:6px}
        .btn-primary:hover{box-shadow:0 4px 20px rgba(124,58,237,0.3)}
        .btn-danger{background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.2);color:#ef4444;padding:6px 14px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.8em;transition:all .2s}
        .btn-danger:hover{background:rgba(239,68,68,0.25)}
        
        .main{flex:1;display:flex;overflow:hidden}
        
        /* Timeline */
        .timeline-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
        
        /* Preview */
        .preview{flex:1;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px;position:relative}
        .preview-screen{
            width:100%;max-width:700px;aspect-ratio:16/9;background:#000;border-radius:8px;
            box-shadow:0 10px 40px rgba(0,0,0,0.5);position:relative;overflow:hidden;
            display:flex;align-items:center;justify-content:center;
        }
        .preview-screen .frame-content{
            width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
            padding:40px;text-align:center;position:relative;
        }
        .frame-content *{position:relative;z-index:2}
        .frame-content h1{font-size:2.5em;font-weight:900;margin-bottom:8px}
        .frame-content p{font-size:1.1em;opacity:.9}
        
        .play-controls{
            position:absolute;bottom:15px;left:50%;transform:translateX(-50%);
            display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.7);
            padding:8px 18px;border-radius:25px;backdrop-filter:blur(10px);z-index:10;
        }
        .play-btn{background:none;border:none;color:#fff;cursor:pointer;font-size:1.2em;padding:4px 8px;border-radius:8px;transition:background .2s}
        .play-btn:hover{background:rgba(255,255,255,0.15)}
        .time-display{color:#fff;font-size:.8em;min-width:80px;text-align:center}
        .progress-bar{width:200px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;cursor:pointer;position:relative}
        .progress-fill{height:100%;background:var(--p);border-radius:2px;transition:width .1s}
        
        /* Timeline strip */
        .timeline{
            height:160px;background:var(--s1);border-top:1px solid var(--brd);
            display:flex;flex-direction:column;flex-shrink:0;
        }
        .timeline-header{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;border-bottom:1px solid var(--brd)}
        .timeline-label{font-size:.75em;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:1px}
        .timeline-scroll{flex:1;display:flex;gap:6px;padding:10px;overflow-x:auto;align-items:stretch}
        
        .frame-thumb{
            width:130px;min-width:130px;border-radius:8px;border:2px solid transparent;
            cursor:pointer;transition:all .2s;position:relative;overflow:hidden;
            display:flex;align-items:center;justify-content:center;flex-direction:column;
            padding:8px;text-align:center;font-size:.5em;flex-shrink:0;
        }
        .frame-thumb:hover{border-color:var(--p2)}
        .frame-thumb.active{border-color:var(--p);box-shadow:0 0 15px rgba(124,58,237,0.2)}
        .frame-num{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.6);color:#fff;font-size:.55em;padding:1px 6px;border-radius:6px;font-weight:700}
        .frame-dur{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,0.6);color:#fff;font-size:.5em;padding:1px 5px;border-radius:4px}
        .frame-del{position:absolute;top:4px;left:4px;width:18px;height:18px;background:rgba(239,68,68,0.9);color:#fff;border:none;border-radius:50%;font-size:.5em;cursor:pointer;opacity:0;transition:opacity .2s;display:flex;align-items:center;justify-content:center}
        .frame-thumb:hover .frame-del{opacity:1}
        
        .add-frame{
            width:80px;min-width:80px;border:2px dashed var(--brd);border-radius:8px;
            display:flex;align-items:center;justify-content:center;cursor:pointer;
            color:var(--t3);font-size:1.5em;transition:all .2s;flex-shrink:0;
        }
        .add-frame:hover{border-color:var(--p);color:var(--p2)}
        
        /* Sidebar */
        .sidebar{width:260px;background:var(--s1);border-right:1px solid var(--brd);padding:16px;overflow-y:auto;flex-shrink:0}
        .side-label{font-size:.7em;color:var(--t3);font-weight:700;text-transform:uppercase;letter-spacing:1.5px;margin:16px 0 10px}
        .side-label:first-child{margin-top:0}
        .prop-row{margin-bottom:10px}
        .prop-label{font-size:.78em;color:var(--t2);margin-bottom:4px}
        .prop-input{width:100%;padding:8px 12px;border-radius:8px;background:var(--s2);color:var(--t1);border:1px solid var(--brd);font-family:inherit;font-size:.88em}
        .prop-input:focus{outline:none;border-color:var(--p)}
        .prop-row-inline{display:flex;gap:8px}
        .prop-row-inline>*{flex:1}
        
        .bg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
        .bg-swatch{width:100%;aspect-ratio:1;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:all .2s}
        .bg-swatch:hover{transform:scale(1.08);border-color:var(--p2)}
        .bg-swatch.active{border-color:#fff}
        
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--t1);color:var(--bg);padding:12px 24px;border-radius:var(--r);font-size:.88em;box-shadow:0 10px 30px rgba(0,0,0,.3);transition:transform .5s var(--ease);z-index:999}
        .toast.show{transform:translateX(-50%) translateY(0)}
        
        @media(max-width:768px){.sidebar{width:200px}.tb-btn span{display:none}.frame-thumb{width:90px;min-width:90px}}
    </style>
</head>
<body>

<svg style="display:none"><defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></symbol>
    <symbol id="i-skip-back" viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></symbol>
    <symbol id="i-skip-fwd" viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></symbol>
    <symbol id="i-text" viewBox="0 0 24 24"><line x1="17" y1="10" x2="3" y2="10"/><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="14" x2="3" y2="14"/><line x1="17" y1="18" x2="3" y2="18"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
</defs></svg>

<div class="toolbar">
    <a href="index.html" class="btn-icon"><svg class="ico"><use href="#i-home"/></svg></a>
    <input type="text" class="prop-input" id="vidTitle" value="סרטון חדש" style="max-width:200px;padding:5px 10px;font-weight:600;font-size:.9em" oninput="save()">
    <div class="tb-div"></div>
    <div class="tb-btn" onclick="addFrame()"><svg class="ico"><use href="#i-type"/></svg><span>פריים חדש</span></div>
    <div class="tb-btn" onclick="dupFrame()"><svg class="ico"><use href="#i-copy"/></svg><span>שכפל</span></div>
    <div style="flex:1"></div>
    <button class="btn-primary" onclick="exportVideo()"><svg class="ico" style="color:#fff"><use href="#i-download"/></svg> ייצוא</button>
</div>

<div class="main">
    <div class="sidebar">
        <div class="side-label">פריים נוכחי</div>
        
        <div class="prop-row">
            <div class="prop-label">כותרת</div>
            <input type="text" class="prop-input" id="fTitle" oninput="updateFrame()" placeholder="כותרת...">
        </div>
        <div class="prop-row">
            <div class="prop-label">תת כותרת</div>
            <input type="text" class="prop-input" id="fSub" oninput="updateFrame()" placeholder="טקסט נוסף...">
        </div>
        <div class="prop-row-inline">
            <div class="prop-row">
                <div class="prop-label">גודל כותרת</div>
                <select class="prop-input" id="fTitleSize" onchange="updateFrame()">
                    <option value="1.5em">קטן</option>
                    <option value="2.5em" selected>בינוני</option>
                    <option value="3.5em">גדול</option>
                    <option value="5em">ענק</option>
                </select>
            </div>
            <div class="prop-row">
                <div class="prop-label">משך (שניות)</div>
                <input type="number" class="prop-input" id="fDur" min="0.5" max="30" step="0.5" value="3" onchange="updateFrame()">
            </div>
        </div>
        <div class="prop-row">
            <div class="prop-label">צבע טקסט</div>
            <input type="color" class="prop-input" id="fColor" value="#ffffff" onchange="updateFrame()" style="height:36px;padding:2px;cursor:pointer">
        </div>
        
        <div class="side-label">רקע</div>
        <div class="bg-grid" id="bgGrid"></div>
        <div class="prop-row" style="margin-top:8px">
            <input type="color" class="prop-input" id="fBgColor" value="#000000" onchange="setBgColor(this.value)" style="height:36px;padding:2px;cursor:pointer">
        </div>
        
        <div class="side-label">אנימציית כניסה</div>
        <select class="prop-input" id="fAnim" onchange="updateFrame()">
            <option value="fade">Fade In</option>
            <option value="slideUp">Slide Up</option>
            <option value="slideRight">Slide Right</option>
            <option value="scaleUp">Scale Up</option>
            <option value="typewriter">Typewriter</option>
            <option value="bounce">Bounce</option>
        </select>
    </div>
    
    <div class="timeline-area">
        <div class="preview">
            <div class="preview-screen" id="previewScreen">
                <div class="frame-content" id="frameContent"></div>
            </div>
            <div class="play-controls">
                <button class="play-btn" onclick="prevFrame()">⏮</button>
                <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="play-btn" onclick="nextFrame()">⏭</button>
                <div class="progress-bar" onclick="seekTo(event)"><div class="progress-fill" id="progressFill"></div></div>
                <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
            </div>
        </div>
        
        <div class="timeline">
            <div class="timeline-header">
                <span class="timeline-label">ציר הזמן</span>
                <span style="font-size:.75em;color:var(--t3)" id="totalDur">0s</span>
            </div>
            <div class="timeline-scroll" id="timelineScroll"></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BG=[
    'linear-gradient(135deg,#1a1a2e,#16213e)','linear-gradient(135deg,#667eea,#764ba2)',
    'linear-gradient(135deg,#f093fb,#f5576c)','linear-gradient(135deg,#0093E9,#80D0C7)',
    'linear-gradient(135deg,#11998e,#38ef7d)','linear-gradient(135deg,#0c0c0c,#1a1a2e)',
    'linear-gradient(135deg,#FA8BFF,#2BD2FF,#2BFF88)','#000000',
    'linear-gradient(135deg,#fc5c7d,#6a82fb)','linear-gradient(135deg,#ff6a00,#ee0979)',
    'linear-gradient(135deg,#ffecd2,#fcb69f)','linear-gradient(135deg,#2d1b69,#11001c)',
];

const ANIMS={
    fade:'@keyframes anim{from{opacity:0}to{opacity:1}}',
    slideUp:'@keyframes anim{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}',
    slideRight:'@keyframes anim{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}',
    scaleUp:'@keyframes anim{from{opacity:0;transform:scale(0.7)}to{opacity:1;transform:scale(1)}}',
    bounce:'@keyframes anim{0%{opacity:0;transform:scale(0.3)}50%{transform:scale(1.05)}70%{transform:scale(0.95)}100%{opacity:1;transform:scale(1)}}',
    typewriter:'@keyframes anim{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}',
};

let frames=[
    {title:'הסרטון שלי',sub:'ברוכים הבאים',bg:BG[0],color:'#fff',titleSize:'3.5em',dur:3,anim:'fade'},
    {title:'נקודה ראשונה',sub:'תוכן מעניין',bg:BG[1],color:'#fff',titleSize:'2.5em',dur:3,anim:'slideUp'},
    {title:'תודה שצפיתם!',sub:'',bg:BG[5],color:'#fff',titleSize:'3.5em',dur:3,anim:'scaleUp'},
];
let FI=0,playing=false,playTimer=null;

function renderBg(){
    document.getElementById('bgGrid').innerHTML=BG.map((b,i)=>`<div class="bg-swatch" style="background:${b}" onclick="setFrameBg(${i})"></div>`).join('');
}

function renderTimeline(){
    document.getElementById('timelineScroll').innerHTML=frames.map((f,i)=>`
        <div class="frame-thumb ${i===FI?'active':''}" style="background:${f.bg}" onclick="goFrame(${i})">
            <span class="frame-num">${i+1}</span>
            <span style="color:${f.color};font-size:${parseFloat(f.titleSize)*0.15}em;font-weight:700;overflow:hidden;max-width:90%;white-space:nowrap;text-overflow:ellipsis">${f.title}</span>
            <span class="frame-dur">${f.dur}s</span>
            ${frames.length>1?`<button class="frame-del" onclick="event.stopPropagation();removeFrame(${i})">✕</button>`:''}
        </div>
    `).join('')+`<div class="add-frame" onclick="addFrame()">+</div>`;
    
    const total=frames.reduce((s,f)=>s+f.dur,0);
    document.getElementById('totalDur').textContent=total.toFixed(1)+'s';
    updateTimeDisplay();
}

function renderPreview(){
    const f=frames[FI];
    const screen=document.getElementById('previewScreen');
    screen.style.background=f.bg;
    
    // Inject animation
    let style=document.getElementById('animStyle');
    if(!style){style=document.createElement('style');style.id='animStyle';document.head.appendChild(style)}
    style.textContent=ANIMS[f.anim]||ANIMS.fade;
    
    document.getElementById('frameContent').innerHTML=`
        <h1 style="color:${f.color};font-size:${f.titleSize};animation:anim 0.8s ease both">${f.title}</h1>
        ${f.sub?`<p style="color:${f.color};animation:anim 0.8s 0.2s ease both">${f.sub}</p>`:''}
    `;
}

function loadProps(){
    const f=frames[FI];
    document.getElementById('fTitle').value=f.title;
    document.getElementById('fSub').value=f.sub||'';
    document.getElementById('fTitleSize').value=f.titleSize;
    document.getElementById('fDur').value=f.dur;
    document.getElementById('fColor').value=f.color;
    document.getElementById('fAnim').value=f.anim;
}

function updateFrame(){
    const f=frames[FI];
    f.title=document.getElementById('fTitle').value;
    f.sub=document.getElementById('fSub').value;
    f.titleSize=document.getElementById('fTitleSize').value;
    f.dur=parseFloat(document.getElementById('fDur').value)||3;
    f.color=document.getElementById('fColor').value;
    f.anim=document.getElementById('fAnim').value;
    renderPreview();renderTimeline();save();
}

function setFrameBg(i){frames[FI].bg=BG[i];renderPreview();renderTimeline();save()}
function setBgColor(c){frames[FI].bg=c;renderPreview();renderTimeline();save()}

function goFrame(i){FI=i;renderTimeline();renderPreview();loadProps();if(playing)stopPlay()}
function addFrame(){
    const last=frames[frames.length-1];
    frames.push({title:'פריים חדש',sub:'',bg:last.bg,color:last.color,titleSize:'2.5em',dur:3,anim:'slideUp'});
    FI=frames.length-1;renderTimeline();renderPreview();loadProps();save();toast('פריים חדש נוסף');
}
function removeFrame(i){if(frames.length<=1)return;frames.splice(i,1);if(FI>=frames.length)FI=frames.length-1;renderTimeline();renderPreview();loadProps();save()}
function dupFrame(){
    frames.splice(FI+1,0,JSON.parse(JSON.stringify(frames[FI])));FI++;
    renderTimeline();renderPreview();loadProps();save();toast('פריים שוכפל');
}

// Playback
function togglePlay(){playing?stopPlay():startPlay()}
function startPlay(){
    playing=true;document.getElementById('playBtn').textContent='⏸';
    playNextFrame();
}
function stopPlay(){
    playing=false;document.getElementById('playBtn').textContent='▶';
    clearTimeout(playTimer);
}
function playNextFrame(){
    if(!playing)return;
    renderPreview();updateProgress();
    const dur=frames[FI].dur*1000;
    playTimer=setTimeout(()=>{
        if(FI<frames.length-1){FI++;renderTimeline();loadProps();playNextFrame()}
        else{stopPlay();FI=0;renderTimeline();renderPreview();loadProps()}
    },dur);
}
function nextFrame(){if(FI<frames.length-1){FI++;goFrame(FI)}}
function prevFrame(){if(FI>0){FI--;goFrame(FI)}}

function updateProgress(){
    const total=frames.reduce((s,f)=>s+f.dur,0);
    let elapsed=0;for(let i=0;i<FI;i++)elapsed+=frames[i].dur;
    const pct=(elapsed/total)*100;
    document.getElementById('progressFill').style.width=pct+'%';
}

function updateTimeDisplay(){
    const total=frames.reduce((s,f)=>s+f.dur,0);
    let elapsed=0;for(let i=0;i<FI;i++)elapsed+=frames[i].dur;
    document.getElementById('timeDisplay').textContent=`${elapsed.toFixed(1)}s / ${total.toFixed(1)}s`;
    updateProgress();
}

function seekTo(e){
    const rect=e.target.getBoundingClientRect();
    const pct=(e.clientX-rect.left)/rect.width;
    const total=frames.reduce((s,f)=>s+f.dur,0);
    let target=pct*total,acc=0;
    for(let i=0;i<frames.length;i++){acc+=frames[i].dur;if(acc>=target){goFrame(i);break}}
}

function exportVideo(){
    // Generate an HTML slideshow file
    const html=`<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${document.getElementById('vidTitle').value}</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Heebo',sans-serif;overflow:hidden}
.slide{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;position:fixed;top:0;left:0;opacity:0;transition:opacity 0.5s}
.slide.active{opacity:1}
.slide h1{margin-bottom:10px}
${Object.entries(ANIMS).map(([k,v])=>v.replace('anim','a-'+k)).join('\n')}
</style></head><body>
${frames.map((f,i)=>`<div class="slide ${i===0?'active':''}" id="s${i}" style="background:${f.bg}">
<h1 style="color:${f.color};font-size:${f.titleSize};animation:a-${f.anim} 0.8s ease both">${f.title}</h1>
${f.sub?`<p style="color:${f.color};font-size:1.2em;animation:a-${f.anim} 0.8s 0.2s ease both">${f.sub}</p>`:''}
</div>`).join('\n')}
<script>
let ci=0,slides=document.querySelectorAll('.slide'),durs=[${frames.map(f=>f.dur*1000).join(',')}];
function next(){slides[ci].classList.remove('active');ci=(ci+1)%slides.length;slides[ci].classList.add('active');setTimeout(next,durs[ci])}
setTimeout(next,durs[0]);
document.addEventListener('click',()=>{slides[ci].classList.remove('active');ci=(ci+1)%slides.length;slides[ci].classList.add('active')});
<\/script></body></html>`;
