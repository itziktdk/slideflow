<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlideFlow — יוצר מצגות מקצועי</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;900&display=swap');
        
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --p: #7c3aed; --p2: #a78bfa; --p3: #5b21b6; --p4: #ede9fe;
            --bg: #09090b; --s1: #18181b; --s2: #1e1e24; --s3: #27272a;
            --t1: #fafafa; --t2: #a1a1aa; --t3: #71717a;
            --acc: #06b6d4; --acc2: #f59e0b; --err: #ef4444; --ok: #10b981;
            --brd: rgba(255,255,255,0.06);
            --glow: 0 0 20px rgba(124,58,237,0.15);
            --glass: rgba(255,255,255,0.03);
            --r: 12px; --r2: 16px; --r3: 20px;
            --transition: cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        body { font-family:'Heebo',sans-serif; background:var(--bg); color:var(--t1); height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased; }
        
        /* ===== UTILITY ===== */
        .screen { display:none; height:100vh; }
        .screen.active { display:flex; }
        
        /* ===== ICONS (SVG) ===== */
        .ico { width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
        .ico-sm { width:14px; height:14px; }
        .ico-lg { width:22px; height:22px; }
        .ico-xl { width:32px; height:32px; }
        
        /* ===== BUTTONS ===== */
        .btn {
            display:inline-flex; align-items:center; gap:8px; padding:10px 22px;
            border-radius:var(--r); border:1px solid var(--brd); background:var(--s2);
            color:var(--t1); font-family:inherit; font-size:0.9em; font-weight:600;
            cursor:pointer; transition:all 0.4s var(--transition); position:relative; overflow:hidden;
        }
        .btn::before {
            content:''; position:absolute; inset:0; opacity:0;
            background:linear-gradient(135deg, rgba(124,58,237,0.1), rgba(6,182,212,0.1));
            transition:opacity 0.4s;
        }
        .btn:hover { border-color:var(--p2); transform:translateY(-1px); box-shadow:var(--glow); }
        .btn:hover::before { opacity:1; }
        .btn:active { transform:scale(0.97); }
        
        .btn-primary {
            background:linear-gradient(135deg, var(--p), var(--p3));
            border-color:var(--p); color:#fff;
            box-shadow:0 4px 25px rgba(124,58,237,0.25);
        }
        .btn-primary:hover { box-shadow:0 8px 40px rgba(124,58,237,0.4); border-color:var(--p2); }
        
        .btn-ghost { background:transparent; border-color:transparent; }
        .btn-ghost:hover { background:var(--s2); border-color:var(--brd); }
        
        .btn-danger { background:rgba(239,68,68,0.1); border-color:rgba(239,68,68,0.2); color:var(--err); }
        .btn-danger:hover { background:rgba(239,68,68,0.2); box-shadow:0 0 20px rgba(239,68,68,0.15); }
        
        .btn-sm { padding:6px 14px; font-size:0.82em; border-radius:var(--r); }
        
        .btn-icon {
            width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center;
            border-radius:10px; background:var(--s2); border:1px solid var(--brd);
            color:var(--t2); cursor:pointer; transition:all 0.3s var(--transition);
        }
        .btn-icon:hover { color:var(--t1); border-color:var(--p2); background:var(--s3); box-shadow:var(--glow); }
        
        /* ===== HOME ===== */
        #homeScreen {
            flex-direction:column; align-items:center; justify-content:center; gap:35px;
            background:var(--bg);
            background-image:
                radial-gradient(ellipse at 25% 0%, rgba(124,58,237,0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 75% 100%, rgba(6,182,212,0.06) 0%, transparent 50%);
        }
        
        .home-logo {
            width:72px; height:72px; border-radius:20px;
            background:linear-gradient(135deg, var(--p), var(--acc));
            display:flex; align-items:center; justify-content:center;
            box-shadow:0 8px 40px rgba(124,58,237,0.3);
            animation:float 4s ease-in-out infinite;
        }
        @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
        
        .home-title {
            font-size:3.2em; font-weight:900; letter-spacing:-1px;
            background:linear-gradient(135deg, #fff 0%, var(--t2) 100%);
            -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        }
        .home-sub { color:var(--t3); font-size:1.05em; margin-top:-15px; font-weight:300; }
        .home-actions { display:flex; gap:12px; }
        
        .recent-section { max-width:750px; width:92%; }
        .recent-label { font-size:0.8em; color:var(--t3); font-weight:600; text-transform:uppercase; letter-spacing:1.5px; margin-bottom:14px; }
        .recent-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; }
        
        .recent-card {
            background:var(--s1); border:1px solid var(--brd); border-radius:var(--r2);
            padding:18px; cursor:pointer; transition:all 0.4s var(--transition); position:relative;
        }
        .recent-card:hover { border-color:var(--p2); transform:translateY(-3px); box-shadow:0 12px 35px rgba(0,0,0,0.3), var(--glow); }
        .recent-card .rc-name { font-weight:700; font-size:0.95em; margin-bottom:5px; }
        .recent-card .rc-meta { font-size:0.75em; color:var(--t3); }
        .recent-card .rc-del {
            position:absolute; top:10px; left:10px; width:24px; height:24px; border-radius:50%;
            background:var(--err); color:#fff; border:none; font-size:0.65em; cursor:pointer;
            opacity:0; transition:opacity 0.2s; display:flex; align-items:center; justify-content:center;
        }
        .recent-card:hover .rc-del { opacity:1; }
        .recent-card .rc-preview {
            width:100%; height:4px; border-radius:2px; margin-top:10px; opacity:0.6;
        }
        
        .empty-state { text-align:center; padding:40px; color:var(--t3); font-size:0.9em; grid-column:1/-1; }
        
        /* ===== TEMPLATES ===== */
        #templateScreen { flex-direction:column; padding:30px; gap:25px; background:var(--bg); }
        .tmpl-header { display:flex; justify-content:space-between; align-items:center; }
        .tmpl-header h2 { font-size:1.5em; font-weight:800; }
        
        .tmpl-grid {
            display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
            gap:16px; overflow-y:auto; padding-bottom:20px;
        }
        
        .tmpl-card {
            border-radius:var(--r2); overflow:hidden; cursor:pointer;
            transition:all 0.4s var(--transition); border:2px solid transparent;
            background:var(--s1);
        }
        .tmpl-card:hover { transform:translateY(-5px) scale(1.01); border-color:var(--p); box-shadow:0 15px 40px rgba(0,0,0,0.4), var(--glow); }
        
        .tmpl-preview {
            height:140px; display:flex; align-items:center; justify-content:center;
            font-size:1.15em; font-weight:700; padding:20px; text-align:center; position:relative; overflow:hidden;
        }
        .tmpl-preview::after {
            content:''; position:absolute; inset:0;
            background:linear-gradient(transparent 60%, rgba(0,0,0,0.3));
        }
        .tmpl-info { padding:14px 16px; }
        .tmpl-info .name { font-weight:700; font-size:0.95em; }
        .tmpl-info .desc { font-size:0.75em; color:var(--t3); margin-top:3px; }
        
        /* ===== EDITOR ===== */
        #editorScreen { flex-direction:column; }
        
        .toolbar {
            display:flex; align-items:center; gap:6px; padding:6px 12px;
            background:var(--s1); border-bottom:1px solid var(--brd);
            flex-shrink:0; flex-wrap:wrap; min-height:48px;
        }
        
        .toolbar-title {
            font-weight:600; font-size:0.92em; padding:5px 10px;
            background:transparent; border:1px solid transparent; border-radius:8px;
            color:var(--t1); font-family:inherit; cursor:text; min-width:120px;
        }
        .toolbar-title:hover { border-color:var(--brd); }
        .toolbar-title:focus { outline:none; border-color:var(--p); background:var(--s2); }
        
        .tb-div { width:1px; height:26px; background:var(--brd); margin:0 3px; flex-shrink:0; }
        .tb-group { display:flex; gap:3px; align-items:center; }
        
        .tb-btn {
            display:flex; align-items:center; gap:5px; padding:5px 10px;
            border-radius:8px; background:transparent; color:var(--t2);
            border:1px solid transparent; cursor:pointer; font-family:inherit;
            font-size:0.82em; font-weight:500; transition:all 0.25s var(--transition);
            white-space:nowrap;
        }
        .tb-btn:hover { background:var(--s2); color:var(--t1); border-color:var(--brd); }
        .tb-btn.active { background:var(--p); color:#fff; border-color:var(--p); }
        
        .tb-select {
            padding:4px 8px; border-radius:8px; background:var(--s2); color:var(--t1);
            border:1px solid var(--brd); font-family:inherit; font-size:0.82em; cursor:pointer;
        }
        .tb-select:focus { outline:none; border-color:var(--p); }
        
        .tb-color {
            width:28px; height:28px; border:2px solid var(--brd); border-radius:8px;
            cursor:pointer; transition:all 0.2s; padding:0;
        }
        .tb-color:hover { border-color:var(--p2); transform:scale(1.1); }
        
        .editor-main { display:flex; flex:1; overflow:hidden; }
        
        /* Sidebar */
        .sidebar {
            width:210px; background:var(--s1); border-right:1px solid var(--brd);
            padding:14px; overflow-y:auto; flex-shrink:0;
        }
        .side-label {
            font-size:0.7em; color:var(--t3); font-weight:700; text-transform:uppercase;
            letter-spacing:1.5px; margin-bottom:10px; margin-top:16px;
        }
        .side-label:first-child { margin-top:0; }
        
        .bg-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
        .bg-swatch {
            width:100%; aspect-ratio:1; border-radius:8px; cursor:pointer;
            border:2px solid transparent; transition:all 0.25s var(--transition);
        }
        .bg-swatch:hover { transform:scale(1.1); border-color:var(--p2); }
        .bg-swatch.active { border-color:#fff; box-shadow:var(--glow); }
        
        .shape-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
        .shape-btn {
            aspect-ratio:1; border-radius:10px; background:var(--s2); border:1px solid var(--brd);
            cursor:pointer; display:flex; align-items:center; justify-content:center;
            transition:all 0.25s var(--transition); color:var(--t2);
        }
        .shape-btn:hover { background:var(--s3); border-color:var(--p2); color:var(--t1); box-shadow:var(--glow); transform:scale(1.03); }
        
        .icon-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:5px; }
        .icon-btn {
            aspect-ratio:1; border-radius:8px; background:var(--s2); border:1px solid var(--brd);
            cursor:pointer; display:flex; align-items:center; justify-content:center;
            transition:all 0.25s var(--transition); color:var(--t2);
        }
        .icon-btn:hover { background:var(--s3); border-color:var(--p2); color:var(--p2); box-shadow:var(--glow); }
        
        /* Canvas */
        .canvas-wrap {
            flex:1; display:flex; align-items:center; justify-content:center;
            padding:25px; background:var(--bg); overflow:hidden; position:relative;
        }
        
        .canvas {
            width:100%; max-width:880px; aspect-ratio:16/9; border-radius:var(--r);
            position:relative; overflow:hidden;
            box-shadow:0 25px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.04);
        }
        
        .el {
            position:absolute; cursor:move; padding:8px 14px; border:2px solid transparent;
            border-radius:6px; transition:border-color 0.2s; min-width:30px; min-height:20px; outline:none;
        }
        .el:hover { border-color:rgba(124,58,237,0.3); }
        .el.sel { border-color:var(--p); box-shadow:0 0 0 3px rgba(124,58,237,0.15); }
        .el:focus { border-color:var(--p); }
        .el.txt { font-family:'Heebo',sans-serif; cursor:text; }
        .el.txt:focus { background:rgba(124,58,237,0.08); border-color:var(--p); cursor:text; }
        .el.shp { padding:0; display:flex; align-items:center; justify-content:center; }
        
        /* Slide panel */
        .slide-panel {
            width:170px; background:var(--s1); border-left:1px solid var(--brd);
            overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; flex-shrink:0;
        }
        
        .sl-thumb {
            border-radius:10px; overflow:hidden; cursor:pointer; border:2px solid transparent;
            transition:all 0.25s var(--transition); position:relative; aspect-ratio:16/9;
            display:flex; align-items:center; justify-content:center; font-size:0.5em; padding:6px; text-align:center;
        }
        .sl-thumb:hover { border-color:var(--p2); }
        .sl-thumb.active { border-color:var(--p); box-shadow:0 0 18px rgba(124,58,237,0.25); }
        .sl-num {
            position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.65);
            color:#fff; font-size:0.55em; padding:1px 6px; border-radius:8px; font-weight:700; backdrop-filter:blur(4px);
        }
        .sl-del {
            position:absolute; bottom:4px; left:4px; width:18px; height:18px;
            background:var(--err); color:#fff; border:none; border-radius:50%;
            font-size:0.5em; cursor:pointer; opacity:0; transition:opacity 0.2s;
            display:flex; align-items:center; justify-content:center;
        }
        .sl-thumb:hover .sl-del { opacity:1; }
        
        .add-sl {
            border:2px dashed var(--brd); border-radius:10px; padding:12px;
            text-align:center; cursor:pointer; color:var(--t3); font-size:0.78em;
            font-weight:500; transition:all 0.25s var(--transition);
        }
        .add-sl:hover { border-color:var(--p); color:var(--p2); }
        
        /* Bottom bar */
        .bottom-bar {
            display:flex; align-items:center; justify-content:space-between;
            padding:6px 14px; background:var(--s1); border-top:1px solid var(--brd); flex-shrink:0;
        }
        .counter { font-size:0.82em; color:var(--t3); }
        .bottom-actions { display:flex; gap:6px; }
        
        /* ===== PRESENT ===== */
        #presentScreen { background:#000; align-items:center; justify-content:center; }
        .pres-slide {
            width:100vw; height:100vh; position:relative; overflow:hidden;
            animation:slideReveal 0.5s var(--transition);
        }
        @keyframes slideReveal { from{opacity:0;transform:scale(0.97)} to{opacity:1;transform:scale(1)} }
        .pres-el {
            position:absolute;
            animation:elReveal 0.6s var(--transition) backwards;
        }
        @keyframes elReveal { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .pres-ctrl {
            position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
            display:flex; gap:8px; background:rgba(0,0,0,0.75); padding:8px 18px;
            border-radius:30px; backdrop-filter:blur(15px); border:1px solid rgba(255,255,255,0.1);
            opacity:0; transition:opacity 0.3s;
        }
        #presentScreen:hover .pres-ctrl { opacity:1; }
        .pres-btn {
            background:rgba(255,255,255,0.1); border:none; color:#fff;
            padding:7px 18px; border-radius:20px; cursor:pointer; font-family:inherit;
            font-size:0.85em; font-weight:500; transition:all 0.2s;
        }
        .pres-btn:hover { background:rgba(255,255,255,0.2); }
        
        /* ===== TOAST ===== */
        .toast {
            position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px);
            background:var(--s2); color:var(--t1); padding:12px 24px; border-radius:var(--r);
            font-size:0.88em; box-shadow:0 10px 35px rgba(0,0,0,0.5); border:1px solid var(--brd);
            transition:transform 0.5s var(--transition); z-index:9999; backdrop-filter:blur(10px);
        }
        .toast.show { transform:translateX(-50%) translateY(0); }
        
        /* ===== RESPONSIVE ===== */
        @media(max-width:768px) {
            .sidebar { display:none; }
            .slide-panel { width:55px; }
            .sl-thumb { font-size:0.3em; }
            .tb-btn span { display:none; }
            .home-title { font-size:2.2em; }
            .tmpl-grid { grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); }
        }
    </style>
</head>
<body>

<!-- ===== HOME ===== -->

<div class="toast" id="toast"></div>

<script>
let DB=JSON.parse(localStorage.getItem('sf2')||'[]'),P=null,SI=0,SEL=null,DRG=null,PI=0;

const BG=[
    'linear-gradient(135deg,#1a1a2e,#16213e)','linear-gradient(135deg,#667eea,#764ba2)',
    'linear-gradient(135deg,#f093fb,#f5576c)','linear-gradient(135deg,#0093E9,#80D0C7)',
    'linear-gradient(135deg,#11998e,#38ef7d)','linear-gradient(135deg,#0c0c0c,#1a1a2e)',
    'linear-gradient(135deg,#FA8BFF,#2BD2FF,#2BFF88)','#ffffff',
    'linear-gradient(135deg,#fc5c7d,#6a82fb)','linear-gradient(135deg,#a8edea,#fed6e3)',
    'linear-gradient(135deg,#ffecd2,#fcb69f)','linear-gradient(135deg,#2d1b69,#11001c)',
];

const T=[
    {n:'מינימלי',d:'התחל מאפס',bg:BG[0],c:'#fff',s:[{bg:BG[0],els:[{t:'text',txt:'כותרת המצגת',x:50,y:35,fs:48,fw:700,c:'#fff'},{t:'text',txt:'תת כותרת',x:50,y:55,fs:24,fw:300,c:'#aaa'}]}]},
    {n:'סגול חלומי',d:'מודרני וחלק',bg:BG[1],c:'#fff',s:[{bg:BG[1],els:[{t:'text',txt:'כותרת מדהימה',x:50,y:30,fs:44,fw:900,c:'#fff'},{t:'text',txt:'הוסף תוכן כאן',x:50,y:55,fs:20,fw:400,c:'rgba(255,255,255,0.8)'}]}]},
    {n:'שקיעה',d:'חמים ונעימים',bg:BG[2],c:'#fff',s:[{bg:BG[2],els:[{t:'text',txt:'שקיעה',x:50,y:30,fs:52,fw:900,c:'#fff'},{t:'text',txt:'מצגת יפהפייה',x:50,y:55,fs:22,fw:400,c:'rgba(255,255,255,0.85)'}]}]},
    {n:'אוקיינוס',d:'כחול ותכלת',bg:BG[3],c:'#fff',s:[{bg:BG[3],els:[{t:'text',txt:'אוקיינוס',x:50,y:30,fs:48,fw:900,c:'#fff'},{t:'text',txt:'צלילה לעומק',x:50,y:55,fs:22,fw:400,c:'rgba(255,255,255,0.85)'}]}]},
    {n:'יער',d:'ירוק ורענן',bg:BG[4],c:'#fff',s:[{bg:BG[4],els:[{t:'text',txt:'טבע',x:50,y:30,fs:48,fw:900,c:'#fff'},{t:'text',txt:'ירוק ומרענן',x:50,y:55,fs:22,fw:400,c:'rgba(255,255,255,0.85)'}]}]},
    {n:'לילה',d:'כהה ואלגנטי',bg:BG[5],c:'#fff',s:[{bg:BG[5],els:[{t:'text',txt:'מצגת לילה',x:50,y:30,fs:48,fw:900,c:'#fff'},{t:'text',txt:'אלגנטי ומינימליסטי',x:50,y:55,fs:22,fw:400,c:'#888'}]}]},
    {n:'קשת',d:'צבעוני ושמח',bg:BG[6],c:'#fff',s:[{bg:BG[6],els:[{t:'text',txt:'קשת צבעים',x:50,y:30,fs:48,fw:900,c:'#fff'},{t:'text',txt:'צבעוני ושמח',x:50,y:55,fs:22,fw:400,c:'rgba(255,255,255,0.9)'}]}]},
    {n:'לבן נקי',d:'מקצועי ומינימלי',bg:BG[7],c:'#333',s:[{bg:BG[7],els:[{t:'text',txt:'כותרת',x:50,y:35,fs:48,fw:900,c:'#333'},{t:'text',txt:'תת כותרת',x:50,y:55,fs:22,fw:400,c:'#888'}]}]},
];

const SVG_SHAPES={
    square:'<rect x="2" y="2" width="44" height="44" rx="4"/>',
    circle:'<circle cx="24" cy="24" r="22"/>',
    triangle:'<polygon points="24,2 46,46 2,46"/>',
    star:'<polygon points="24,2 29.5,17.5 46,18.5 33,29 37,46 24,37 11,46 15,29 2,18.5 18.5,17.5"/>',
    heart:'<path d="M24,44 C8,30 2,20 2,14 A10,10,0,0,1,24,10 A10,10,0,0,1,46,14 C46,20 40,30 24,44Z"/>',
    line:'<line x1="4" y1="24" x2="44" y2="24" stroke-width="4"/>'
};

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function showTemplates(){showScreen('templateScreen');renderTmpl()}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

function renderTmpl(){
    document.getElementById('tmplGrid').innerHTML=T.map((t,i)=>`
        <div class="tmpl-card" onclick="create(${i})">
            <div class="tmpl-preview" style="background:${t.bg};color:${t.c};">${t.s[0].els[0].txt}</div>
            <div class="tmpl-info"><div class="name">${t.n}</div><div class="desc">${t.d}</div></div>
        </div>`).join('');
}

function renderRecent(){
    const g=document.getElementById('recentGrid');
    if(!DB.length){g.innerHTML='<div class="empty-state">אין מצגות עדיין — צור אחת חדשה</div>';return}
    g.innerHTML=DB.map(p=>`
        <div class="recent-card" onclick="load(${p.id})">
            <button class="rc-del" onclick="del(${p.id},event)">✕</button>
            <div class="rc-name">${p.name}</div>
            <div class="rc-meta">${p.slides.length} שקופיות</div>
            <div class="rc-preview" style="background:${p.slides[0].bg}"></div>
        </div>`).join('');
}

function save(){if(!P)return;const i=DB.findIndex(p=>p.id===P.id);if(i>=0)DB[i]=P;else DB.unshift(P);localStorage.setItem('sf2',JSON.stringify(DB))}

function create(ti){
    const t=T[ti];P={id:Date.now(),name:t.n,slides:JSON.parse(JSON.stringify(t.s))};
    SI=0;document.getElementById('presTitle').value=P.name;save();openEd();
}
function load(id){P=DB.find(p=>p.id===id);if(!P)return;SI=0;document.getElementById('presTitle').value=P.name;openEd()}
function del(id,e){e.stopPropagation();DB=DB.filter(p=>p.id!==id);localStorage.setItem('sf2',JSON.stringify(DB));renderRecent();toast('מצגת נמחקה')}

function openEd(){showScreen('editorScreen');renderSl();renderCv();renderBg();updCnt()}

function renderBg(){
    document.getElementById('bgGrid').innerHTML=BG.map((b,i)=>`<div class="bg-swatch" style="background:${b}" onclick="setBg(${i})"></div>`).join('');
}

function renderSl(){
    document.getElementById('slPanel').innerHTML=P.slides.map((s,i)=>`
        <div class="sl-thumb ${i===SI?'active':''}" style="background:${s.bg}" onclick="goSl(${i})">
            <span class="sl-num">${i+1}</span>
            ${s.els.filter(e=>e.t==='text').map(e=>`<span style="color:${e.c};font-size:${Math.max(e.fs*0.12,4)}px;font-weight:${e.fw};position:absolute;top:${e.y}%;left:${e.x}%;transform:translate(-50%,-50%);white-space:nowrap;overflow:hidden;max-width:90%;">${e.txt}</span>`).join('')}
            ${P.slides.length>1?`<button class="sl-del" onclick="rmSl(${i},event)">✕</button>`:''}
        </div>`).join('')+`<div class="add-sl" onclick="addSl()">+ שקופית</div>`;
}

function renderCv(){
    const cv=document.getElementById('canvas'),sl=P.slides[SI];
    cv.style.background=sl.bg;
    cv.innerHTML=sl.els.map((e,i)=>{
        if(e.t==='text')return`<div class="el txt" data-i="${i}" contenteditable="true" style="left:${e.x}%;top:${e.y}%;transform:translate(-50%,-50%);font-size:${e.fs}px;font-weight:${e.fw};color:${e.c};text-align:center;font-style:${e.fi||'normal'}" onmousedown="dragStart(event,${i})" onfocus="sel(${i})" oninput="updTxt(${i},this.textContent)">${e.txt}</div>`;
        if(e.t==='shape')return`<div class="el shp" data-i="${i}" style="left:${e.x}%;top:${e.y}%;transform:translate(-50%,-50%);width:${e.w||60}px;height:${e.h||60}px;color:${e.c||'#fff'}" onmousedown="dragStart(event,${i})" onclick="sel(${i})"><svg viewBox="0 0 48 48" style="width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;">${SVG_SHAPES[e.shape]||''}</svg></div>`;
        if(e.t==='icon')return`<div class="el shp" data-i="${i}" style="left:${e.x}%;top:${e.y}%;transform:translate(-50%,-50%);width:${e.w||48}px;height:${e.h||48}px;color:${e.c||'#fff'}" onmousedown="dragStart(event,${i})" onclick="sel(${i})"><svg class="ico" style="width:100%;height:100%"><use href="#${e.icon}"/></svg></div>`;
        return'';
    }).join('');
    SEL=null;
}

function goSl(i){SI=i;renderSl();renderCv();updCnt()}
function addSl(){const l=P.slides[P.slides.length-1];P.slides.push({bg:l.bg,els:[{t:'text',txt:'כותרת',x:50,y:35,fs:40,fw:700,c:l.els[0]?.c||'#fff'},{t:'text',txt:'תוכן',x:50,y:60,fs:20,fw:400,c:l.els[0]?.c||'#fff'}]});SI=P.slides.length-1;save();renderSl();renderCv();updCnt();toast('שקופית חדשה נוספה')}
function rmSl(i,e){e.stopPropagation();if(P.slides.length<=1)return;P.slides.splice(i,1);if(SI>=P.slides.length)SI=P.slides.length-1;save();renderSl();renderCv();updCnt()}
function dupSlide(){P.slides.splice(SI+1,0,JSON.parse(JSON.stringify(P.slides[SI])));SI++;save();renderSl();renderCv();updCnt();toast('שקופית שוכפלה')}
function updCnt(){document.getElementById('counter').textContent=`שקופית ${SI+1} מתוך ${P.slides.length}`}

function addText(txt,fs,fw){P.slides[SI].els.push({t:'text',txt,x:50,y:50,fs,fw,c:'#fff',fi:'normal'});save();renderCv();renderSl()}
function addShape(shape){P.slides[SI].els.push({t:'shape',shape,x:50,y:50,w:70,h:70,c:'#fff'});save();renderCv();renderSl()}
function addIcon(icon){P.slides[SI].els.push({t:'icon',icon,x:50,y:50,w:48,h:48,c:'#fff'});save();renderCv();renderSl()}

function sel(i){
    SEL=i;document.querySelectorAll('.el').forEach(e=>e.classList.remove('sel'));
    const el=document.querySelector(`[data-i="${i}"]`);if(el)el.classList.add('sel');
    const e=P.slides[SI].els[i];
    if(e&&e.t==='text'){document.getElementById('fontSz').value=e.fs;document.getElementById('tColor').value=e.c.startsWith('rgba')?'#ffffff':e.c}
}
function desel(ev){if(ev.target.classList.contains('canvas-wrap')||ev.target.id==='canvas'){SEL=null;document.querySelectorAll('.el').forEach(e=>e.classList.remove('sel'))}}
function delSel(){if(SEL===null)return;P.slides[SI].els.splice(SEL,1);SEL=null;save();renderCv();renderSl();toast('אלמנט נמחק')}
function updTxt(i,t){P.slides[SI].els[i].txt=t;save();renderSl()}

function setFontSz(v){if(SEL===null)return;P.slides[SI].els[SEL].fs=+v;save();renderCv();renderSl()}
function togBold(){if(SEL===null)return;const e=P.slides[SI].els[SEL];e.fw=e.fw===700?400:700;save();renderCv();renderSl()}
function togItalic(){if(SEL===null)return;const e=P.slides[SI].els[SEL];e.fi=e.fi==='italic'?'normal':'italic';save();renderCv();renderSl()}
function setColor(c){if(SEL===null)return;P.slides[SI].els[SEL].c=c;save();renderCv();renderSl()}
function setBg(i){P.slides[SI].bg=BG[i];save();renderCv();renderSl()}
function saveState(){if(P){P.name=document.getElementById('presTitle').value;save()}}

let _clickTimer=null,_isDrag=false;
function dragStart(ev,i){
    const el=ev.target.closest('.el');
    const isTxt=el&&el.getAttribute('contenteditable')==='true';
    // If already editing this text element, don't drag
    if(isTxt&&document.activeElement===el)return;
    const cv=document.getElementById('canvas'),r=cv.getBoundingClientRect();
    _isDrag=false;
    DRG={i,sx:ev.clientX,sy:ev.clientY,ox:P.slides[SI].els[i].x,oy:P.slides[SI].els[i].y,cw:r.width,ch:r.height};
    sel(i);
    document.addEventListener('mousemove',onDragCheck);
    document.addEventListener('mouseup',function stopOrClick(e){
        document.removeEventListener('mousemove',onDragCheck);
        document.removeEventListener('mouseup',stopOrClick);
        if(!_isDrag&&isTxt){
            // It was a click, not a drag — focus the text for editing
            el.focus();
            // Place cursor at end
            const range=document.createRange();
            range.selectNodeContents(el);
            range.collapse(false);
            const s=window.getSelection();
            s.removeAllRanges();
            s.addRange(range);
            DRG=null;
        } else {
            stopDrag();
        }
    });
    ev.preventDefault();
}
function onDragCheck(ev){
    if(!DRG)return;
    const dx=Math.abs(ev.clientX-DRG.sx),dy=Math.abs(ev.clientY-DRG.sy);
    if(dx>4||dy>4){_isDrag=true;onDrag(ev);document.removeEventListener('mousemove',onDragCheck);document.addEventListener('mousemove',onDrag)}
}
function onDrag(ev){
    if(!DRG)return;const e=P.slides[SI].els[DRG.i];
    e.x=Math.max(2,Math.min(98,DRG.ox+(ev.clientX-DRG.sx)/DRG.cw*100));
    e.y=Math.max(2,Math.min(98,DRG.oy+(ev.clientY-DRG.sy)/DRG.ch*100));
    const d=document.querySelector(`[data-i="${DRG.i}"]`);if(d){d.style.left=e.x+'%';d.style.top=e.y+'%'}
}
function stopDrag(){if(DRG){save();renderSl()}DRG=null;document.removeEventListener('mousemove',onDrag);document.removeEventListener('mouseup',stopDrag)}

// Touch support
let _touchEl=null;
document.addEventListener('touchstart',e=>{
    const el=e.target.closest('.el');
    if(el){
        _touchEl=el;
        const isTxt=el.getAttribute('contenteditable')==='true';
        if(isTxt&&document.activeElement===el)return; // already editing, let it be
        const t=e.touches[0];
        const i=+el.dataset.i;
        if(i>=0){
            const cv=document.getElementById('canvas'),r=cv.getBoundingClientRect();
            _isDrag=false;
            DRG={i,sx:t.clientX,sy:t.clientY,ox:P.slides[SI].els[i].x,oy:P.slides[SI].els[i].y,cw:r.width,ch:r.height};
            sel(i);
        }
    }
},{passive:true});
document.addEventListener('touchmove',e=>{
    if(DRG){
        const t=e.touches[0];
        const dx=Math.abs(t.clientX-DRG.sx),dy=Math.abs(t.clientY-DRG.sy);
        if(dx>4||dy>4){_isDrag=true;e.preventDefault();onDrag({clientX:t.clientX,clientY:t.clientY})}
    }
},{passive:false});
document.addEventListener('touchend',e=>{
    if(DRG){
        if(!_isDrag&&_touchEl&&_touchEl.getAttribute('contenteditable')==='true'){
            _touchEl.focus();
        }
        if(_isDrag){save();renderSl()}
        DRG=null;
    }
    _touchEl=null;
});

// Presentation
function startPres(){PI=0;showScreen('presentScreen');renderPres();document.addEventListener('keydown',presKey)}
function exitPres(){showScreen('editorScreen');document.removeEventListener('keydown',presKey)}
function presKey(e){if(e.key==='ArrowRight'||e.key===' ')presNext();else if(e.key==='ArrowLeft')presPrev();else if(e.key==='Escape')exitPres()}
function renderPres(){
    const sl=P.slides[PI],c=document.getElementById('presSlide');c.style.background=sl.bg;
    c.innerHTML=sl.els.map((e,i)=>{
        const d=i*0.12;
        if(e.t==='text')return`<div class="pres-el" style="left:${e.x}%;top:${e.y}%;transform:translate(-50%,-50%);font-family:'Heebo',sans-serif;font-size:${e.fs*2.2}px;font-weight:${e.fw};color:${e.c};text-align:center;font-style:${e.fi||'normal'};animation-delay:${d}s">${e.txt}</div>`;
        if(e.t==='shape')return`<div class="pres-el" style="left:${e.x}%;top:${e.y}%;transform:translate(-50%,-50%);width:${(e.w||60)*2.2}px;height:${(e.h||60)*2.2}px;color:${e.c||'#fff'};animation-delay:${d}s"><svg viewBox="0 0 48 48" style="width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5">${SVG_SHAPES[e.shape]||''}</svg></div>`;
        if(e.t==='icon')return`<div class="pres-el" style="left:${e.x}%;top:${e.y}%;transform:translate(-50%,-50%);width:${(e.w||48)*2.2}px;height:${(e.h||48)*2.2}px;color:${e.c||'#fff'};animation-delay:${d}s"><svg class="ico" style="width:100%;height:100%"><use href="#${e.icon}"/></svg></div>`;
        return'';
    }).join('');
    document.getElementById('presCnt').textContent=`${PI+1} / ${P.slides.length}`;
}
function presNext(){if(PI<P.slides.length-1){PI++;renderPres()}}
function presPrev(){if(PI>0){PI--;renderPres()}}

function exportPres(){
    const d=JSON.stringify(P,null,2),b=new Blob([d],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');
    a.href=u;a.download=(P.name||'presentation')+'.json';a.click();URL.revokeObjectURL(u);toast('מצגת יוצאה בהצלחה');
}

document.addEventListener('keydown',e=>{if(document.getElementById('editorScreen').classList.contains('active')&&e.key==='Delete'&&SEL!==null&&document.activeElement.getAttribute('contenteditable')!=='true')delSel()});

renderRecent();
</script>
