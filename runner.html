<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,maximum-scale=1">
<title>בראול פיקסל ⚔️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;overflow:hidden;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;font-family:'Segoe UI',Arial,sans-serif}
canvas{display:block}
#topBar{position:fixed;top:0;left:0;right:0;height:36px;background:rgba(0,0,0,0.7);display:flex;align-items:center;padding:0 10px;z-index:100}
#topBar a{color:#fff;text-decoration:none;font-size:14px;font-weight:bold;background:#4a90d9;padding:4px 12px;border-radius:12px}
#topBar a:hover{background:#5aa0e9}
#ui{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:50}
#hud{position:fixed;top:40px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:60;pointer-events:none}
.hud-item{background:rgba(0,0,0,0.75);color:#fff;padding:4px 10px;border-radius:10px;font-size:13px;font-weight:bold;display:flex;align-items:center;gap:4px}
#superBtn{position:fixed;bottom:100px;right:50%;transform:translateX(50%);width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,#ffe44d,#ff9900);border:4px solid #fff;font-size:24px;font-weight:bold;color:#333;display:none;z-index:80;pointer-events:auto;cursor:pointer;box-shadow:0 0 20px rgba(255,200,0,0.8)}
#menu{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200}
#menu h1{font-size:clamp(32px,8vw,64px);color:#ffe44d;text-shadow:3px 3px 0 #ff6b00,6px 6px 0 rgba(0,0,0,0.3);margin-bottom:20px}
#menu .subtitle{color:#aaa;font-size:16px;margin-bottom:30px}
#startBtn{background:linear-gradient(180deg,#4ade80,#22c55e);color:#fff;border:none;padding:16px 48px;font-size:24px;font-weight:bold;border-radius:16px;cursor:pointer;box-shadow:0 6px 0 #15803d;text-shadow:1px 1px 0 rgba(0,0,0,0.3)}
#startBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #15803d}
#endScreen{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200;color:#fff}
#endScreen h1{font-size:48px;margin-bottom:10px}
#endScreen .stats{font-size:18px;margin:15px 0;text-align:center;line-height:2}
#retryBtn{background:linear-gradient(180deg,#4ade80,#22c55e);color:#fff;border:none;padding:14px 40px;font-size:20px;font-weight:bold;border-radius:14px;cursor:pointer;box-shadow:0 5px 0 #15803d;margin-top:20px}
</style>
</head>
<body>
<div id="topBar"><a href="index.html">→ SlideFlow</a></div>
<canvas id="c"></canvas>
<div id="hud">
<div class="hud-item" id="hudHp">❤️ <span id="hpText">100%</span></div>
<div class="hud-item" id="hudAmmo">🔫 <span id="ammoText">●●●</span></div>
<div class="hud-item" id="hudSuper">⚡ <span id="superText">0%</span></div>
<div class="hud-item" id="hudCubes">💎 <span id="cubeText">0</span></div>
<div class="hud-item" id="hudAlive">👥 <span id="aliveText">7</span></div>
</div>
<button id="superBtn" ontouchstart="useSuperTouch(event)" onclick="useSuper()">⚡</button>
<div id="menu">
<h1>בראול פיקסל ⚔️</h1>
<div class="subtitle">Top-Down Arena Showdown</div>
<canvas id="menuChar" width="120" height="120" style="margin-bottom:20px"></canvas>
<button id="startBtn" onclick="startGame()">!התחל קרב</button>
</div>
<div id="endScreen">
<h1 id="endTitle"></h1>
<div class="stats" id="endStats"></div>
<button id="retryBtn" onclick="startGame()">!שחק שוב</button>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H,TILE=40,MAP_W=32,MAP_H=32,MW,MH;
let cam={x:0,y:0,shake:0};
let gameState='menu'; // menu, playing, ended
let player,bots=[],projectiles=[],particles=[],powerCubes=[];
let map=[];
let stormRadius,stormSpeed,stormCenter;
let stats={kills:0,damage:0,cubes:0};
let touchMove={active:false,id:-1,sx:0,sy:0,cx:0,cy:0};
let touchAim={active:false,id:-1,sx:0,sy:0,cx:0,cy:0};
let keys={};
let mouseX=0,mouseY=0,mouseDown=false;
let audioCtx;
const BOT_COLORS=['#e74c3c','#3498db','#e67e22','#9b59b6','#1abc9c','#f1c40f','#e84393','#00cec9'];
const BOT_NAMES=['Spike','Colt','Shelly','Bull','Rosa','Crow'];

function resize(){
  W=C.width=window.innerWidth;H=C.height=window.innerHeight;
}
window.addEventListener('resize',resize);resize();

// Audio
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playSound(freq,dur,type='square',vol=0.15){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+dur);
}
function sndShoot(){playSound(800,0.08,'square',0.1);playSound(600,0.05,'sawtooth',0.05)}
function sndHit(){playSound(200,0.15,'sawtooth',0.12)}
function sndCube(){playSound(1200,0.1);setTimeout(()=>playSound(1600,0.1),80)}
function sndSuperReady(){playSound(1000,0.1);setTimeout(()=>playSound(1200,0.1),100);setTimeout(()=>playSound(1500,0.15),200)}
function sndSuperUse(){playSound(150,0.4,'sawtooth',0.2);playSound(100,0.5,'square',0.15)}
function sndWin(){[0,100,200,300,400].forEach((d,i)=>setTimeout(()=>playSound(500+i*100,0.2,'square',0.12),d))}
function sndLose(){[0,150,300].forEach((d,i)=>setTimeout(()=>playSound(400-i*80,0.3,'sawtooth',0.1),d))}

// Map generation
function genMap(){
  MW=MAP_W*TILE;MH=MAP_H*TILE;
  map=[];
  for(let y=0;y<MAP_H;y++){
    map[y]=[];
    for(let x=0;x<MAP_W;x++){
      if(x===0||y===0||x===MAP_W-1||y===MAP_H-1){map[y][x]={type:'wall',hp:-1};continue}
      let r=Math.random();
      if(r<0.06)map[y][x]={type:'wall',hp:-1}; // indestructible
      else if(r<0.12)map[y][x]={type:'wall',hp:3}; // destructible
      else if(r<0.2)map[y][x]={type:'bush'};
      else if(r<0.23)map[y][x]={type:'crate',hp:2};
      else map[y][x]={type:'empty'};
    }
  }
  // Clear spawn areas
  let cx=Math.floor(MAP_W/2),cy=Math.floor(MAP_H/2);
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
    let yy=cy+dy,xx=cx+dx;
    if(yy>0&&yy<MAP_H-1&&xx>0&&xx<MAP_W-1)map[yy][xx]={type:'empty'};
  }
}

function makeBrawler(x,y,color,isPlayer){
  return{x,y,vx:0,vy:0,r:14,color,hp:100,maxHp:100,ammo:3,maxAmmo:3,ammoTimer:0,
    superCharge:0,powerCubes:0,alive:true,isPlayer,flashTimer:0,deathTimer:0,
    aimX:0,aimY:1,speed:isPlayer?2.8:2.2,dmg:10,inBush:false,
    eyeDir:{x:0,y:1},shootCd:0}
}

function spawnCubes(){
  for(let i=0;i<15;i++){
    let x,y;
    do{x=2+Math.random()*(MAP_W-4);y=2+Math.random()*(MAP_H-4)}
    while(map[Math.floor(y)]&&map[Math.floor(y)][Math.floor(x)]&&map[Math.floor(y)][Math.floor(x)].type==='wall');
    powerCubes.push({x:x*TILE+TILE/2,y:y*TILE+TILE/2,alive:true});
  }
}

function startGame(){
  initAudio();
  document.getElementById('menu').style.display='none';
  document.getElementById('endScreen').style.display='none';
  genMap();
  stats={kills:0,damage:0,cubes:0};
  let cx=Math.floor(MAP_W/2)*TILE+TILE/2,cy=Math.floor(MAP_H/2)*TILE+TILE/2;
  player=makeBrawler(cx,cy,'#4ade80',true);
  bots=[];
  for(let i=0;i<7;i++){
    let bx,by,tries=0;
    do{
      bx=(3+Math.random()*(MAP_W-6))*TILE;
      by=(3+Math.random()*(MAP_H-6))*TILE;
      tries++;
    }while(Math.hypot(bx-cx,by-cy)<200&&tries<50);
    let b=makeBrawler(bx,by,BOT_COLORS[i],false);
    b.aiTimer=Math.random()*60;b.aiTarget=null;b.aiState='wander';
    bots.push(b);
  }
  projectiles=[];particles=[];powerCubes=[];
  spawnCubes();
  stormRadius=Math.max(MW,MH)*0.7;
  stormSpeed=0.15;
  stormCenter={x:MW/2,y:MH/2};
  gameState='playing';
}

function tileAt(px,py){
  let tx=Math.floor(px/TILE),ty=Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return{type:'wall',hp:-1};
  return map[ty][tx];
}
function solidAt(px,py){let t=tileAt(px,py);return t.type==='wall'||t.type==='crate'}

function moveEntity(e,dx,dy){
  let nx=e.x+dx,ny=e.y+dy,r=e.r;
  if(!solidAt(nx-r,e.y-r)&&!solidAt(nx+r,e.y-r)&&!solidAt(nx-r,e.y+r)&&!solidAt(nx+r,e.y+r))e.x=nx;
  if(!solidAt(e.x-r,ny-r)&&!solidAt(e.x+r,ny-r)&&!solidAt(e.x-r,ny+r)&&!solidAt(e.x+r,ny+r))e.y=ny;
  // bush check
  e.inBush=tileAt(e.x,e.y).type==='bush';
}

function shoot(e,tx,ty,isSuper){
  if(!isSuper&&e.ammo<1)return;
  if(!isSuper&&e.shootCd>0)return;
  let dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1;
  dx/=d;dy/=d;
  if(isSuper){
    e.superCharge=0;
    sndSuperUse();
    cam.shake=12;
    for(let i=-2;i<=2;i++){
      let ang=Math.atan2(dy,dx)+i*0.15;
      projectiles.push({x:e.x+dx*20,y:e.y+dy*20,vx:Math.cos(ang)*7,vy:Math.sin(ang)*7,
        owner:e,dmg:(e.dmg+e.powerCubes*2)*2,r:6,life:45,isSuper:true,color:'#ffe44d'});
    }
    // explosion particles
    for(let i=0;i<20;i++){
      let a=Math.random()*Math.PI*2,s=Math.random()*4+2;
      particles.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30,color:'#ffe44d',r:4+Math.random()*4});
    }
  } else {
    e.ammo--;e.shootCd=12;
    sndShoot();
    projectiles.push({x:e.x+dx*20,y:e.y+dy*20,vx:dx*6,vy:dy*6,
      owner:e,dmg:e.dmg+e.powerCubes*2,r:4,life:40,isSuper:false,color:e.color});
  }
  e.eyeDir={x:dx,y:dy};
}

function damageEntity(e,dmg,src){
  e.hp-=dmg;e.flashTimer=6;
  cam.shake=Math.max(cam.shake,e.isPlayer?6:2);
  sndHit();
  if(src)src.superCharge=Math.min(100,src.superCharge+dmg*1.5);
  if(src&&src.superCharge>=100&&src.superCharge-dmg*1.5<100)sndSuperReady();
  // hit particles
  for(let i=0;i<5;i++){
    let a=Math.random()*Math.PI*2,s=Math.random()*3+1;
    particles.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:15,color:'#fff',r:3});
  }
  if(e.hp<=0){
    e.alive=false;e.deathTimer=30;
    if(src&&src.isPlayer)stats.kills++;
    if(src)stats.damage+=dmg;
    // drop cube
    powerCubes.push({x:e.x,y:e.y,alive:true});
    // death particles
    for(let i=0;i<15;i++){
      let a=Math.random()*Math.PI*2,s=Math.random()*3+2;
      particles.push({x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:40,color:e.color,r:3+Math.random()*3});
    }
  }
}

function damageTile(px,py,dmg){
  let tx=Math.floor(px/TILE),ty=Math.floor(py/TILE);
  if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return;
  let t=map[ty][tx];
  if(t.type==='wall'&&t.hp>0){t.hp-=1;if(t.hp<=0){map[ty][tx]={type:'empty'};
    for(let i=0;i<6;i++){let a=Math.random()*Math.PI*2;particles.push({x:tx*TILE+20,y:ty*TILE+20,vx:Math.cos(a)*2,vy:Math.sin(a)*2,life:20,color:'#8B7355',r:3})}}}
  if(t.type==='crate'){t.hp-=1;if(t.hp<=0){map[ty][tx]={type:'empty'};
    powerCubes.push({x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,alive:true});
    for(let i=0;i<6;i++){let a=Math.random()*Math.PI*2;particles.push({x:tx*TILE+20,y:ty*TILE+20,vx:Math.cos(a)*2,vy:Math.sin(a)*2,life:20,color:'#DEB887',r:3})}}}
}

function botAI(b){
  if(!b.alive)return;
  b.aiTimer--;
  b.ammoTimer++;
  if(b.ammoTimer>=50&&b.ammo<3){b.ammo++;b.ammoTimer=0}
  b.shootCd=Math.max(0,b.shootCd-1);

  let distP=player.alive?Math.hypot(b.x-player.x,b.y-player.y):9999;
  let distStorm=Math.hypot(b.x-stormCenter.x,b.y-stormCenter.y);

  // Move toward center if near storm
  if(distStorm>stormRadius-80){
    let dx=stormCenter.x-b.x,dy=stormCenter.y-b.y,d=Math.hypot(dx,dy)||1;
    moveEntity(b,dx/d*b.speed,dy/d*b.speed);
    return;
  }

  // Collect nearby cubes
  let nearCube=null,nearCubeDist=150;
  for(let c of powerCubes){
    if(!c.alive)continue;
    let cd=Math.hypot(b.x-c.x,b.y-c.y);
    if(cd<nearCubeDist){nearCube=c;nearCubeDist=cd}
  }
  if(nearCube){
    let dx=nearCube.x-b.x,dy=nearCube.y-b.y,d=Math.hypot(dx,dy)||1;
    moveEntity(b,dx/d*b.speed,dy/d*b.speed);
  }

  // Attack player if in range
  if(player.alive&&distP<250){
    if(b.ammo>=1&&b.shootCd<=0&&Math.random()<0.04){
      shoot(b,player.x+(Math.random()-0.5)*30,player.y+(Math.random()-0.5)*30,false);
    }
    if(b.superCharge>=100&&distP<180&&Math.random()<0.02){
      shoot(b,player.x,player.y,true);
    }
    // strafe
    let ang=Math.atan2(player.y-b.y,player.x-b.x)+Math.PI/2*(Math.random()>0.5?1:-1);
    moveEntity(b,Math.cos(ang)*b.speed*0.5,Math.sin(ang)*b.speed*0.5);
  } else if(b.aiTimer<=0){
    b.aiTimer=60+Math.random()*60;
    b.aiTarget={x:(3+Math.random()*(MAP_W-6))*TILE,y:(3+Math.random()*(MAP_H-6))*TILE};
  }

  if(b.aiTarget&&!nearCube&&(distP>250||!player.alive)){
    let dx=b.aiTarget.x-b.x,dy=b.aiTarget.y-b.y,d=Math.hypot(dx,dy)||1;
    if(d<30)b.aiTarget=null;
    else moveEntity(b,dx/d*b.speed,dy/d*b.speed);
  }

  // Bot vs bot combat
  for(let ob of bots){
    if(ob===b||!ob.alive)continue;
    let bd=Math.hypot(b.x-ob.x,b.y-ob.y);
    if(bd<200&&b.ammo>=1&&b.shootCd<=0&&Math.random()<0.02){
      shoot(b,ob.x,ob.y,false);
    }
  }
}

function useSuper(){if(player&&player.alive&&player.superCharge>=100){
  let dx=mouseX+cam.x-player.x,dy=mouseY+cam.y-player.y;
  shoot(player,player.x+dx,player.y+dy,true);
}}
function useSuperTouch(e){e.preventDefault();if(player&&player.alive&&player.superCharge>=100){
  shoot(player,player.x+player.eyeDir.x*100,player.y+player.eyeDir.y*100,true);
}}

function update(){
  if(gameState!=='playing')return;
  let p=player;
  if(!p.alive){
    p.deathTimer--;
    if(p.deathTimer<=0){endGame(false)}
    return;
  }

  // Player input
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my=-1;
  if(keys['s']||keys['arrowdown'])my=1;
  if(keys['a']||keys['arrowleft'])mx=-1;
  if(keys['d']||keys['arrowright'])mx=1;

  // Touch move joystick
  if(touchMove.active){
    let dx=touchMove.cx-touchMove.sx,dy=touchMove.cy-touchMove.sy;
    let d=Math.hypot(dx,dy);
    if(d>10){mx=dx/d;my=dy/d}
  }

  if(mx||my){let d=Math.hypot(mx,my);moveEntity(p,mx/d*p.speed,my/d*p.speed);p.eyeDir={x:mx/d,y:my/d}}

  // Ammo recharge
  p.ammoTimer++;
  if(p.ammoTimer>=40&&p.ammo<3){p.ammo++;p.ammoTimer=0}
  p.shootCd=Math.max(0,p.shootCd-1);

  // Desktop shoot
  if(mouseDown&&p.ammo>=1&&p.shootCd<=0){
    shoot(p,mouseX+cam.x,mouseY+cam.y,false);
  }

  // Super (keyboard)
  if((keys['q']||keys[' '])&&p.superCharge>=100){
    shoot(p,mouseX+cam.x,mouseY+cam.y,true);
  }

  // Bots
  bots.forEach(botAI);

  // Projectiles
  for(let i=projectiles.length-1;i>=0;i--){
    let pr=projectiles[i];
    pr.x+=pr.vx;pr.y+=pr.vy;pr.life--;
    // trail
    if(pr.life%2===0)particles.push({x:pr.x,y:pr.y,vx:0,vy:0,life:8,color:pr.isSuper?'#ffe44d':pr.color,r:pr.r*0.6});

    // wall hit
    if(solidAt(pr.x,pr.y)){damageTile(pr.x,pr.y,1);projectiles.splice(i,1);continue}

    let hit=false;
    // hit player
    if(pr.owner!==p&&p.alive&&Math.hypot(pr.x-p.x,pr.y-p.y)<p.r+pr.r){
      damageEntity(p,pr.dmg,pr.owner);hit=true;
    }
    // hit bots
    if(!hit)for(let b of bots){
      if(!b.alive||pr.owner===b)continue;
      if(Math.hypot(pr.x-b.x,pr.y-b.y)<b.r+pr.r){damageEntity(b,pr.dmg,pr.owner);hit=true;break}
    }
    if(hit||pr.life<=0)projectiles.splice(i,1);
  }

  // Power cubes
  let allEntities=[p,...bots];
  for(let c of powerCubes){
    if(!c.alive)continue;
    for(let e of allEntities){
      if(!e.alive)continue;
      if(Math.hypot(e.x-c.x,e.y-c.y)<e.r+10){
        c.alive=false;e.powerCubes++;e.maxHp+=10;e.hp=Math.min(e.hp+10,e.maxHp);
        if(e.isPlayer){stats.cubes++;sndCube()}
        for(let j=0;j<8;j++){let a=Math.random()*Math.PI*2;particles.push({x:c.x,y:c.y,vx:Math.cos(a)*3,vy:Math.sin(a)*3,life:20,color:'#a855f7',r:3})}
      }
    }
  }
  powerCubes=powerCubes.filter(c=>c.alive);

  // Storm
  stormRadius=Math.max(60,stormRadius-stormSpeed);
  // Storm damage
  for(let e of allEntities){
    if(!e.alive)continue;
    if(Math.hypot(e.x-stormCenter.x,e.y-stormCenter.y)>stormRadius){
      e.hp-=0.3;e.flashTimer=2;
      if(e.hp<=0){e.alive=false;e.deathTimer=30;if(e!==p)stats.kills++}
    }
  }

  // Particles
  for(let i=particles.length-1;i>=0;i--){
    let pp=particles[i];pp.x+=pp.vx;pp.y+=pp.vy;pp.vx*=0.95;pp.vy*=0.95;pp.life--;
    if(pp.life<=0)particles.splice(i,1);
  }

  // Camera
  cam.x=p.x-W/2;cam.y=p.y-H/2;
  if(cam.shake>0){cam.x+=Math.random()*cam.shake-cam.shake/2;cam.y+=Math.random()*cam.shake-cam.shake/2;cam.shake*=0.85;if(cam.shake<0.5)cam.shake=0}

  // Check win
  let aliveCount=1+bots.filter(b=>b.alive).length;
  document.getElementById('aliveText').textContent=aliveCount;
  if(aliveCount<=1&&p.alive)endGame(true);

  // HUD
  document.getElementById('hpText').textContent=Math.max(0,Math.round(p.hp))+'%';
  document.getElementById('ammoText').textContent='●'.repeat(p.ammo)+'○'.repeat(3-p.ammo);
  document.getElementById('superText').textContent=Math.round(p.superCharge)+'%';
  document.getElementById('cubeText').textContent=p.powerCubes;
  document.getElementById('superBtn').style.display=p.superCharge>=100?'block':'none';
}

function endGame(won){
  gameState='ended';
  if(won)sndWin();else sndLose();
  let es=document.getElementById('endScreen');
  es.style.display='flex';
  document.getElementById('endTitle').textContent=won?'🏆 !ניצחון':'💀 ...הפסד';
  document.getElementById('endTitle').style.color=won?'#ffe44d':'#e74c3c';
  document.getElementById('endStats').innerHTML=
    `השמדות: ${stats.kills}<br>נזק: ${Math.round(stats.damage)}<br>קוביות כוח: ${stats.cubes}`;
}

function drawBrawler(e,alpha){
  if(!e.alive&&e.deathTimer>0){
    X.save();X.globalAlpha=e.deathTimer/30;
    X.translate(e.x-cam.x,e.y-cam.y);
    X.rotate((30-e.deathTimer)*0.3);
    X.scale(e.deathTimer/30,e.deathTimer/30);
    drawBrawlerBody(e,0,0);
    X.restore();return;
  }
  if(!e.alive)return;
  let sx=e.x-cam.x,sy=e.y-cam.y;
  let a=alpha!==undefined?alpha:(e.inBush&&!e.isPlayer?0.3:e.inBush?0.6:1);
  X.save();X.globalAlpha=a;
  if(e.flashTimer>0){X.globalAlpha=0.5+Math.sin(e.flashTimer*2)*0.5;e.flashTimer--}
  drawBrawlerBody(e,sx,sy);
  // HP bar
  let bw=30,bh=5;
  X.fillStyle='#333';X.fillRect(sx-bw/2,sy-e.r-12,bw,bh);
  X.fillStyle=e.hp>50?'#4ade80':e.hp>25?'#fbbf24':'#ef4444';
  X.fillRect(sx-bw/2,sy-e.r-12,bw*(e.hp/e.maxHp),bh);
  // Power cubes indicator
  if(e.powerCubes>0){
    X.fillStyle='#a855f7';X.font='bold 10px sans-serif';X.textAlign='center';
    X.fillText('💎'+e.powerCubes,sx,sy-e.r-16);
  }
  X.restore();
}

function drawBrawlerBody(e,sx,sy){
  // Body circle
  X.beginPath();X.arc(sx,sy,e.r,0,Math.PI*2);
  X.fillStyle=e.color;X.fill();
  X.strokeStyle='#222';X.lineWidth=2.5;X.stroke();
  // Inner highlight
  X.beginPath();X.arc(sx-3,sy-3,e.r*0.5,0,Math.PI*2);
  X.fillStyle='rgba(255,255,255,0.25)';X.fill();
  // Eyes
  let ex=e.eyeDir.x*3,ey=e.eyeDir.y*3;
  X.fillStyle='#fff';
  X.beginPath();X.arc(sx-4+ex*0.5,sy-3+ey*0.5,4,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(sx+4+ex*0.5,sy-3+ey*0.5,4,0,Math.PI*2);X.fill();
  X.fillStyle='#222';
  X.beginPath();X.arc(sx-4+ex,sy-3+ey,2,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(sx+4+ex,sy-3+ey,2,0,Math.PI*2);X.fill();
  // Mouth
  X.beginPath();X.arc(sx+ex*0.3,sy+4+ey*0.3,3,0,Math.PI);
  X.strokeStyle='#222';X.lineWidth=1.5;X.stroke();
}

function draw(){
  X.fillStyle='#2d5a1e';X.fillRect(0,0,W,H);

  // Draw tiles
  let sx=Math.max(0,Math.floor(cam.x/TILE)),sy=Math.max(0,Math.floor(cam.y/TILE));
  let ex=Math.min(MAP_W,Math.ceil((cam.x+W)/TILE)+1),ey=Math.min(MAP_H,Math.ceil((cam.y+H)/TILE)+1);

  for(let y=sy;y<ey;y++)for(let x=sx;x<ex;x++){
    let t=map[y][x],px=x*TILE-cam.x,py=y*TILE-cam.y;
    if(t.type==='empty'){
      // grass pattern
      if((x+y)%2===0)X.fillStyle='#3a7a28';else X.fillStyle='#2d6a1e';
      X.fillRect(px,py,TILE,TILE);
    } else if(t.type==='wall'){
      X.fillStyle=t.hp<0?'#555':'#8B7355';X.fillRect(px,py,TILE,TILE);
      X.strokeStyle='#444';X.lineWidth=1;X.strokeRect(px,py,TILE,TILE);
      if(t.hp>0){X.fillStyle='rgba(0,0,0,0.2)';for(let i=0;i<t.hp;i++)X.fillRect(px+5+i*10,py+TILE/2-2,6,4)}
    } else if(t.type==='bush'){
      if((x+y)%2===0)X.fillStyle='#3a7a28';else X.fillStyle='#2d6a1e';
      X.fillRect(px,py,TILE,TILE);
      X.fillStyle='rgba(0,100,0,0.7)';X.fillRect(px+2,py+2,TILE-4,TILE-4);
      X.fillStyle='#1a5c0a';
      X.beginPath();X.arc(px+TILE/2,py+TILE/2,TILE*0.35,0,Math.PI*2);X.fill();
      X.beginPath();X.arc(px+TILE*0.3,py+TILE*0.35,TILE*0.2,0,Math.PI*2);X.fill();
      X.beginPath();X.arc(px+TILE*0.7,py+TILE*0.4,TILE*0.22,0,Math.PI*2);X.fill();
    } else if(t.type==='crate'){
      if((x+y)%2===0)X.fillStyle='#3a7a28';else X.fillStyle='#2d6a1e';
      X.fillRect(px,py,TILE,TILE);
      X.fillStyle='#DEB887';X.fillRect(px+3,py+3,TILE-6,TILE-6);
      X.strokeStyle='#8B6914';X.lineWidth=2;X.strokeRect(px+3,py+3,TILE-6,TILE-6);
      X.beginPath();X.moveTo(px+3,py+3);X.lineTo(px+TILE-3,py+TILE-3);X.moveTo(px+TILE-3,py+3);X.lineTo(px+3,py+TILE-3);
      X.strokeStyle='#8B6914';X.lineWidth=1;X.stroke();
    }
  }

  // Power cubes
  for(let c of powerCubes){
    if(!c.alive)continue;
    let cx=c.x-cam.x,cy=c.y-cam.y;
    let bob=Math.sin(Date.now()*0.005)*3;
    X.save();X.translate(cx,cy+bob);X.rotate(Date.now()*0.002);
    X.fillStyle='#a855f7';X.strokeStyle='#7c3aed';X.lineWidth=2;
    X.beginPath();X.rect(-6,-6,12,12);X.fill();X.stroke();
    X.fillStyle='rgba(255,255,255,0.4)';X.fillRect(-4,-4,4,4);
    X.restore();
    // glow
    X.beginPath();X.arc(cx,cy+bob,14,0,Math.PI*2);
    X.fillStyle='rgba(168,85,247,0.15)';X.fill();
  }

  // Bots
  bots.forEach(b=>drawBrawler(b));
  // Player
  drawBrawler(player);

  // Projectiles
  for(let pr of projectiles){
    let px=pr.x-cam.x,py=pr.y-cam.y;
    X.beginPath();X.arc(px,py,pr.r,0,Math.PI*2);
    X.fillStyle=pr.color;X.fill();
    if(pr.isSuper){X.strokeStyle='#ff9900';X.lineWidth=2;X.stroke();
      X.beginPath();X.arc(px,py,pr.r+3,0,Math.PI*2);X.fillStyle='rgba(255,228,77,0.3)';X.fill()}
    else{X.strokeStyle='#222';X.lineWidth=1;X.stroke()}
  }

  // Particles
  for(let pp of particles){
    X.beginPath();X.arc(pp.x-cam.x,pp.y-cam.y,pp.r*(pp.life/40),0,Math.PI*2);
    X.fillStyle=pp.color;X.globalAlpha=pp.life/40;X.fill();X.globalAlpha=1;
  }

  // Storm overlay
  drawStorm();

  // Touch joysticks
  drawJoystick(touchMove,'#4ade80');
  drawJoystick(touchAim,'#ef4444');
}

function drawStorm(){
  // Draw storm edges as purple overlay outside the safe circle
  X.save();
  X.beginPath();X.rect(0,0,W,H);
  X.arc(stormCenter.x-cam.x,stormCenter.y-cam.y,stormRadius,0,Math.PI*2,true);
  X.fillStyle='rgba(120,0,200,0.35)';X.fill();
  // Storm edge glow
  X.beginPath();X.arc(stormCenter.x-cam.x,stormCenter.y-cam.y,stormRadius,0,Math.PI*2);
  X.strokeStyle='rgba(200,50,255,0.5)';X.lineWidth=4;X.stroke();
  X.restore();
}

function drawJoystick(t,color){
  if(!t.active)return;
  X.save();X.globalAlpha=0.35;
  X.beginPath();X.arc(t.sx,t.sy,50,0,Math.PI*2);
  X.fillStyle='#000';X.fill();
  X.strokeStyle=color;X.lineWidth=3;X.stroke();
  let dx=t.cx-t.sx,dy=t.cy-t.sy,d=Math.hypot(dx,dy),maxD=50;
  if(d>maxD){dx=dx/d*maxD;dy=dy/d*maxD}
  X.beginPath();X.arc(t.sx+dx,t.sy+dy,20,0,Math.PI*2);
  X.fillStyle=color;X.fill();
  X.restore();
}

function loop(){
  update();draw();requestAnimationFrame(loop);
}

// Input
document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' ')e.preventDefault()});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
C.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY});
C.addEventListener('mousedown',e=>{mouseDown=true;initAudio()});
C.addEventListener('mouseup',e=>{mouseDown=false});
C.addEventListener('contextmenu',e=>e.preventDefault());

// Touch
C.addEventListener('touchstart',e=>{
  e.preventDefault();initAudio();
  for(let t of e.changedTouches){
    if(t.clientX<W/2&&!touchMove.active){
      touchMove={active:true,id:t.identifier,sx:t.clientX,sy:t.clientY,cx:t.clientX,cy:t.clientY};
    } else if(t.clientX>=W/2&&!touchAim.active){
      touchAim={active:true,id:t.identifier,sx:t.clientX,sy:t.clientY,cx:t.clientX,cy:t.clientY};
    }
  }
},{passive:false});
C.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(let t of e.changedTouches){
    if(t.identifier===touchMove.id){touchMove.cx=t.clientX;touchMove.cy=t.clientY}
    if(t.identifier===touchAim.id){touchAim.cx=t.clientX;touchAim.cy=t.clientY}
  }
},{passive:false});
C.addEventListener('touchend',e=>{
  for(let t of e.changedTouches){
    if(t.identifier===touchMove.id){touchMove.active=false;touchMove.id=-1}
    if(t.identifier===touchAim.id){
      // Fire on release if dragged
      if(player&&player.alive&&player.ammo>=1){
        let dx=touchAim.cx-touchAim.sx,dy=touchAim.cy-touchAim.sy;
        if(Math.hypot(dx,dy)>15){
          shoot(player,player.x+dx*10,player.y+dy*10,false);
        }
      }
      touchAim.active=false;touchAim.id=-1;
    }
  }
});

// Draw menu character
let mc=document.getElementById('menuChar').getContext('2d');
mc.translate(60,65);
mc.beginPath();mc.arc(0,0,35,0,Math.PI*2);mc.fillStyle='#4ade80';mc.fill();mc.strokeStyle='#222';mc.lineWidth=3;mc.stroke();
mc.beginPath();mc.arc(0,-5,18,0,Math.PI*2);mc.fillStyle='rgba(255,255,255,0.2)';mc.fill();
mc.fillStyle='#fff';mc.beginPath();mc.arc(-10,-8,9,0,Math.PI*2);mc.fill();mc.beginPath();mc.arc(10,-8,9,0,Math.PI*2);mc.fill();
mc.fillStyle='#222';mc.beginPath();mc.arc(-8,-6,4,0,Math.PI*2);mc.fill();mc.beginPath();mc.arc(12,-6,4,0,Math.PI*2);mc.fill();
mc.beginPath();mc.arc(0,10,8,0,Math.PI);mc.strokeStyle='#222';mc.lineWidth=2;mc.stroke();
mc.fillStyle='#ffe44d';mc.font='bold 14px sans-serif';mc.textAlign='center';mc.fillText('⚡',0,-30);

loop();
</script>
