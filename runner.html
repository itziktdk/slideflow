<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>בראול פיקסל</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;background:#111;font-family:'Segoe UI',Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;top:0;left:0;z-index:1;display:block;cursor:crosshair}
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:none;padding:6px 10px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;font-weight:bold;display:flex;justify-content:center;gap:14px;align-items:center;direction:ltr}
#hud span{white-space:nowrap}
#topLink{position:fixed;top:0;right:6px;z-index:20;color:#aef;font-size:13px;text-decoration:none;padding:4px 8px}
#hpBarOuter{position:fixed;bottom:18px;left:18px;z-index:15;width:160px;height:18px;background:rgba(0,0,0,.6);border-radius:9px;border:2px solid rgba(255,255,255,.2);display:none}
#hpBarInner{height:100%;border-radius:7px;transition:width .3s;width:100%;background:linear-gradient(90deg,#f44336,#ffeb3b,#4caf50)}
#hpText{position:absolute;width:100%;text-align:center;color:#fff;font-size:11px;font-weight:bold;line-height:18px;text-shadow:0 1px 2px #000}
#ammoDiv{position:fixed;bottom:42px;left:18px;z-index:15;display:none;gap:6px}
.ammo-bullet{width:14px;height:22px;background:#4fc3f7;border-radius:3px 3px 7px 7px;border:1px solid rgba(255,255,255,.3);transition:opacity .2s,transform .2s}
.ammo-bullet.empty{opacity:.25;transform:scaleY(.7)}
#killFeed{position:fixed;top:40px;right:10px;z-index:15;font-size:13px;color:#fff;text-align:right;pointer-events:none}
.kill-msg{opacity:1;transition:opacity 1s;padding:2px 6px;background:rgba(0,0,0,.5);border-radius:4px;margin-bottom:3px;white-space:nowrap}
#minimap{position:fixed;bottom:18px;right:18px;z-index:15;width:100px;height:100px;border-radius:8px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.5);display:none}
#timerDiv{position:fixed;top:40px;left:50%;transform:translateX(-50%);z-index:15;color:#fff;font-size:15px;font-weight:bold;text-shadow:0 1px 4px #000;display:none}
#superBtn{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:15;display:none;width:70px;height:70px;border-radius:50%;border:3px solid #ff0;background:radial-gradient(circle,#ffe600,#f90);color:#333;font-size:28px;font-weight:bold;cursor:pointer;box-shadow:0 0 20px rgba(255,230,0,.7);animation:superPulse 1s infinite}
@keyframes superPulse{0%,100%{box-shadow:0 0 20px rgba(255,230,0,.7)}50%{box-shadow:0 0 35px rgba(255,230,0,1)}}
@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap');
#menu{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;display:flex;flex-direction:column;font-family:'Heebo','Segoe UI',sans-serif;overflow:hidden;direction:rtl}
#menu *{font-family:'Heebo','Segoe UI',sans-serif}
.bs-bg{position:absolute;inset:0;background:linear-gradient(135deg,#f97316,#ea580c);z-index:0}
.bs-bg::before{content:'';position:absolute;inset:0;background:repeating-conic-gradient(rgba(255,255,255,.04) 0% 25%,transparent 0% 50%) 0 0/60px 60px;animation:bgDrift 40s linear infinite}
@keyframes bgDrift{to{background-position:60px 60px}}
.bs-topbar{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
.bs-topbar-left,.bs-topbar-right{display:flex;align-items:center;gap:10px}
.bs-avatar{width:36px;height:36px;border-radius:50%;background:#4ade80;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid #fff}
.bs-player-name{color:#fff;font-weight:700;font-size:15px}
.bs-trophy{color:#ffd700;font-weight:700;font-size:14px}
.bs-currency{color:#fff;font-weight:700;font-size:14px;background:rgba(0,0,0,.4);padding:3px 8px;border-radius:8px}
.bs-hamburger{color:#fff;font-size:24px;cursor:pointer;padding:4px 8px}
.bs-center{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bs-badges{display:flex;gap:10px;margin-bottom:8px}
.bs-badge{background:rgba(0,0,0,.5);color:#fff;padding:4px 12px;border-radius:12px;font-weight:700;font-size:13px}
.bs-char-canvas{animation:charBounce 2s ease-in-out infinite}
@keyframes charBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.bs-sidebar{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:2;display:flex;flex-direction:column;gap:8px}
.bs-sidebar-btn{background:rgba(20,20,40,.85);color:#fff;border:none;padding:10px 14px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.4);text-align:right;min-width:100px;transition:transform .1s}
.bs-sidebar-btn:active{transform:scale(.95);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.bs-right{position:absolute;right:10px;top:50%;transform:translateY(-50%);z-index:2;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.bs-online{background:#22c55e;color:#fff;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700}
.bs-friend-slot{width:40px;height:40px;background:rgba(0,0,0,.4);border-radius:8px;border:2px dashed rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:18px}
.bs-bottombar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);gap:8px}
.bs-lootboxes{display:flex;gap:6px}
.bs-lootbox{width:44px;height:50px;background:linear-gradient(180deg,#6366f1,#4338ca);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;position:relative;box-shadow:0 3px 0 rgba(0,0,0,.4)}
.bs-lootbox-bar{position:absolute;bottom:2px;left:4px;right:4px;height:4px;background:rgba(0,0,0,.3);border-radius:2px}
.bs-lootbox-bar-fill{height:100%;width:60%;background:#fbbf24;border-radius:2px}
.bs-gamemode{text-align:center;color:#fff}
.bs-gamemode-title{font-size:18px;font-weight:900}
.bs-gamemode-sub{font-size:12px;color:rgba(255,255,255,.7)}
.bs-play-area{display:flex;flex-direction:column;align-items:center;gap:4px}
.bs-play-btn{padding:14px 40px;font-size:26px;font-weight:900;border:none;border-radius:16px;cursor:pointer;background:linear-gradient(180deg,#facc15,#eab308);color:#333;box-shadow:0 5px 0 #a16207,0 8px 20px rgba(0,0,0,.3);animation:playPulse 2s ease-in-out infinite;transition:transform .1s}
.bs-play-btn:active{transform:scale(.95);box-shadow:0 2px 0 #a16207}
@keyframes playPulse{0%,100%{box-shadow:0 5px 0 #a16207,0 8px 20px rgba(0,0,0,.3)}50%{box-shadow:0 5px 0 #a16207,0 8px 30px rgba(250,204,21,.5)}}
.bs-friendly{font-size:11px;color:rgba(255,255,255,.5)}
.bs-friendly span{background:rgba(255,255,255,.15);padding:2px 6px;border-radius:4px;cursor:pointer;margin-right:4px}
#retryBtn{padding:14px 36px;font-size:22px;font-weight:bold;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,#4fc3f7,#0288d1);color:#fff;box-shadow:0 4px 15px rgba(0,0,0,.4);margin-top:10px}
#retryBtn:active{transform:scale(.95)}
#endScreen{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,30,.92);display:none}
#endScreen h1{font-size:40px;margin-bottom:10px}
#endScreen p{color:#ddd;font-size:18px;margin-bottom:6px}
@media(max-width:600px){.bs-sidebar{left:4px}.bs-sidebar-btn{padding:7px 10px;font-size:12px;min-width:auto}.bs-right{right:4px}.bs-friend-slot{width:32px;height:32px}.bs-play-btn{padding:12px 28px;font-size:22px}}
#stormWarn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:16;color:#ff4444;font-size:28px;font-weight:bold;text-shadow:0 0 20px #f00;display:none;pointer-events:none}
</style>

<script>
'use strict';
const C=document.getElementById('gameCanvas'),X=C.getContext('2d');
const hudEl=document.getElementById('hud'),menuEl=document.getElementById('menu'),endEl=document.getElementById('endScreen');
const superBtn=document.getElementById('superBtn');
const minimapC=document.getElementById('minimap'),minimapX=minimapC.getContext('2d');
const MAP=30,TILE=40,MAPW=MAP*TILE,MAPH=MAP*TILE;
let W=window.innerWidth,H=window.innerHeight;
let gameState='menu';
let shakeX=0,shakeY=0,shakeDur=0;
let gameTick=0,gameTimerSec=0;
let totalKills=0,totalDmg=0;

function resize(){W=window.innerWidth;H=window.innerHeight;C.width=W;C.height=H;}
resize();
window.addEventListener('resize',resize);

// Audio
const actx=new (window.AudioContext||window.webkitAudioContext)();
function playSound(freq,dur,type,vol){try{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'square';o.frequency.value=freq;g.gain.value=vol||.12;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);o.stop(actx.currentTime+dur);}catch(e){}}
function sndShoot(pitch){playSound(500+(pitch||0)*50,.08,'square',.1);}
function sndHit(){playSound(200,.1,'sawtooth',.08);}
function sndCube(){playSound(800,.15,'sine',.12);setTimeout(()=>playSound(1000,.1,'sine',.1),80);}
function sndSuperReady(){playSound(500,.1,'sine',.15);setTimeout(()=>playSound(700,.1,'sine',.15),100);setTimeout(()=>playSound(900,.15,'sine',.15),200);}
function sndSuper(){playSound(180,.4,'sawtooth',.18);}
function sndKill(){playSound(600,.1,'sine',.12);setTimeout(()=>playSound(800,.1,'sine',.12),60);setTimeout(()=>playSound(1000,.12,'sine',.12),120);}
function sndWin(){[0,100,200,300,400].forEach((d,i)=>setTimeout(()=>playSound(400+i*100,.2,'sine',.12),d));}
function sndLose(){playSound(300,.4,'sawtooth',.1);setTimeout(()=>playSound(200,.5,'sawtooth',.1),200);}
let heartbeatTimer=0;
function sndHeartbeat(){playSound(60,.15,'sine',.15);setTimeout(()=>playSound(55,.12,'sine',.12),180);}
let stormRumbleNode=null;
function startStormRumble(){try{if(stormRumbleNode)return;const o=actx.createOscillator(),g=actx.createGain();o.type='sawtooth';o.frequency.value=35;g.gain.value=0;o.connect(g);g.connect(actx.destination);o.start();stormRumbleNode={osc:o,gain:g};}catch(e){}}
function updateStormRumble(vol){if(stormRumbleNode)stormRumbleNode.gain.gain.value=Math.min(.06,vol);}
function stopStormRumble(){if(stormRumbleNode){try{stormRumbleNode.osc.stop();}catch(e){}stormRumbleNode=null;}}

// Map
let tiles=[];// 0=grass,1=wall,2=destrWall,3=bush,4=crate,5=water
let tileVariation=[];// random per-tile seed
let wallHP=[]; // for destructible walls
function genMap(){
  tiles=[];tileVariation=[];wallHP=[];
  for(let y=0;y<MAP;y++){tiles[y]=[];tileVariation[y]=[];wallHP[y]=[];for(let x=0;x<MAP;x++){
    tileVariation[y][x]=Math.random();
    wallHP[y][x]=3;
    if(x<2||y<2||x>=MAP-2||y>=MAP-2){tiles[y][x]=1;continue;}
    let cx=MAP/2,cy=MAP/2;
    if(Math.abs(x-cx)<3&&Math.abs(y-cy)<3){tiles[y][x]=0;continue;}
    let r=Math.random();
    if(r<.07)tiles[y][x]=1;
    else if(r<.13)tiles[y][x]=2;
    else if(r<.24)tiles[y][x]=3;
    else if(r<.27)tiles[y][x]=4;
    else if(r<.29)tiles[y][x]=5;
    else tiles[y][x]=0;
  }}
}

// Entities
const BOT_NAMES=['אדום','כחול','כתום','סגול','טורקיז','צהוב','ורוד'];
const COLORS=['#4ade80','#e74c3c','#3498db','#e67e22','#9b59b6','#1abc9c','#f1c40f','#e84393'];
const ACCESSORIES=['bandana','crown','horns','mohawk','cap','tophat','pigtails','visor'];
const PERSONALITIES=['balanced','aggressive','camper','balanced','aggressive','camper','balanced'];
let player,bots=[],bullets=[],particles=[],cubes=[],floatingTexts=[],confetti=[],alive=8;
let killFeedMsgs=[];
const BASE_HP=3000,BASE_DMG=400,SUPER_DMG=800,AMMO_MAX=3,AMMO_REGEN=1.5,SUPER_CHARGE=10,BULLET_SPD=8,BOT_SPD=2.2,PLR_SPD=3.2;
const MAX_PARTICLES=300;

// Camera
let camX=0,camY=0;

function makeBrawler(x,y,color,isPlayer,idx){
  return{x,y,vx:0,vy:0,color,hp:BASE_HP,maxHp:BASE_HP,ammo:AMMO_MAX,ammoTimer:0,superCharge:0,cubes:0,
    alive:true,radius:14,spd:isPlayer?PLR_SPD:BOT_SPD,isPlayer:!!isPlayer,
    dmg:BASE_DMG,aimAngle:0,bobPhase:Math.random()*Math.PI*2,moving:false,
    accessory:ACCESSORIES[idx]||'bandana',personality:PERSONALITIES[idx-1]||'balanced',
    idx:idx,name:isPlayer?'שחקן':BOT_NAMES[idx-1]||'בוט',
    flashTimer:0,deathTimer:0,deathAngle:0,deathAlpha:1,
    aiTimer:0,aiDx:0,aiDy:0,aiShootTimer:0,aiTarget:null};
}

function spawnPos(idx){
  const a=idx*Math.PI*2/8,dist=MAP*TILE*.3;
  const cx=MAP*TILE/2,cy=MAP*TILE/2;
  let px=cx+Math.cos(a)*dist,py=cy+Math.sin(a)*dist;
  px=Math.max(TILE*3,Math.min(MAPW-TILE*3,px));
  py=Math.max(TILE*3,Math.min(MAPH-TILE*3,py));
  return{x:px,y:py};
}

let stormRadius,stormTarget,stormTimer,stormPhase,stormWarnShown;
let moveJoy,aimJoy;

function startGame(){
  genMap();
  bots=[];bullets=[];particles=[];cubes=[];floatingTexts=[];confetti=[];killFeedMsgs=[];alive=8;
  gameTick=0;gameTimerSec=0;totalKills=0;totalDmg=0;
  let sp=spawnPos(0);

  stormRadius=MAPW;stormTarget=MAPW;stormTimer=0;stormPhase=0;stormWarnShown=false;

  moveJoy={active:false,id:-1,sx:0,sy:0,cx:0,cy:0,dx:0,dy:0};

C.addEventListener('touchstart',function(e){

    else if(tx>=W/2&&(!aimJoy||!aimJoy.active)){aimJoy={active:true,id:t.identifier,sx:tx,sy:ty,cx:tx,cy:ty,dx:0,dy:0};}
  }
},{passive:false});
C.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(let t of e.changedTouches){
    if(moveJoy&&t.identifier===moveJoy.id){moveJoy.cx=t.clientX;moveJoy.cy=t.clientY;let dx=moveJoy.cx-moveJoy.sx,dy=moveJoy.cy-moveJoy.sy,d=Math.hypot(dx,dy);if(d>5){moveJoy.dx=dx/d;moveJoy.dy=dy/d;}else{moveJoy.dx=0;moveJoy.dy=0;}}
    if(aimJoy&&t.identifier===aimJoy.id){aimJoy.cx=t.clientX;aimJoy.cy=t.clientY;aimJoy.dx=aimJoy.cx-aimJoy.sx;aimJoy.dy=aimJoy.cy-aimJoy.sy;}
  }
},{passive:false});
C.addEventListener('touchend',function(e){
  e.preventDefault();

    if(moveJoy&&t.identifier===moveJoy.id){moveJoy.active=false;moveJoy.dx=0;moveJoy.dy=0;moveJoy.id=-1;}
    if(aimJoy&&t.identifier===aimJoy.id){
      if(Math.hypot(aimJoy.dx,aimJoy.dy)>20)shootPlayer();

},{passive:false});

function useSuper(){
  if(gameState!=='playing'||!player.alive||player.superCharge<100)return;
  player.superCharge=0;
  sndSuper();
  bots.forEach(b=>{if(!b.alive)return;let d=Math.hypot(b.x-player.x,b.y-player.y);if(d<160){
    dmgBrawler(b,SUPER_DMG+player.cubes*40,player);
    for(let i=0;i<12;i++)spawnParticle(b.x,b.y,'#ffe600',3);
  }});
  shakeDur=12;
  for(let i=0;i<20;i++)spawnParticle(player.x,player.y,'#ffe600',2+Math.random()*2);
}

function spawnMuzzleFlash(x,y){
  for(let i=0;i<4;i++)spawnParticle(x,y,'#fff',1.5);
}

function shootPlayer(){
  if(!player.alive||player.ammo<1)return;
  player.ammo--;
  sndShoot(0);
  let ax,ay;
  if(aimJoy&&aimJoy.active&&Math.hypot(aimJoy.dx,aimJoy.dy)>10){ax=aimJoy.dx;ay=aimJoy.dy;}
  else{ax=mouseX-(player.x-camX);ay=mouseY-(player.y-camY);}
  let d=Math.hypot(ax,ay);if(d<1)return;
  ax/=d;ay/=d;
  player.aimAngle=Math.atan2(ay,ax);
  let bx=player.x+ax*20,by=player.y+ay*20;
  spawnMuzzleFlash(bx,by);
  bullets.push({x:bx,y:by,vx:ax*BULLET_SPD,vy:ay*BULLET_SPD,owner:player,dmg:BASE_DMG+player.cubes*30,life:60,color:'#4fc3f7',radius:5,isSuper:false,trail:[]});
}

function botShoot(bot,tx,ty){
  if(bot.ammo<1)return;
  bot.ammo--;
  sndShoot(bot.idx);
  let dx=tx-bot.x,dy=ty-bot.y,d=Math.hypot(dx,dy);if(d<1)return;
  dx/=d;dy/=d;
  bot.aimAngle=Math.atan2(dy,dx);
  let spread=(Math.random()-.5)*.3,ca=Math.cos(spread),sa=Math.sin(spread);
  let fx=dx*ca-dy*sa,fy=dx*sa+dy*ca;
  let bx=bot.x+fx*20,by=bot.y+fy*20;
  spawnMuzzleFlash(bx,by);
  bullets.push({x:bx,y:by,vx:fx*BULLET_SPD*.85,vy:fy*BULLET_SPD*.85,owner:bot,dmg:BASE_DMG+bot.cubes*30,life:55,color:bot.color,radius:5,isSuper:false,trail:[]});
}

function botUseSuper(bot){
  if(bot.superCharge<100)return;
  bot.superCharge=0;
  sndSuper();
  let targets=[player,...bots].filter(b=>b!==bot&&b.alive);
  targets.forEach(t=>{let d=Math.hypot(t.x-bot.x,t.y-bot.y);if(d<160){dmgBrawler(t,SUPER_DMG+bot.cubes*40,bot);for(let i=0;i<8;i++)spawnParticle(t.x,t.y,'#ffe600',2);}});
  for(let i=0;i<12;i++)spawnParticle(bot.x,bot.y,'#ffe600',2);
}

function addFloatingText(x,y,text,color){
  floatingTexts.push({x,y,text,color:color||'#fff',life:40,vy:-1.5});
}

function addKillFeed(killerName,victimName){
  killFeedMsgs.push({text:killerName+' ◄ '+victimName,time:180});
  let el=document.getElementById('killFeed');
  let div=document.createElement('div');div.className='kill-msg';div.textContent=killerName+' ◄ '+victimName;
  el.appendChild(div);
  setTimeout(()=>{div.style.opacity='0';setTimeout(()=>div.remove(),1000);},3000);
}

function dmgBrawler(target,dmg,attacker){
  target.hp-=dmg;
  target.flashTimer=4;
  sndHit();
  addFloatingText(target.x,target.y-20,Math.round(dmg)+'','#ff4');
  if(attacker&&attacker.isPlayer)totalDmg+=dmg;
  if(attacker){attacker.superCharge=Math.min(100,attacker.superCharge+SUPER_CHARGE);
    if(attacker.superCharge>=100&&attacker.isPlayer)sndSuperReady();
  }
  // hit particles
  for(let i=0;i<8;i++){
    let a=Math.random()*Math.PI*2,s=Math.random()*3+2;
    spawnParticle(target.x+Math.cos(a)*5,target.y+Math.sin(a)*5,Math.random()>.5?'#fff':'#ff4',2);
  }
  if(target.hp<=0){killBrawler(target,attacker);}
}

function killBrawler(b,killer){
  b.alive=false;b.deathTimer=30;b.deathAlpha=1;b.deathAngle=0;
  alive--;
  sndKill();
  shakeDur=8;
  // kill explosion
  for(let i=0;i<16;i++)spawnParticle(b.x,b.y,b.color,2+Math.random()*2);
  for(let i=0;i<8;i++)spawnParticle(b.x,b.y,'#fff',1.5);
  // drop cubes
  for(let i=0;i<b.cubes+1;i++){cubes.push({x:b.x+(Math.random()-0.5)*30,y:b.y+(Math.random()-0.5)*30,timer:0});}
  if(killer){
    if(killer.isPlayer)totalKills++;
    addKillFeed(killer.name,b.name);
  }
  if(b.isPlayer){setTimeout(()=>endGame(false),800);}
  else if(alive<=1&&player.alive){setTimeout(()=>endGame(true),500);}
}

function spawnCubeCollectEffect(x,y){

function collideRect(cx,cy,cr,rx,ry,rw,rh){
  let nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
  return Math.hypot(cx-nx,cy-ny)<cr;
}
function isSolid(tx,ty){if(tx<0||ty<0||tx>=MAP||ty>=MAP)return true;let t=tiles[ty][tx];return t===1||t===2||t===4;}
function pushOutOfWalls(b){
  let tx=Math.floor(b.x/TILE),ty=Math.floor(b.y/TILE);
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    let cx2=tx+dx,cy2=ty+dy;
    if(cx2<0||cy2<0||cx2>=MAP||cy2>=MAP)continue;
    if(!isSolid(cx2,cy2))continue;
    let rx=cx2*TILE,ry=cy2*TILE;
    if(collideRect(b.x,b.y,b.radius,rx,ry,TILE,TILE)){
      let ox=b.x-(rx+TILE/2),oy=b.y-(ry+TILE/2);
      if(Math.abs(ox)>Math.abs(oy)){b.x+=(ox>0?1:-1)*2;}else{b.y+=(oy>0?1:-1)*2;}
    }
  }
}

// Check if projectile heading toward a point
function projHeadingToward(bul,tx,ty,threshold){
  let dx=tx-bul.x,dy=ty-bul.y;
  let d=Math.hypot(dx,dy);if(d<1||d>250)return false;
  let dot=(dx*bul.vx+dy*bul.vy)/(d*Math.hypot(bul.vx,bul.vy)+.001);
  if(dot<.7)return false;
  // perpendicular distance
  let cross=Math.abs(dx*bul.vy-dy*bul.vx)/Math.hypot(bul.vx,bul.vy);
  return cross<(threshold||25);
}

function findNearestCover(bot){
  let bx=Math.floor(bot.x/TILE),by=Math.floor(bot.y/TILE);
  let best=null,bd=Infinity;
  for(let dy=-5;dy<=5;dy++)for(let dx=-5;dx<=5;dx++){
    let tx2=bx+dx,ty2=by+dy;
    if(tx2<2||ty2<2||tx2>=MAP-2||ty2>=MAP-2)continue;
    if(tiles[ty2][tx2]!==0)continue;
    // check adjacent wall
    let hasWall=false;
    for(let d2=-1;d2<=1;d2++)for(let d3=-1;d3<=1;d3++){
      if(d2===0&&d3===0)continue;
      let nx=tx2+d2,ny=ty2+d3;
      if(nx>=0&&ny>=0&&nx<MAP&&ny<MAP&&(tiles[ny][nx]===1||tiles[ny][nx]===2))hasWall=true;
    }
    if(!hasWall)continue;
    let dd=Math.hypot(tx2*TILE+TILE/2-bot.x,ty2*TILE+TILE/2-bot.y);
    if(dd<bd){bd=dd;best={x:tx2*TILE+TILE/2,y:ty2*TILE+TILE/2};}
  }
  return best;
}

function update(){
  if(gameState!=='playing')return;
  gameTick++;
  if(gameTick%60===0)gameTimerSec++;

  // Player movement
  let pdx=0,pdy=0;
  if(keys['w']||keys['arrowup'])pdy=-1;
  if(keys['s']||keys['arrowdown'])pdy=1;
  if(keys['a']||keys['arrowleft'])pdx=-1;
  if(keys['d']||keys['arrowright'])pdx=1;
  if(moveJoy&&moveJoy.active){pdx=moveJoy.dx;pdy=moveJoy.dy;}
  if(player.alive){
    let d=Math.hypot(pdx,pdy);
    player.moving=d>.1;
    if(d>0){pdx/=d;pdy/=d;}
    player.x+=pdx*player.spd;player.y+=pdy*player.spd;
    player.x=Math.max(player.radius,Math.min(MAPW-player.radius,player.x));
    player.y=Math.max(player.radius,Math.min(MAPH-player.radius,player.y));
    pushOutOfWalls(player);
    // aim angle from mouse
    if(!moveJoy||!moveJoy.active){
      let ax=mouseX-(player.x-camX),ay=mouseY-(player.y-camY);
      if(Math.hypot(ax,ay)>5)player.aimAngle=Math.atan2(ay,ax);
    }
    player.bobPhase+=player.moving?.15:0;
  }

  // Ammo regen
  [player,...bots].forEach(b=>{if(!b.alive)return;b.ammoTimer+=1/60;if(b.ammoTimer>=AMMO_REGEN&&b.ammo<AMMO_MAX){b.ammo++;b.ammoTimer=0;}});

  // Heartbeat
  if(player.alive&&player.hp<player.maxHp*.25){
    heartbeatTimer++;
    if(heartbeatTimer%45===0)sndHeartbeat();
  }else heartbeatTimer=0;

  // Bot AI
  bots.forEach(bot=>{
    if(!bot.alive)return;
    bot.aiTimer--;

    // Dodge incoming projectiles
    let dodging=false;
    for(let bul of bullets){
      if(bul.owner===bot)continue;
      if(projHeadingToward(bul,bot.x,bot.y,20)){
        // sidestep perpendicular
        let perpX=-bul.vy,perpY=bul.vx;
        let pd=Math.hypot(perpX,perpY);if(pd>0){perpX/=pd;perpY/=pd;}
        bot.x+=perpX*bot.spd*1.5;bot.y+=perpY*bot.spd*1.5;
        dodging=true;break;
      }
    }

    if(bot.aiTimer<=0&&!dodging){
      bot.aiTimer=25+Math.random()*50;
      let nearest=null,nd=Infinity;
      let targets=[player,...bots].filter(b=>b!==bot&&b.alive);
      targets.forEach(t=>{let dd=Math.hypot(t.x-bot.x,t.y-bot.y);if(dd<nd){nd=dd;nearest=t;}});
      let nearCube=null,ncd=Infinity;
      cubes.forEach(c=>{let dd=Math.hypot(c.x-bot.x,c.y-bot.y);if(dd<ncd){ncd=dd;nearCube=c;}});
      bot.aiTarget=nearest;

      let personality=bot.personality;
      let lowHP=bot.hp<bot.maxHp*.3;

      if(lowHP&&personality!=='aggressive'){
        // seek cover
        let cover=findNearestCover(bot);
        if(cover){
          let dd=Math.hypot(cover.x-bot.x,cover.y-bot.y);
          bot.aiDx=(cover.x-bot.x)/(dd+1);bot.aiDy=(cover.y-bot.y)/(dd+1);
        }
      }else if(nearCube&&ncd<180){
        let dd=Math.hypot(nearCube.x-bot.x,nearCube.y-bot.y);
        bot.aiDx=(nearCube.x-bot.x)/dd;bot.aiDy=(nearCube.y-bot.y)/dd;
      }else if(nearest){
        if(personality==='aggressive'&&nd<350){
          bot.aiDx=(nearest.x-bot.x)/nd;bot.aiDy=(nearest.y-bot.y)/nd;
        }else if(personality==='camper'){
          // stay put if in bush
          let tx2=Math.floor(bot.x/TILE),ty2=Math.floor(bot.y/TILE);
          if(tx2>=0&&ty2>=0&&tx2<MAP&&ty2<MAP&&tiles[ty2][tx2]===3){
            bot.aiDx=0;bot.aiDy=0;
          }else{
            // find a bush
            bot.aiDx=(nearest.x-bot.x)/nd*.3+(Math.random()-.5)*.5;
            bot.aiDy=(nearest.y-bot.y)/nd*.3+(Math.random()-.5)*.5;
          }
        }else{
          bot.aiDx=(nearest.x-bot.x)/nd*.6+(Math.random()-.5)*.7;
          bot.aiDy=(nearest.y-bot.y)/nd*.6+(Math.random()-.5)*.7;
        }
        let dl=Math.hypot(bot.aiDx,bot.aiDy);if(dl>0){bot.aiDx/=dl;bot.aiDy/=dl;}
      }else{bot.aiDx=(Math.random()-.5);bot.aiDy=(Math.random()-.5);}
    }
    if(!dodging){
      bot.x+=bot.aiDx*bot.spd;bot.y+=bot.aiDy*bot.spd;
    }
    bot.x=Math.max(bot.radius,Math.min(MAPW-bot.radius,bot.x));
    bot.y=Math.max(bot.radius,Math.min(MAPH-bot.radius,bot.y));
    bot.moving=Math.hypot(bot.aiDx,bot.aiDy)>.1;
    bot.bobPhase+=bot.moving?.15:0;
    pushOutOfWalls(bot);

    // shoot
    bot.aiShootTimer--;
    if(bot.aiShootTimer<=0){
      let interval=bot.personality==='aggressive'?15:bot.personality==='camper'?35:25;
      bot.aiShootTimer=interval+Math.random()*30;
      let nearest=null,nd2=Infinity;
      [player,...bots].filter(b=>b!==bot&&b.alive).forEach(t=>{let dd=Math.hypot(t.x-bot.x,t.y-bot.y);if(dd<nd2){nd2=dd;nearest=t;}});
      if(nearest&&nd2<320){
        botShoot(bot,nearest.x,nearest.y);
        bot.aimAngle=Math.atan2(nearest.y-bot.y,nearest.x-bot.x);
      }
    }
    // use super when close
    if(bot.superCharge>=100){
      let targets2=[player,...bots].filter(b=>b!==bot&&b.alive);
      let close=targets2.some(t=>Math.hypot(t.x-bot.x,t.y-bot.y)<150);
      if(close)botUseSuper(bot);
    }
  });

  // Bullets
  bullets=bullets.filter(b=>{
    // store trail
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>4)b.trail.shift();
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0)return false;
    let tx=Math.floor(b.x/TILE),ty=Math.floor(b.y/TILE);
    if(tx<0||ty<0||tx>=MAP||ty>=MAP)return false;
    let tile=tiles[ty][tx];
    if(tile===1){spawnParticle(b.x,b.y,'#aaa',2);return false;}
    if(tile===2){
      wallHP[ty][tx]--;
      if(wallHP[ty][tx]<=0){tiles[ty][tx]=0;for(let i=0;i<6;i++)spawnParticle(b.x,b.y,'#c97',2);}
      else{spawnParticle(b.x,b.y,'#a07',1.5);}
      return false;
    }
    if(tile===4){tiles[ty][tx]=0;cubes.push({x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,timer:0});for(let i=0;i<6;i++)spawnParticle(b.x,b.y,'#e040fb',2);return false;}
    let targets=[player,...bots].filter(t=>t!==b.owner&&t.alive);
    for(let t of targets){
      if(Math.hypot(t.x-b.x,t.y-b.y)<t.radius+b.radius){
        dmgBrawler(t,b.dmg,b.owner);
        return false;
      }
    }
    return true;
  });

  // Cubes pickup
  cubes=cubes.filter(c=>{
    c.timer++;
    let allB=[player,...bots].filter(b=>b.alive);
    for(let b of allB){
      if(Math.hypot(b.x-c.x,b.y-c.y)<25){
        b.cubes++;b.maxHp+=200;b.hp=Math.min(b.hp+200,b.maxHp);
        if(b.isPlayer){sndCube();spawnCubeCollectEffect(b.x,b.y);}
        return false;
      }
    }
    return true;
  });

  // Storm
  stormTimer+=1/60;
  stormPhase+=.02;
  let scx=MAPW/2,scy=MAPH/2;
  if(stormTimer>STORM_SHRINK_INTERVAL){
    stormTimer=0;stormTarget=Math.max(80,stormTarget-60);
    // show warning
    if(!stormWarnShown||Math.random()<.3){
      stormWarnShown=true;
      let sw=document.getElementById('stormWarn');sw.style.display='block';
      setTimeout(()=>sw.style.display='none',2000);
    }
  }
  stormRadius+=(stormTarget-stormRadius)*.01;
  let stormVol=Math.max(0,.03*(1-stormRadius/MAPW));
  updateStormRumble(stormVol);
  [player,...bots].forEach(b=>{if(!b.alive)return;if(Math.hypot(b.x-scx,b.y-scy)>stormRadius){b.hp-=STORM_DMG;if(b.hp<=0)killBrawler(b,null);}});

  // Particles
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;p.vx*=.95;p.vy*=.95;return p.life>0;});
  // Floating texts
  floatingTexts=floatingTexts.filter(f=>{f.y+=f.vy;f.life--;return f.life>0;});

  // Death anims
  [player,...bots].forEach(b=>{if(!b.alive&&b.deathTimer>0){b.deathTimer--;b.deathAngle+=.3;b.deathAlpha=b.deathTimer/30;}});
  if(player.flashTimer>0)player.flashTimer--;
  bots.forEach(b=>{if(b.flashTimer>0)b.flashTimer--;});

  // Shake
  if(shakeDur>0){shakeDur--;shakeX=(Math.random()-.5)*8;shakeY=(Math.random()-.5)*8;}else{shakeX=0;shakeY=0;}

  // Camera lerp
  let tcx=player.x-W/2+shakeX,tcy=player.y-H/2+shakeY;
  camX+=(tcx-camX)*.1;camY+=(tcy-camY)*.1;

  // HUD
  let hpPct=Math.max(0,player.hp/player.maxHp);
  document.getElementById('hpBarInner').style.width=(hpPct*100)+'%';
  document.getElementById('hpText').textContent=Math.max(0,Math.round(player.hp));
  // color gradient on hp bar
  let hpBar=document.getElementById('hpBarInner');
  if(hpPct>.5)hpBar.style.background='linear-gradient(90deg,#4caf50,#8bc34a)';
  else if(hpPct>.25)hpBar.style.background='linear-gradient(90deg,#ff9800,#ffeb3b)';
  else hpBar.style.background='linear-gradient(90deg,#f44336,#ff5722)';

  // Ammo bullets
  let ammoBullets=document.querySelectorAll('.ammo-bullet');
  for(let i=0;i<3;i++){
    ammoBullets[i].classList.toggle('empty',i>=Math.floor(player.ammo));
  }

  document.getElementById('hudSuper').textContent='SUPER '+Math.round(player.superCharge)+'%';
  document.getElementById('hudCubes').textContent=player.cubes+' cubes';
  document.getElementById('hudAlive').textContent=alive+' alive';
  superBtn.style.display=(player.superCharge>=100&&player.alive)?'block':'none';

  let min=Math.floor(gameTimerSec/60),sec=Math.floor(gameTimerSec%60);
  document.getElementById('timerDiv').textContent=min+':'+String(sec).padStart(2,'0');
}

// Drawing helpers
function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),bl=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+amt);g=Math.min(255,g+amt);bl=Math.min(255,bl+amt);
  return '#'+[r,g,bl].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function darken(hex,amt){return lighten(hex,-amt);}

function drawBrawler(b,cx,cy){
  let sx=b.x-cx,sy=b.y-cy;
  if(sx<-60||sy<-60||sx>W+60||sy>H+60)return;
  let alpha=b.alive?1:b.deathAlpha;
  if(!b.alive&&b.deathTimer<=0)return;
  X.save();
  X.globalAlpha=alpha;
  let bobY=b.moving?Math.sin(b.bobPhase)*3:0;
  X.translate(sx,sy+bobY);
  if(!b.alive)X.rotate(b.deathAngle);
  if(b.flashTimer>0){X.globalAlpha=.5+Math.random()*.5;}

  // Shadow
  X.fillStyle='rgba(0,0,0,.2)';
  X.beginPath();X.ellipse(0,18,16,8,0,0,Math.PI*2);X.fill();

  // Body (torso)
  X.fillStyle=b.color;X.strokeStyle=darken(b.color,40);X.lineWidth=2;
  X.beginPath();
  X.roundRect(-10,2,20,16,4);
  X.fill();X.stroke();

  // Arms pointing toward aim
  let aa=b.aimAngle;
  X.save();
  X.strokeStyle=darken(b.color,20);X.lineWidth=5;X.lineCap='round';
  // left arm
  X.beginPath();X.moveTo(-10,8);X.lineTo(-10+Math.cos(aa+.5)*14,8+Math.sin(aa+.5)*14);X.stroke();
  // right arm
  X.beginPath();X.moveTo(10,8);X.lineTo(10+Math.cos(aa-.5)*14,8+Math.sin(aa-.5)*14);X.stroke();
  X.restore();

  // Weapon/gun
  X.save();
  X.translate(Math.cos(aa)*12,Math.sin(aa)*12+4);
  X.rotate(aa);
  X.fillStyle='#555';X.fillRect(0,-3,16,6);
  X.fillStyle='#777';X.fillRect(12,-2,6,4);
  X.restore();

  // Head
  let headR=12;
  X.fillStyle=b.color;X.strokeStyle=darken(b.color,40);X.lineWidth=2;
  X.beginPath();X.arc(0,-6,headR,0,Math.PI*2);X.fill();X.stroke();

  // Accessory
  drawAccessory(b.accessory,b.color,headR);

  // Eyes
  X.fillStyle='#fff';
  X.beginPath();X.ellipse(-5,-8,4.5,5.5,0,0,Math.PI*2);X.fill();
  X.beginPath();X.ellipse(5,-8,4.5,5.5,0,0,Math.PI*2);X.fill();
  // Iris (colored)
  let irisColor=b.isPlayer?'#2a7d4f':'#333';
  X.fillStyle=irisColor;
  X.beginPath();X.arc(-4,-8,2.5,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(6,-8,2.5,0,Math.PI*2);X.fill();
  // Highlight
  X.fillStyle='#fff';
  X.beginPath();X.arc(-3,-9.5,1.2,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(7,-9.5,1.2,0,Math.PI*2);X.fill();
  // Eyebrows
  X.strokeStyle='#333';X.lineWidth=1.5;
  X.beginPath();X.moveTo(-7,-13);X.lineTo(-2,-12);X.stroke();
  X.beginPath();X.moveTo(3,-12);X.lineTo(8,-13);X.stroke();
  // Mouth
  X.strokeStyle='#333';X.lineWidth=1.5;
  X.beginPath();X.arc(0,-2,4,0.2,Math.PI-0.2);X.stroke();

  // HP bar
  if(b.alive){
    let bw=30,bh=4,bxo=-bw/2,byo=-headR-14;
    X.fillStyle='#222';X.fillRect(bxo-1,byo-1,bw+2,bh+2);
    let hpPct=Math.max(0,b.hp/b.maxHp);
    if(hpPct>.5)X.fillStyle='#4caf50';
    else if(hpPct>.25)X.fillStyle='#ff9800';
    else X.fillStyle='#f44';
    X.fillRect(bxo,byo,bw*hpPct,bh);
  }

  X.restore();
}

function drawAccessory(acc,color,r){
  switch(acc){
    case 'bandana':
      X.fillStyle='#c0392b';
      X.beginPath();X.moveTo(-r,-6);X.lineTo(r,-6);X.lineTo(r,-10);X.lineTo(-r,-10);X.closePath();X.fill();
      // tail
      X.beginPath();X.moveTo(-r,-8);X.lineTo(-r-6,-12);X.lineTo(-r-4,-6);X.closePath();X.fill();
      break;
    case 'crown':
      X.fillStyle='#f1c40f';X.strokeStyle='#d4a017';X.lineWidth=1;
      X.beginPath();X.moveTo(-8,-16);X.lineTo(-6,-20);X.lineTo(-2,-16);X.lineTo(0,-22);X.lineTo(2,-16);X.lineTo(6,-20);X.lineTo(8,-16);X.closePath();X.fill();X.stroke();
      break;
    case 'horns':
      X.fillStyle='#8b0000';
      X.beginPath();X.moveTo(-8,-14);X.lineTo(-12,-24);X.lineTo(-5,-16);X.closePath();X.fill();
      X.beginPath();X.moveTo(8,-14);X.lineTo(12,-24);X.lineTo(5,-16);X.closePath();X.fill();
      break;
    case 'mohawk':
      X.fillStyle='#e84393';
      for(let i=-2;i<=2;i++){X.beginPath();X.ellipse(i*3,-18+Math.abs(i),2.5,6,0,0,Math.PI*2);X.fill();}
      break;
    case 'cap':
      X.fillStyle='#2980b9';
      X.beginPath();X.arc(0,-10,r+1,Math.PI,0);X.fill();
      X.fillRect(-r-4,-10,r*2+8,3);
      break;
    case 'tophat':
      X.fillStyle='#2c3e50';
      X.fillRect(-7,-28,14,16);
      X.fillRect(-10,-13,20,4);
      break;
    case 'pigtails':
      X.fillStyle=darken(color,30);
      X.beginPath();X.arc(-10,-4,5,0,Math.PI*2);X.fill();
      X.beginPath();X.arc(10,-4,5,0,Math.PI*2);X.fill();
      break;
    case 'visor':
      X.fillStyle='rgba(0,200,255,.5)';
      X.fillRect(-10,-10,20,5);
      X.strokeStyle='#0af';X.lineWidth=1;X.strokeRect(-10,-10,20,5);
      break;
  }
}

function drawTile(tx,ty,cx,cy){
  let sx=tx*TILE-cx,sy=ty*TILE-cy;
  if(sx<-TILE||sy<-TILE||sx>W+TILE||sy>H+TILE)return;
  let t=tiles[ty][tx];
  let v=tileVariation[ty][tx];

  // Grass base
  let shade=((tx+ty)%2===0)?0:12;
  let noise=Math.floor(v*8)-4;
  let gr=74+shade+noise,gg=140+shade+noise,gb=63+shade+noise;
  X.fillStyle='rgb('+gr+','+gg+','+gb+')';
  X.fillRect(sx,sy,TILE+1,TILE+1);

  if(t===5){// water
    X.fillStyle='rgba(50,120,200,.35)';
    X.beginPath();X.arc(sx+TILE/2,sy+TILE/2,TILE*.35,0,Math.PI*2);X.fill();
    X.fillStyle='rgba(180,220,255,.3)';
    X.beginPath();X.arc(sx+TILE/2-3,sy+TILE/2-3,4,0,Math.PI*2);X.fill();
  }
  else if(t===1){// stone wall 3D
    let topH=8;
    // left face
    X.fillStyle='#777';X.fillRect(sx,sy+topH,TILE,TILE-topH);
    // right face darker
    X.fillStyle='#555';
    X.beginPath();X.moveTo(sx+TILE,sy+topH);X.lineTo(sx+TILE,sy+TILE);X.lineTo(sx+TILE-4,sy+TILE-4);X.lineTo(sx+TILE-4,sy+topH+4);X.closePath();X.fill();
    // top face light
    X.fillStyle='#aaa';X.fillRect(sx,sy,TILE,topH);
    // stone lines
    X.strokeStyle='rgba(0,0,0,.2)';X.lineWidth=1;
    X.strokeRect(sx,sy,TILE,TILE);
    X.beginPath();X.moveTo(sx+TILE/2,sy);X.lineTo(sx+TILE/2,sy+TILE);X.stroke();
    X.beginPath();X.moveTo(sx,sy+TILE/2);X.lineTo(sx+TILE,sy+TILE/2);X.stroke();
  }
  else if(t===2){// wooden destructible wall
    X.fillStyle='#a07040';X.fillRect(sx,sy,TILE,TILE);
    X.fillStyle='#c09060';X.fillRect(sx,sy,TILE,TILE-5);
    // horizontal planks
    X.strokeStyle='rgba(80,40,10,.4)';X.lineWidth=1;
    for(let i=1;i<4;i++){X.beginPath();X.moveTo(sx,sy+i*10);X.lineTo(sx+TILE,sy+i*10);X.stroke();}
    // crack marks based on damage
    let hp=wallHP[ty][tx];
    if(hp<3){
      X.strokeStyle='rgba(0,0,0,.5)';X.lineWidth=1.5;
      X.beginPath();X.moveTo(sx+10,sy+5);X.lineTo(sx+20,sy+20);X.stroke();
    }
    if(hp<2){
      X.beginPath();X.moveTo(sx+25,sy+8);X.lineTo(sx+15,sy+30);X.stroke();
    }
    X.strokeStyle='rgba(0,0,0,.15)';X.lineWidth=1;X.strokeRect(sx,sy,TILE,TILE);
  }
  else if(t===3){// bush
    X.globalAlpha=.8;
    let bushes=[[.3,.3,9],[.6,.4,10],[.5,.7,8],[.2,.6,7],[.7,.65,7],[.45,.25,6]];
    for(let b of bushes){
      X.fillStyle='hsl('+(110+v*20)+',50%,'+(22+Math.random()*5)+'%)';
      X.beginPath();X.arc(sx+b[0]*TILE,sy+b[1]*TILE,b[2],0,Math.PI*2);X.fill();
    }
    // highlights
    X.fillStyle='rgba(100,200,80,.4)';
    X.beginPath();X.arc(sx+TILE*.4,sy+TILE*.3,5,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(sx+TILE*.6,sy+TILE*.5,4,0,Math.PI*2);X.fill();
    X.globalAlpha=1;
  }
  else if(t===4){// crate
    let bob=Math.sin(gameTick*.03+v*10)*2;
    let csy=sy+bob;
    // golden glow
    X.save();X.shadowColor='#ffd700';X.shadowBlur=8;
    X.fillStyle='#b8860b';X.fillRect(sx+3,csy+3,TILE-6,TILE-6);
    X.restore();
    X.fillStyle='#d4a030';X.fillRect(sx+3,csy+3,TILE-6,TILE-10);
    // X cross
    X.strokeStyle='rgba(0,0,0,.3)';X.lineWidth=2;
    X.beginPath();X.moveTo(sx+6,csy+6);X.lineTo(sx+TILE-6,csy+TILE-6);X.stroke();
    X.beginPath();X.moveTo(sx+TILE-6,csy+6);X.lineTo(sx+6,csy+TILE-6);X.stroke();
    X.strokeStyle='#ffd700';X.lineWidth=1;X.strokeRect(sx+3,csy+3,TILE-6,TILE-6);
  }
}

function drawMinimap(){
  let mx=minimapX;
  mx.clearRect(0,0,100,100);
  mx.fillStyle='#1a2a1a';mx.fillRect(0,0,100,100);
  let scale=100/MAPW;
  // storm circle
  mx.strokeStyle='rgba(160,40,200,.6)';mx.lineWidth=2;
  mx.beginPath();mx.arc(MAPW/2*scale,MAPH/2*scale,stormRadius*scale,0,Math.PI*2);mx.stroke();
  // bots
  bots.forEach(b=>{if(!b.alive)return;mx.fillStyle='#f44';mx.beginPath();mx.arc(b.x*scale,b.y*scale,2,0,Math.PI*2);mx.fill();});
  // player
  if(player.alive){mx.fillStyle='#4f4';mx.beginPath();mx.arc(player.x*scale,player.y*scale,3,0,Math.PI*2);mx.fill();}
}

function draw(){
  X.clearRect(0,0,W,H);

  if(gameState==='menu'){
    return;
  }
  if(gameState==='end'){
    X.fillStyle='#111';X.fillRect(0,0,W,H);
    confetti.forEach(c=>{
      X.fillStyle=c.color;X.globalAlpha=c.life/200;
      X.fillRect(c.x,c.y,6,6);
    });
    X.globalAlpha=1;
    return;
  }

  let cx=camX,cy=camY;

  // tiles
  let stx=Math.max(0,Math.floor(cx/TILE)),sty=Math.max(0,Math.floor(cy/TILE));
  let etx=Math.min(MAP-1,Math.ceil((cx+W)/TILE)),ety=Math.min(MAP-1,Math.ceil((cy+H)/TILE));
  for(let ty=sty;ty<=ety;ty++)for(let tx=stx;tx<=etx;tx++)drawTile(tx,ty,cx,cy);

  // cubes
  cubes.forEach(c=>{
    let sx2=c.x-cx,sy2=c.y-cy+Math.sin(c.timer*.05)*4;
    if(sx2<-20||sy2<-20||sx2>W+20||sy2>H+20)return;
    X.save();X.shadowColor='#e040fb';X.shadowBlur=12;
    X.fillStyle='#e040fb';
    X.beginPath();X.moveTo(sx2,sy2-8);X.lineTo(sx2+7,sy2);X.lineTo(sx2,sy2+8);X.lineTo(sx2-7,sy2);X.closePath();X.fill();
    X.fillStyle='#f8b4ff';X.beginPath();X.moveTo(sx2,sy2-5);X.lineTo(sx2+3,sy2);X.lineTo(sx2,sy2+2);X.lineTo(sx2-3,sy2);X.closePath();X.fill();
    X.restore();
  });

  // bullets with trail
  bullets.forEach(b=>{
    let sx2=b.x-cx,sy2=b.y-cy;
    if(sx2<-15||sy2<-15||sx2>W+15||sy2>H+15)return;
    // trail
    for(let i=0;i<b.trail.length;i++){
      let t=b.trail[i];
      let tsx=t.x-cx,tsy=t.y-cy;
      X.globalAlpha=.15+i*.08;X.fillStyle=b.color;
      X.beginPath();X.arc(tsx,tsy,b.radius*(0.4+i*.15),0,Math.PI*2);X.fill();
    }
    X.globalAlpha=1;
    // main orb
    X.save();X.shadowColor=b.color;X.shadowBlur=12;
    let gr=X.createRadialGradient(sx2,sy2,0,sx2,sy2,b.radius+3);
    gr.addColorStop(0,'#fff');gr.addColorStop(.4,b.color);gr.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=gr;
    X.beginPath();X.arc(sx2,sy2,b.radius+3,0,Math.PI*2);X.fill();
    X.restore();
  });

  // brawlers
  bots.forEach(b=>drawBrawler(b,cx,cy));
  drawBrawler(player,cx,cy);

  // particles
  particles.forEach(p=>{
    let sx2=p.x-cx,sy2=p.y-cy;
    X.globalAlpha=Math.min(1,p.life/15);X.fillStyle=p.color;
    X.beginPath();X.arc(sx2,sy2,p.radius,0,Math.PI*2);X.fill();
  });
  X.globalAlpha=1;

  // Floating damage texts
  floatingTexts.forEach(f=>{
    let sx2=f.x-cx,sy2=f.y-cy;
    X.globalAlpha=f.life/40;
    X.fillStyle=f.color;X.font='bold 16px sans-serif';X.textAlign='center';
    X.fillText(f.text,sx2,sy2);
  });
  X.globalAlpha=1;

  // Storm overlay with pulsing
  let scx=MAPW/2-cx,scy=MAPH/2-cy;
  let stormAlpha=.3+Math.sin(stormPhase)*.05;
  X.save();
  X.beginPath();X.rect(0,0,W,H);
  X.arc(scx,scy,stormRadius,0,Math.PI*2,true);
  let stGr=X.createRadialGradient(scx,scy,stormRadius,scx,scy,stormRadius+300);
  stGr.addColorStop(0,'rgba(120,20,160,'+stormAlpha+')');
  stGr.addColorStop(1,'rgba(80,0,0,'+(stormAlpha+.2)+')');
  X.fillStyle=stGr;X.fill();
  // edge glow
  X.strokeStyle='rgba(180,40,220,.5)';X.lineWidth=6;
  X.beginPath();X.arc(scx,scy,stormRadius,0,Math.PI*2);X.stroke();
  // occasional lightning
  if(Math.random()<.01){
    let la=Math.random()*Math.PI*2;
    let lx=scx+Math.cos(la)*stormRadius,ly=scy+Math.sin(la)*stormRadius;
    X.strokeStyle='rgba(255,255,255,.8)';X.lineWidth=2;
    X.beginPath();X.moveTo(lx,ly);
    for(let i=0;i<4;i++){lx+=Math.cos(la+Math.PI+Math.random()-.5)*15;ly+=Math.sin(la+Math.PI+Math.random()-.5)*15;X.lineTo(lx,ly);}
    X.stroke();
  }
  X.restore();

  // Joysticks
  if(moveJoy&&moveJoy.active){
    X.globalAlpha=.2;X.fillStyle='#fff';
    X.beginPath();X.arc(moveJoy.sx,moveJoy.sy,55,0,Math.PI*2);X.fill();
    X.globalAlpha=.4;
    X.beginPath();X.arc(moveJoy.sx+moveJoy.dx*45,moveJoy.sy+moveJoy.dy*45,22,0,Math.PI*2);X.fill();
    X.globalAlpha=1;
  }
  if(aimJoy&&aimJoy.active){
    X.globalAlpha=.2;X.fillStyle='#f44';
    X.beginPath();X.arc(aimJoy.sx,aimJoy.sy,55,0,Math.PI*2);X.fill();
    let ad=Math.hypot(aimJoy.dx,aimJoy.dy),adx=ad>1?aimJoy.dx/ad*45:0,ady=ad>1?aimJoy.dy/ad*45:0;
    X.globalAlpha=.4;
    X.beginPath();X.arc(aimJoy.sx+adx,aimJoy.sy+ady,22,0,Math.PI*2);X.fill();
    // aim line
    if(ad>20&&player.alive){
      let ax=aimJoy.dx/ad,ay=aimJoy.dy/ad;
      let plsx=player.x-cx,plsy=player.y-cy;
      X.globalAlpha=.25;X.strokeStyle='#f44';X.lineWidth=2;X.setLineDash([6,4]);
      X.beginPath();X.moveTo(plsx,plsy);X.lineTo(plsx+ax*150,plsy+ay*150);X.stroke();
      X.setLineDash([]);
    }
    X.globalAlpha=1;
  }

  // Minimap
  drawMinimap();
}


// Confetti
function updateConfetti(){
  confetti=confetti.filter(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=.05;c.life--;return c.life>0;});
}

// Menu character drawing
let menuCharTick=0,menuBlinkTimer=0,menuIsBlinking=false;
function drawMenuChar(){
  let pc=document.getElementById('menuCharCanvas');
  if(!pc)return;
  let px=pc.getContext('2d');
  px.clearRect(0,0,200,260);
  menuCharTick+=.03;
  menuBlinkTimer++;
  if(!menuIsBlinking&&menuBlinkTimer>180+Math.random()*60){menuIsBlinking=true;menuBlinkTimer=0;}
  if(menuIsBlinking&&menuBlinkTimer>8){menuIsBlinking=false;menuBlinkTimer=0;}
  let cx=100,cy=140;
  // shadow
  px.fillStyle='rgba(0,0,0,.25)';px.beginPath();px.ellipse(cx,cy+54,40,16,0,0,Math.PI*2);px.fill();
  // legs
  px.fillStyle='#2a8a50';
  px.fillRect(cx-12,cy+26,10,16);px.fillRect(cx+2,cy+26,10,16);
  // feet
  px.fillStyle='#222';
  px.beginPath();px.ellipse(cx-7,cy+44,8,5,0,0,Math.PI*2);px.fill();
  px.beginPath();px.ellipse(cx+7,cy+44,8,5,0,0,Math.PI*2);px.fill();
  // body
  px.fillStyle='#4ade80';px.strokeStyle='#2a8a50';px.lineWidth=3;
  px.beginPath();px.roundRect(cx-16,cy+4,32,24,6);px.fill();px.stroke();
  // arms
  px.strokeStyle='#3cb371';px.lineWidth=8;px.lineCap='round';
  let armSwing=Math.sin(menuCharTick*2)*.15;
  px.beginPath();px.moveTo(cx-16,cy+14);px.lineTo(cx-36,cy+14+Math.sin(armSwing)*10+15);px.stroke();
  px.beginPath();px.moveTo(cx+16,cy+14);px.lineTo(cx+36,cy+14+Math.sin(-armSwing)*10+15);px.stroke();
  // gun right hand
  px.fillStyle='#555';px.save();px.translate(cx+36,cy+28);px.rotate(-.4);
  px.fillRect(0,-5,28,10);px.fillStyle='#777';px.fillRect(20,-3,10,6);px.restore();
  // head
  let headR=24;
  px.fillStyle='#4ade80';px.strokeStyle='#2a8a50';px.lineWidth=3;
  px.beginPath();px.arc(cx,cy-14,headR,0,Math.PI*2);px.fill();px.stroke();
  // bandana
  px.fillStyle='#c0392b';
  px.fillRect(cx-headR-2,cy-22,headR*2+4,7);
  px.beginPath();px.moveTo(cx-headR-2,cy-18);px.lineTo(cx-headR-14,cy-30);px.lineTo(cx-headR+2,cy-14);px.closePath();px.fill();
  // eyes
  if(menuIsBlinking){
    px.strokeStyle='#333';px.lineWidth=2.5;
    px.beginPath();px.moveTo(cx-10,cy-16);px.lineTo(cx-3,cy-16);px.stroke();
    px.beginPath();px.moveTo(cx+3,cy-16);px.lineTo(cx+10,cy-16);px.stroke();
  }else{
    px.fillStyle='#fff';
    px.beginPath();px.ellipse(cx-7,cy-16,7,9,0,0,Math.PI*2);px.fill();
    px.beginPath();px.ellipse(cx+7,cy-16,7,9,0,0,Math.PI*2);px.fill();
    px.fillStyle='#2a7d4f';
    px.beginPath();px.arc(cx-6,cy-15,4,0,Math.PI*2);px.fill();
    px.beginPath();px.arc(cx+8,cy-15,4,0,Math.PI*2);px.fill();
    px.fillStyle='#fff';
    px.beginPath();px.arc(cx-8,cy-18,2,0,Math.PI*2);px.fill();
    px.beginPath();px.arc(cx+6,cy-18,2,0,Math.PI*2);px.fill();
  }
  // eyebrows
  px.strokeStyle='#333';px.lineWidth=2.5;
  px.beginPath();px.moveTo(cx-13,cy-26);px.lineTo(cx-2,cy-24);px.stroke();
  px.beginPath();px.moveTo(cx+2,cy-24);px.lineTo(cx+13,cy-26);px.stroke();
  // mouth
  px.strokeStyle='#333';px.lineWidth=2;
  px.beginPath();px.arc(cx,cy-6,7,.2,Math.PI-.2);px.stroke();
}

function loop(){
  if(gameState==='menu'){drawMenuChar();}
  if(gameState==='end')updateConfetti();
  update();
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('startBtn').addEventListener('click',()=>{if(actx.state==='suspended')actx.resume();startGame();});
document.getElementById('retryBtn').addEventListener('click',()=>{startGame();});

loop();
</script>
