<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>בראול סטארז ⚔️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{overflow:hidden;background:#111;font-family:'Segoe UI',Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;top:0;left:0;z-index:1;display:block}
#hud{position:fixed;top:0;left:0;right:0;z-index:10;display:none;padding:6px 10px;background:rgba(0,0,0,.55);color:#fff;font-size:14px;font-weight:bold;display:flex;justify-content:center;gap:14px;align-items:center;direction:ltr}
#hud span{white-space:nowrap}
#topLink{position:fixed;top:0;right:6px;z-index:20;color:#aef;font-size:13px;text-decoration:none;padding:4px 8px}
#superBtn{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:15;display:none;width:70px;height:70px;border-radius:50%;border:3px solid #ff0;background:radial-gradient(circle,#ffe600,#f90);color:#333;font-size:28px;font-weight:bold;cursor:pointer;box-shadow:0 0 20px rgba(255,230,0,.7)}
#menu,#endScreen{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,10,30,.92)}
#menu h1{font-size:38px;color:#ffe600;text-shadow:0 3px 8px rgba(0,0,0,.7);margin-bottom:4px}
#menu p{color:#ccc;font-size:16px;margin-bottom:20px}
#startBtn,#retryBtn{padding:14px 36px;font-size:22px;font-weight:bold;border:none;border-radius:12px;cursor:pointer;background:linear-gradient(135deg,#4fc3f7,#0288d1);color:#fff;box-shadow:0 4px 15px rgba(0,0,0,.4);margin-top:10px}
#startBtn:active,#retryBtn:active{transform:scale(.95)}
#endScreen{display:none}
#endScreen h1{font-size:36px;margin-bottom:10px}
#endScreen p{color:#ddd;font-size:18px;margin-bottom:6px}
#previewCanvas{border-radius:12px;margin-bottom:12px}
.hp-txt{color:#f66}.ammo-txt{color:#4fc3f7}.super-txt{color:#ffe600}.cube-txt{color:#e040fb}.alive-txt{color:#aaa}
</style>
</head>
<body>
<a id="topLink" href="index.html">→ SlideFlow</a>
<div id="hud">
<span class="hp-txt" id="hudHp">❤️ 100</span>
<span class="ammo-txt" id="hudAmmo">🔫 3</span>
<span class="super-txt" id="hudSuper">⚡ 0%</span>
<span class="cube-txt" id="hudCubes">💎 0</span>
<span class="alive-txt" id="hudAlive">👥 8</span>
</div>
<button id="superBtn" ontouchstart="">⚡</button>
<div id="menu">
<canvas id="previewCanvas" width="120" height="120"></canvas>
<h1>בראול סטארז ⚔️</h1>
<p>השמד את כולם — אחרון שורד!</p>
<button id="startBtn">התחל קרב!</button>
</div>
<div id="endScreen">
<h1 id="endTitle"></h1>
<p id="endStat1"></p>
<p id="endStat2"></p>
<button id="retryBtn">שחק שוב!</button>
</div>
<canvas id="gameCanvas"></canvas>
<script>
'use strict';
const C=document.getElementById('gameCanvas'),X=C.getContext('2d');
const hudEl=document.getElementById('hud'),menuEl=document.getElementById('menu'),endEl=document.getElementById('endScreen');
const superBtn=document.getElementById('superBtn');
const MAP=28,TILE=40,MAPW=MAP*TILE,MAPH=MAP*TILE;
let W=window.innerWidth,H=window.innerHeight;
let gameState='menu'; // menu|playing|end
let shakeX=0,shakeY=0,shakeDur=0;

function resize(){W=window.innerWidth;H=window.innerHeight;C.width=W;C.height=H;}
resize();
window.addEventListener('resize',resize);

// Audio
const actx=new (window.AudioContext||window.webkitAudioContext)();
function playSound(freq,dur,type,vol){try{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'square';o.frequency.value=freq;g.gain.value=vol||.12;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);o.stop(actx.currentTime+dur);}catch(e){}}
function sndShoot(){playSound(600,.08,'square',.1);}
function sndHit(){playSound(200,.1,'sawtooth',.08);}
function sndCube(){playSound(800,.15,'sine',.12);setTimeout(()=>playSound(1000,.1,'sine',.1),80);}
function sndSuperReady(){playSound(500,.1,'sine',.15);setTimeout(()=>playSound(700,.1,'sine',.15),100);setTimeout(()=>playSound(900,.15,'sine',.15),200);}
function sndSuper(){playSound(300,.3,'sawtooth',.15);}
function sndWin(){[0,100,200,300,400].forEach((d,i)=>setTimeout(()=>playSound(400+i*100,.2,'sine',.12),d));}
function sndLose(){playSound(300,.4,'sawtooth',.1);setTimeout(()=>playSound(200,.5,'sawtooth',.1),200);}

// Map
let tiles=[];// 0=grass,1=wall,2=destrWall,3=bush,4=crate
function genMap(){
  tiles=[];
  for(let y=0;y<MAP;y++){tiles[y]=[];for(let x=0;x<MAP;x++){
    if(x===0||y===0||x===MAP-1||y===MAP-1){tiles[y][x]=1;continue;}
    let cx=MAP/2,cy=MAP/2;
    if(Math.abs(x-cx)<3&&Math.abs(y-cy)<3){tiles[y][x]=0;continue;}
    let r=Math.random();
    if(r<.08)tiles[y][x]=1;
    else if(r<.14)tiles[y][x]=2;
    else if(r<.26)tiles[y][x]=3;
    else if(r<.29)tiles[y][x]=4;
    else tiles[y][x]=0;
  }}
}

// Entities
const COLORS=['#2ecc71','#e74c3c','#3498db','#e67e22','#9b59b6','#1abc9c','#f1c40f','#e84393'];
let player,bots=[],bullets=[],particles=[],cubes=[],alive=8;
const BASE_HP=3000,BASE_DMG=400,SUPER_DMG=800,AMMO_MAX=3,AMMO_REGEN=1.5,SUPER_CHARGE=10,BULLET_SPD=8,BOT_SPD=2.2,PLR_SPD=3.2;

function makeBrawler(x,y,color,isPlayer){
  return{x,y,vx:0,vy:0,color,hp:BASE_HP,maxHp:BASE_HP,ammo:AMMO_MAX,ammoTimer:0,superCharge:0,cubes:0,
    alive:true,radius:14,spd:isPlayer?PLR_SPD:BOT_SPD,isPlayer:!!isPlayer,
    dmg:BASE_DMG,deathTimer:0,deathAngle:0,deathAlpha:1,
    aiTimer:0,aiDx:0,aiDy:0,aiShootTimer:0};
}

function spawnPos(idx){
  const angles=idx*Math.PI*2/8;
  const dist=MAP*TILE*.3;
  const cx=MAP*TILE/2,cy=MAP*TILE/2;
  let px=cx+Math.cos(angles)*dist,py=cy+Math.sin(angles)*dist;
  // clamp
  px=Math.max(TILE*2,Math.min(MAPW-TILE*2,px));
  py=Math.max(TILE*2,Math.min(MAPH-TILE*2,py));
  return{x:px,y:py};
}

function initGame(){
  genMap();
  bots=[];bullets=[];particles=[];cubes=[];alive=8;
  let sp=spawnPos(0);
  player=makeBrawler(sp.x,sp.y,COLORS[0],true);
  for(let i=1;i<8;i++){let s=spawnPos(i);bots.push(makeBrawler(s.x,s.y,COLORS[i],false));}
  stormRadius=MAPW;stormTarget=MAPW;stormTimer=0;
  gameState='playing';
  hudEl.style.display='flex';
  menuEl.style.display='none';
  endEl.style.display='none';
  resize();
}

// Storm
let stormRadius=MAPW,stormTarget=MAPW,stormTimer=0;
const STORM_SHRINK_INTERVAL=8,STORM_DMG=30;

// Joystick state
let moveJoy={active:false,id:-1,sx:0,sy:0,cx:0,cy:0,dx:0,dy:0};
let aimJoy={active:false,id:-1,sx:0,sy:0,cx:0,cy:0,dx:0,dy:0};

// Keys
let keys={};
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '||e.key==='q')useSuper();});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});

// Mouse
let mouseX=0,mouseY=0;
window.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY;});
window.addEventListener('mousedown',e=>{if(gameState==='playing')shootPlayer();});

// Touch
C.addEventListener('touchstart',function(e){
  e.preventDefault();
  for(let t of e.changedTouches){
    let tx=t.clientX,ty=t.clientY;
    if(tx<W/2&&!moveJoy.active){moveJoy={active:true,id:t.identifier,sx:tx,sy:ty,cx:tx,cy:ty,dx:0,dy:0};}
    else if(tx>=W/2&&!aimJoy.active){aimJoy={active:true,id:t.identifier,sx:tx,sy:ty,cx:tx,cy:ty,dx:0,dy:0};}
  }
},{passive:false});
C.addEventListener('touchmove',function(e){
  e.preventDefault();
  for(let t of e.changedTouches){
    if(t.identifier===moveJoy.id){moveJoy.cx=t.clientX;moveJoy.cy=t.clientY;let dx=moveJoy.cx-moveJoy.sx,dy=moveJoy.cy-moveJoy.sy,d=Math.hypot(dx,dy);if(d>5){moveJoy.dx=dx/d;moveJoy.dy=dy/d;}else{moveJoy.dx=0;moveJoy.dy=0;}}
    if(t.identifier===aimJoy.id){aimJoy.cx=t.clientX;aimJoy.cy=t.clientY;aimJoy.dx=aimJoy.cx-aimJoy.sx;aimJoy.dy=aimJoy.cy-aimJoy.sy;}
  }
},{passive:false});
C.addEventListener('touchend',function(e){
  e.preventDefault();
  for(let t of e.changedTouches){
    if(t.identifier===moveJoy.id){moveJoy.active=false;moveJoy.dx=0;moveJoy.dy=0;moveJoy.id=-1;}
    if(t.identifier===aimJoy.id){
      if(Math.hypot(aimJoy.dx,aimJoy.dy)>20)shootPlayer();
      aimJoy.active=false;aimJoy.dx=0;aimJoy.dy=0;aimJoy.id=-1;
    }
  }
},{passive:false});

superBtn.addEventListener('click',useSuper);
superBtn.addEventListener('touchstart',function(e){e.preventDefault();e.stopPropagation();useSuper();},{passive:false});

function useSuper(){
  if(gameState!=='playing'||!player.alive||player.superCharge<100)return;
  player.superCharge=0;
  sndSuper();
  // big area damage
  let allB=[...bots];
  allB.forEach(b=>{if(!b.alive)return;let d=Math.hypot(b.x-player.x,b.y-player.y);if(d<150){
    dmgBrawler(b,SUPER_DMG+player.cubes*40,player);
    for(let i=0;i<8;i++)spawnParticle(b.x,b.y,'#ffe600');
  }});
  shakeDur=10;
  for(let i=0;i<15;i++)spawnParticle(player.x,player.y,'#ffe600');
}

function shootPlayer(){
  if(!player.alive||player.ammo<1)return;
  player.ammo--;
  sndShoot();
  let ax,ay;
  if(aimJoy.active||Math.hypot(aimJoy.dx,aimJoy.dy)>10){ax=aimJoy.dx;ay=aimJoy.dy;}
  else{
    const camX=player.x-W/2,camY=player.y-H/2;
    ax=mouseX-(player.x-camX);ay=mouseY-(player.y-camY);
  }
  let d=Math.hypot(ax,ay);if(d<1)return;
  ax/=d;ay/=d;
  bullets.push({x:player.x,y:player.y,vx:ax*BULLET_SPD,vy:ay*BULLET_SPD,owner:player,dmg:BASE_DMG+player.cubes*30,life:60,color:'#4fc3f7',radius:5,isSuper:false});
}

function botShoot(bot,tx,ty){
  if(bot.ammo<1)return;
  bot.ammo--;
  let dx=tx-bot.x,dy=ty-bot.y,d=Math.hypot(dx,dy);if(d<1)return;
  dx/=d;dy/=d;
  // add slight inaccuracy
  let spread=(Math.random()-.5)*.3;
  let ca=Math.cos(spread),sa=Math.sin(spread);
  let fx=dx*ca-dy*sa,fy=dx*sa+dy*ca;
  bullets.push({x:bot.x,y:bot.y,vx:fx*BULLET_SPD*.85,vy:fy*BULLET_SPD*.85,owner:bot,dmg:BASE_DMG+bot.cubes*30,life:55,color:bot.color,radius:5,isSuper:false});
}

function botUseSuper(bot){
  if(bot.superCharge<100)return;
  bot.superCharge=0;
  let targets=[player,...bots].filter(b=>b!==bot&&b.alive);
  targets.forEach(t=>{let d=Math.hypot(t.x-bot.x,t.y-bot.y);if(d<150){dmgBrawler(t,SUPER_DMG+bot.cubes*40,bot);for(let i=0;i<5;i++)spawnParticle(t.x,t.y,'#ffe600');}});
  for(let i=0;i<10;i++)spawnParticle(bot.x,bot.y,'#ffe600');
}

function dmgBrawler(target,dmg,attacker){
  target.hp-=dmg;
  sndHit();
  if(attacker){attacker.superCharge=Math.min(100,attacker.superCharge+SUPER_CHARGE);
    if(attacker.superCharge>=100&&attacker.isPlayer)sndSuperReady();
  }
  for(let i=0;i<4;i++)spawnParticle(target.x,target.y,'#fff');
  if(target.hp<=0){killBrawler(target,attacker);}
}

function killBrawler(b,killer){
  b.alive=false;b.deathTimer=30;b.deathAlpha=1;b.deathAngle=0;
  alive--;
  // drop cubes
  for(let i=0;i<b.cubes+1;i++){cubes.push({x:b.x+(Math.random()-0.5)*30,y:b.y+(Math.random()-0.5)*30,timer:0});}
  if(b.isPlayer){setTimeout(()=>endGame(false),800);}
  else if(alive<=1&&player.alive){setTimeout(()=>endGame(true),500);}
}

function endGame(won){
  gameState='end';
  hudEl.style.display='none';
  superBtn.style.display='none';
  endEl.style.display='flex';
  document.getElementById('endTitle').textContent=won?'🏆 ניצחון!':'💀 הפסד...';
  document.getElementById('endStat1').textContent='💎 קוביות: '+player.cubes;
  document.getElementById('endStat2').textContent='👥 שרדו: '+alive;
  if(won)sndWin();else sndLose();
}

function spawnParticle(x,y,color){
  if(particles.length>200)return;
  let a=Math.random()*Math.PI*2,s=Math.random()*3+1;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*10,color,radius:2+Math.random()*2});
}

function collideRect(cx,cy,cr,rx,ry,rw,rh){
  let nx=Math.max(rx,Math.min(cx,rx+rw)),ny=Math.max(ry,Math.min(cy,ry+rh));
  return Math.hypot(cx-nx,cy-ny)<cr;
}

function isSolid(tx,ty){if(tx<0||ty<0||tx>=MAP||ty>=MAP)return true;let t=tiles[ty][tx];return t===1||t===2||t===4;}

function pushOutOfWalls(b){
  let tx=Math.floor(b.x/TILE),ty=Math.floor(b.y/TILE);
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    let cx=tx+dx,cy=ty+dy;
    if(cx<0||cy<0||cx>=MAP||cy>=MAP)continue;
    if(!isSolid(cx,cy))continue;
    let rx=cx*TILE,ry=cy*TILE;
    if(collideRect(b.x,b.y,b.radius,rx,ry,TILE,TILE)){
      let ox=b.x-(rx+TILE/2),oy=b.y-(ry+TILE/2);
      if(Math.abs(ox)>Math.abs(oy)){b.x+=(ox>0?1:-1)*2;}else{b.y+=(oy>0?1:-1)*2;}
    }
  }
}

function update(){
  if(gameState!=='playing')return;
  // Player movement
  let pdx=0,pdy=0;
  if(keys['w']||keys['arrowup'])pdy=-1;
  if(keys['s']||keys['arrowdown'])pdy=1;
  if(keys['a']||keys['arrowleft'])pdx=-1;
  if(keys['d']||keys['arrowright'])pdx=1;
  if(moveJoy.active){pdx=moveJoy.dx;pdy=moveJoy.dy;}
  if(player.alive){
    let d=Math.hypot(pdx,pdy);if(d>0){pdx/=d;pdy/=d;}
    player.x+=pdx*player.spd;player.y+=pdy*player.spd;
    player.x=Math.max(player.radius,Math.min(MAPW-player.radius,player.x));
    player.y=Math.max(player.radius,Math.min(MAPH-player.radius,player.y));
    pushOutOfWalls(player);
  }
  // Ammo regen
  [player,...bots].forEach(b=>{if(!b.alive)return;b.ammoTimer+=1/60;if(b.ammoTimer>=AMMO_REGEN&&b.ammo<AMMO_MAX){b.ammo++;b.ammoTimer=0;}});

  // Bot AI
  bots.forEach(bot=>{
    if(!bot.alive)return;
    bot.aiTimer--;
    if(bot.aiTimer<=0){
      bot.aiTimer=30+Math.random()*60;
      // find nearest target
      let nearest=null,nd=Infinity;
      let targets=[player,...bots].filter(b=>b!==bot&&b.alive);
      targets.forEach(t=>{let d=Math.hypot(t.x-bot.x,t.y-bot.y);if(d<nd){nd=d;nearest=t;}});
      // also check cubes
      let nearCube=null,ncd=Infinity;
      cubes.forEach(c=>{let d=Math.hypot(c.x-bot.x,c.y-bot.y);if(d<ncd){ncd=d;nearCube=c;}});

      if(nearCube&&ncd<200){
        let d=Math.hypot(nearCube.x-bot.x,nearCube.y-bot.y);
        bot.aiDx=(nearCube.x-bot.x)/d;bot.aiDy=(nearCube.y-bot.y)/d;
      }else if(nearest&&nd<250){
        // fight
        bot.aiDx=(nearest.x-bot.x)/nd*.6+(Math.random()-.5)*.8;
        bot.aiDy=(nearest.y-bot.y)/nd*.6+(Math.random()-.5)*.8;
        let dl=Math.hypot(bot.aiDx,bot.aiDy);if(dl>0){bot.aiDx/=dl;bot.aiDy/=dl;}
      }else if(nearest){
        bot.aiDx=(nearest.x-bot.x)/nd;bot.aiDy=(nearest.y-bot.y)/nd;
      }else{bot.aiDx=(Math.random()-.5);bot.aiDy=(Math.random()-.5);}
    }
    bot.x+=bot.aiDx*bot.spd;bot.y+=bot.aiDy*bot.spd;
    bot.x=Math.max(bot.radius,Math.min(MAPW-bot.radius,bot.x));
    bot.y=Math.max(bot.radius,Math.min(MAPH-bot.radius,bot.y));
    pushOutOfWalls(bot);

    // shoot
    bot.aiShootTimer--;
    if(bot.aiShootTimer<=0){
      bot.aiShootTimer=20+Math.random()*40;
      let nearest=null,nd=Infinity;
      [player,...bots].filter(b=>b!==bot&&b.alive).forEach(t=>{let d=Math.hypot(t.x-bot.x,t.y-bot.y);if(d<nd){nd=d;nearest=t;}});
      if(nearest&&nd<300)botShoot(bot,nearest.x,nearest.y);
    }
    if(bot.superCharge>=100&&Math.random()<.02)botUseSuper(bot);
  });

  // Bullets
  bullets=bullets.filter(b=>{
    b.x+=b.vx;b.y+=b.vy;b.life--;
    if(b.life<=0)return false;
    // wall collision
    let tx=Math.floor(b.x/TILE),ty=Math.floor(b.y/TILE);
    if(tx<0||ty<0||tx>=MAP||ty>=MAP)return false;
    let tile=tiles[ty][tx];
    if(tile===1)return false;
    if(tile===2){tiles[ty][tx]=0;for(let i=0;i<5;i++)spawnParticle(b.x,b.y,'#c97');return false;}
    if(tile===4){tiles[ty][tx]=0;cubes.push({x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,timer:0});for(let i=0;i<5;i++)spawnParticle(b.x,b.y,'#e040fb');return false;}
    // hit brawlers
    let targets=[player,...bots].filter(t=>t!==b.owner&&t.alive);
    for(let t of targets){
      if(Math.hypot(t.x-b.x,t.y-b.y)<t.radius+b.radius){
        dmgBrawler(t,b.dmg,b.owner);
        return false;
      }
    }
    return true;
  });

  // Cubes pickup
  cubes=cubes.filter(c=>{
    c.timer++;
    let allB=[player,...bots].filter(b=>b.alive);
    for(let b of allB){
      if(Math.hypot(b.x-c.x,b.y-c.y)<25){b.cubes++;b.maxHp+=200;b.hp=Math.min(b.hp+200,b.maxHp);if(b.isPlayer)sndCube();return false;}
    }
    return true;
  });

  // Storm
  stormTimer+=1/60;
  if(stormTimer>STORM_SHRINK_INTERVAL){stormTimer=0;stormTarget=Math.max(80,stormTarget-60);}
  stormRadius+=(stormTarget-stormRadius)*.01;
  // storm damage
  let scx=MAPW/2,scy=MAPH/2;
  [player,...bots].forEach(b=>{if(!b.alive)return;if(Math.hypot(b.x-scx,b.y-scy)>stormRadius){b.hp-=STORM_DMG;if(b.hp<=0)killBrawler(b,null);}});

  // Particles
  particles=particles.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.life--;p.vx*=.95;p.vy*=.95;return p.life>0;});

  // Death anims
  [player,...bots].forEach(b=>{if(!b.alive&&b.deathTimer>0){b.deathTimer--;b.deathAngle+=.3;b.deathAlpha=b.deathTimer/30;}});

  // Shake
  if(shakeDur>0){shakeDur--;shakeX=(Math.random()-.5)*6;shakeY=(Math.random()-.5)*6;}else{shakeX=0;shakeY=0;}

  // HUD
  document.getElementById('hudHp').textContent='❤️ '+Math.max(0,Math.round(player.hp));
  document.getElementById('hudAmmo').textContent='🔫 '+Math.floor(player.ammo);
  document.getElementById('hudSuper').textContent='⚡ '+Math.round(player.superCharge)+'%';
  document.getElementById('hudCubes').textContent='💎 '+player.cubes;
  document.getElementById('hudAlive').textContent='👥 '+alive;
  superBtn.style.display=(player.superCharge>=100&&player.alive)?'block':'none';
}

// Drawing
function drawBrawler(b,cx,cy){
  let sx=b.x-cx,sy=b.y-cy;
  if(sx<-50||sy<-50||sx>W+50||sy>H+50)return;
  let alpha=b.alive?1:b.deathAlpha;
  if(!b.alive&&b.deathTimer<=0)return;
  X.save();
  X.globalAlpha=alpha;
  X.translate(sx,sy);
  if(!b.alive)X.rotate(b.deathAngle);

  // Shadow
  X.fillStyle='rgba(0,0,0,.25)';
  X.beginPath();X.ellipse(2,4,b.radius,b.radius*.6,0,0,Math.PI*2);X.fill();

  // Body
  let gr=X.createRadialGradient(-4,-4,2,2,2,b.radius+4);
  gr.addColorStop(0,lighten(b.color,40));
  gr.addColorStop(1,b.color);
  X.fillStyle=gr;
  X.strokeStyle='rgba(0,0,0,.4)';X.lineWidth=2;
  X.beginPath();X.arc(0,0,b.radius,0,Math.PI*2);X.fill();X.stroke();

  // Eyes
  X.fillStyle='#fff';
  X.beginPath();X.ellipse(-5,-3,4,5,0,0,Math.PI*2);X.fill();
  X.beginPath();X.ellipse(5,-3,4,5,0,0,Math.PI*2);X.fill();
  X.fillStyle='#222';
  X.beginPath();X.arc(-4,-3,2,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(6,-3,2,0,Math.PI*2);X.fill();
  X.fillStyle='#fff';
  X.beginPath();X.arc(-3,-4,1,0,Math.PI*2);X.fill();
  X.beginPath();X.arc(7,-4,1,0,Math.PI*2);X.fill();

  // HP bar
  if(b.alive){
    let bw=28,bh=4,bx=-bw/2,by=-b.radius-8;
    X.fillStyle='#333';X.fillRect(bx-1,by-1,bw+2,bh+2);
    let hpPct=Math.max(0,b.hp/b.maxHp);
    let hpGr=X.createLinearGradient(bx,0,bx+bw*hpPct,0);
    hpGr.addColorStop(0,'#4caf50');hpGr.addColorStop(1,'#8bc34a');
    X.fillStyle=hpGr;X.fillRect(bx,by,bw*hpPct,bh);
  }

  X.restore();
}

function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,r+amt);g=Math.min(255,g+amt);b=Math.min(255,b+amt);
  return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function drawTile(tx,ty,cx,cy){
  let sx=tx*TILE-cx,sy=ty*TILE-cy;
  if(sx<-TILE||sy<-TILE||sx>W+TILE||sy>H+TILE)return;
  let t=tiles[ty][tx];
  // Grass
  let gc=((tx+ty)%2===0)?'#4a8c3f':'#55a044';
  X.fillStyle=gc;X.fillRect(sx,sy,TILE,TILE);

  if(t===1){// wall
    X.fillStyle='#888';X.fillRect(sx,sy,TILE,TILE);
    X.fillStyle='#aaa';X.fillRect(sx,sy,TILE,TILE-6);
    X.fillStyle='#666';X.fillRect(sx,sy+TILE-6,TILE,6);
    X.strokeStyle='rgba(0,0,0,.3)';X.lineWidth=1;X.strokeRect(sx,sy,TILE,TILE);
  }else if(t===2){// destructible wall
    X.fillStyle='#a0724e';X.fillRect(sx,sy,TILE,TILE);
    X.fillStyle='#c09060';X.fillRect(sx,sy,TILE,TILE-5);
    X.fillStyle='#805030';X.fillRect(sx,sy+TILE-5,TILE,5);
    X.strokeStyle='rgba(0,0,0,.2)';X.lineWidth=1;X.strokeRect(sx,sy,TILE,TILE);
    // cross
    X.strokeStyle='rgba(0,0,0,.15)';X.lineWidth=2;
    X.beginPath();X.moveTo(sx+4,sy+4);X.lineTo(sx+TILE-4,sy+TILE-4);X.moveTo(sx+TILE-4,sy+4);X.lineTo(sx+4,sy+TILE-4);X.stroke();
  }else if(t===3){// bush
    X.fillStyle='rgba(30,100,30,.7)';
    for(let i=0;i<3;i++){
      let bx=sx+10+i*8+(i%2)*4,by=sy+10+i*5;
      X.beginPath();X.arc(bx,by,8,0,Math.PI*2);X.fill();
    }
    X.fillStyle='rgba(40,130,40,.6)';
    X.beginPath();X.arc(sx+TILE/2,sy+TILE/2,10,0,Math.PI*2);X.fill();
  }else if(t===4){// crate
    X.fillStyle='#b8860b';X.fillRect(sx+2,sy+2,TILE-4,TILE-4);
    X.fillStyle='#d4a030';X.fillRect(sx+2,sy+2,TILE-4,TILE-10);
    X.strokeStyle='rgba(0,0,0,.3)';X.lineWidth=2;X.strokeRect(sx+2,sy+2,TILE-4,TILE-4);
    X.strokeStyle='rgba(0,0,0,.15)';X.beginPath();X.moveTo(sx+TILE/2,sy+2);X.lineTo(sx+TILE/2,sy+TILE-2);X.moveTo(sx+2,sy+TILE/2);X.lineTo(sx+TILE-2,sy+TILE/2);X.stroke();
  }
}

function draw(){
  C.width=W;C.height=H;
  X.clearRect(0,0,W,H);

  if(gameState!=='playing'){
    X.fillStyle='#111';X.fillRect(0,0,W,H);
    return;
  }

  let cx=player.x-W/2+shakeX,cy=player.y-H/2+shakeY;

  // tiles
  let stx=Math.max(0,Math.floor(cx/TILE)),sty=Math.max(0,Math.floor(cy/TILE));
  let etx=Math.min(MAP-1,Math.ceil((cx+W)/TILE)),ety=Math.min(MAP-1,Math.ceil((cy+H)/TILE));
  for(let ty=sty;ty<=ety;ty++)for(let tx=stx;tx<=etx;tx++)drawTile(tx,ty,cx,cy);

  // cubes
  cubes.forEach(c=>{
    let sx=c.x-cx,sy=c.y-cy+Math.sin(c.timer*.05)*4;
    if(sx<-20||sy<-20||sx>W+20||sy>H+20)return;
    X.save();X.shadowColor='#e040fb';X.shadowBlur=12;
    X.fillStyle='#e040fb';
    X.beginPath();
    // diamond shape
    X.moveTo(sx,sy-8);X.lineTo(sx+7,sy);X.lineTo(sx,sy+8);X.lineTo(sx-7,sy);X.closePath();
    X.fill();
    X.fillStyle='#f8b4ff';X.beginPath();X.moveTo(sx,sy-5);X.lineTo(sx+3,sy);X.lineTo(sx,sy+2);X.lineTo(sx-3,sy);X.closePath();X.fill();
    X.restore();
  });

  // bullets
  bullets.forEach(b=>{
    let sx=b.x-cx,sy=b.y-cy;
    if(sx<-10||sy<-10||sx>W+10||sy>H+10)return;
    X.save();X.shadowColor=b.color;X.shadowBlur=10;
    let gr=X.createRadialGradient(sx,sy,0,sx,sy,b.radius+2);
    gr.addColorStop(0,'#fff');gr.addColorStop(.5,b.color);gr.addColorStop(1,'rgba(0,0,0,0)');
    X.fillStyle=gr;
    X.beginPath();X.arc(sx,sy,b.radius+2,0,Math.PI*2);X.fill();
    X.restore();
    // trail
    X.globalAlpha=.3;X.fillStyle=b.color;
    X.beginPath();X.arc(sx-b.vx,sy-b.vy,b.radius,0,Math.PI*2);X.fill();
    X.beginPath();X.arc(sx-b.vx*2,sy-b.vy*2,b.radius*.7,0,Math.PI*2);X.fill();
    X.globalAlpha=1;
  });

  // brawlers
  bots.forEach(b=>drawBrawler(b,cx,cy));
  drawBrawler(player,cx,cy);

  // particles
  particles.forEach(p=>{
    let sx=p.x-cx,sy=p.y-cy;
    X.globalAlpha=p.life/30;X.fillStyle=p.color;
    X.beginPath();X.arc(sx,sy,p.radius,0,Math.PI*2);X.fill();
  });
  X.globalAlpha=1;

  // Storm overlay
  let scx=MAPW/2-cx,scy=MAPH/2-cy;
  X.save();
  X.beginPath();X.rect(0,0,W,H);
  X.arc(scx,scy,stormRadius,0,Math.PI*2,true);
  X.fillStyle='rgba(100,20,140,.35)';X.fill();
  // edge glow
  X.strokeStyle='rgba(160,40,200,.5)';X.lineWidth=8;
  X.beginPath();X.arc(scx,scy,stormRadius,0,Math.PI*2);X.stroke();
  X.restore();

  // Joysticks
  if(moveJoy.active){
    X.globalAlpha=.25;X.fillStyle='#fff';
    X.beginPath();X.arc(moveJoy.sx,moveJoy.sy,50,0,Math.PI*2);X.fill();
    X.globalAlpha=.45;
    X.beginPath();X.arc(moveJoy.sx+moveJoy.dx*40,moveJoy.sy+moveJoy.dy*40,20,0,Math.PI*2);X.fill();
    X.globalAlpha=1;
  }
  if(aimJoy.active){
    X.globalAlpha=.25;X.fillStyle='#f44';
    X.beginPath();X.arc(aimJoy.sx,aimJoy.sy,50,0,Math.PI*2);X.fill();
    let ad=Math.hypot(aimJoy.dx,aimJoy.dy),adx=ad>1?aimJoy.dx/ad*40:0,ady=ad>1?aimJoy.dy/ad*40:0;
    X.globalAlpha=.45;
    X.beginPath();X.arc(aimJoy.sx+adx,aimJoy.sy+ady,20,0,Math.PI*2);X.fill();
    X.globalAlpha=1;
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

  px.fillStyle=gr;px.strokeStyle='rgba(0,0,0,.4)';px.lineWidth=3;
  px.beginPath();px.arc(60,58,26,0,Math.PI*2);px.fill();px.stroke();
  // eyes
  px.fillStyle='#fff';px.beginPath();px.ellipse(52,52,7,9,0,0,Math.PI*2);px.fill();

  px.beginPath();px.arc(70,53,3.5,0,Math.PI*2);px.fill();
  px.fillStyle='#fff';px.beginPath();px.arc(52,50,1.5,0,Math.PI*2);px.fill();

})();

document.getElementById('startBtn').addEventListener('click',()=>{if(actx.state==='suspended')actx.resume();initGame();});
document.getElementById('retryBtn').addEventListener('click',()=>{initGame();});

loop();
