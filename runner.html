<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Brawl Stars - Showdown</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',Arial,sans-serif;touch-action:none;user-select:none}
canvas{display:block;position:absolute;top:0;left:0;width:100%;height:100%}
#homeScreen{position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;display:flex;flex-direction:column;background:linear-gradient(135deg,#ff8c00,#ff6000,#e54500);overflow:hidden}
#homeScreen .pattern{position:absolute;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 10px,transparent 10px,transparent 20px);pointer-events:none}
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(0,0,0,.3);z-index:1}
.top-bar .name{color:#fff;font-weight:bold;font-size:18px}
.top-bar .stats{display:flex;gap:14px}
.top-bar .stat{display:flex;align-items:center;gap:4px;color:#fff;font-weight:bold;font-size:14px}
.top-bar .stat svg{width:20px;height:20px}
.home-center{flex:1;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.home-char{width:180px;height:220px;position:relative}
#homeCharCanvas{width:180px;height:220px}
.sidebar{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px;z-index:2}
.sidebar button{width:56px;height:56px;border-radius:14px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.5);color:#fff;font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.sidebar button svg{width:22px;height:22px;fill:#fff}
.bottom-bar{display:flex;flex-direction:column;align-items:center;padding:16px;z-index:1}
.mode-label{color:#fff;font-size:13px;opacity:.8;margin-bottom:6px;text-transform:uppercase;letter-spacing:2px}
.mode-name{color:#fff;font-size:28px;font-weight:900;text-shadow:2px 2px 4px rgba(0,0,0,.4);margin-bottom:12px}
#playBtn{width:240px;height:60px;border:none;border-radius:30px;background:linear-gradient(180deg,#ffe234,#f5c800);color:#000;font-size:24px;font-weight:900;cursor:pointer;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 4px 0 #c9a000,0 6px 12px rgba(0,0,0,.3);transition:transform .1s}
#playBtn:active{transform:scale(.96)}
.slideflow-link{position:absolute;top:10px;left:10px;color:#fff;text-decoration:none;font-size:14px;font-weight:bold;z-index:200;background:rgba(0,0,0,.4);padding:6px 12px;border-radius:8px}
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;display:none}
#hudTop{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.6);padding:6px 14px;border-radius:20px}
#hpBar{width:120px;height:14px;background:#333;border-radius:7px;overflow:hidden;position:relative}
#hpFill{width:100%;height:100%;border-radius:7px;transition:width .2s}
#hpText{position:absolute;width:100%;text-align:center;color:#fff;font-size:10px;font-weight:bold;line-height:14px;text-shadow:0 1px 2px #000}
.ammo-dots{display:flex;gap:3px}
.ammo-dot{width:10px;height:16px;background:#ffcc00;border-radius:3px;transition:background .15s}
.ammo-dot.empty{background:#555}
#superPct{color:#fff;font-size:12px;font-weight:bold}
#aliveCount{color:#fff;font-size:13px;font-weight:bold}
#timer{color:#fff;font-size:13px;font-weight:bold}
#killFeed{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:4px;max-width:200px}
.kill-msg{color:#fff;font-size:11px;background:rgba(0,0,0,.6);padding:3px 8px;border-radius:6px;animation:fadeKill 3s forwards;white-space:nowrap}
@keyframes fadeKill{0%{opacity:1;transform:translateX(20px)}10%{opacity:1;transform:translateX(0)}80%{opacity:1}100%{opacity:0}}
#minimap{position:absolute;bottom:10px;right:10px;width:90px;height:90px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.3);border-radius:6px;overflow:hidden}
#minimapCanvas{width:90px;height:90px}
#superBtn{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);width:60px;height:60px;border-radius:50%;border:3px solid #ffcc00;background:rgba(255,200,0,.3);color:#fff;font-size:11px;font-weight:bold;display:none;pointer-events:auto;animation:pulseBorder 1s infinite}
@keyframes pulseBorder{0%,100%{border-color:#ffcc00;box-shadow:0 0 10px rgba(255,200,0,.4)}50%{border-color:#fff;box-shadow:0 0 20px rgba(255,200,0,.8)}}
.joystick{position:absolute;width:120px;height:120px;border-radius:50%;pointer-events:none;display:none;z-index:11}
.joystick-base{width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.25);position:absolute}
.joystick-thumb{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.4);position:absolute;top:35px;left:35px}
#aimLine{position:absolute;pointer-events:none;z-index:9;display:none}
#endScreen{position:absolute;top:0;left:0;width:100%;height:100%;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center}
#endScreen.win{background:rgba(0,0,0,.7)}
#endScreen.lose{background:rgba(0,0,0,.85)}
#endTitle{font-size:48px;font-weight:900;margin-bottom:20px;text-shadow:0 3px 6px rgba(0,0,0,.5)}
#endStats{color:#fff;font-size:16px;line-height:2;text-align:center;margin-bottom:20px}
#retryBtn{padding:12px 40px;border:none;border-radius:25px;background:linear-gradient(180deg,#ffe234,#f5c800);color:#000;font-size:20px;font-weight:bold;cursor:pointer;box-shadow:0 3px 0 #c9a000}
#retryBtn:active{transform:scale(.96)}
.dmg-number{position:absolute;color:#fff;font-size:16px;font-weight:900;text-shadow:0 1px 3px #000;pointer-events:none;animation:dmgFloat .8s forwards;z-index:15}
@keyframes dmgFloat{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-40px) scale(.7)}}
#confettiCanvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:99}
</style>
</head>

<button><svg viewBox="0 0 24 24"><path d="M20 4H4v13h16V4zM4 19h16v2H4v-2z"/></svg><span>News</span></button>

<script>
'use strict';
// ============== CONSTANTS ==============
const TILE=48,COLS=28,ROWS=28,MAP_W=COLS*TILE,MAP_H=ROWS*TILE;
const COLORS={player:0x44cc44,bots:[0xcc3333,0x3366cc,0xdd8800,0x9933cc,0x00aaaa,0xcccc00,0xcc44aa]};
const BOT_NAMES=['Scarlett','Azure','Blaze','Phantom','Frost','Solar','Rosie'];
const ACCESSORY=['hat','bandana','crown','hat','bandana','crown','hat'];
const PERSONALITY=['aggressive','balanced','camper','aggressive','balanced','camper','aggressive'];

// ============== AUDIO ==============
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function playSound(freq,dur,type='square',vol=.12){
  try{const g=audioCtx.createGain(),o=audioCtx.createOscillator();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}
}
function sndShoot(){playSound(800,.08,'square',.08)}
function sndHit(){playSound(300,.1,'sawtooth',.1)}
function sndKill(){playSound(500,.15,'square',.12);setTimeout(()=>playSound(700,.15,'square',.1),100)}
function sndSuperCharge(){playSound(600,.2,'sine',.1);setTimeout(()=>playSound(900,.2,'sine',.1),150)}
function sndSuperUse(){playSound(400,.3,'sawtooth',.15);setTimeout(()=>playSound(600,.2,'sawtooth',.12),100)}
function sndCube(){playSound(500,.1,'sine',.1);setTimeout(()=>playSound(800,.15,'sine',.1),80)}
function sndHeartbeat(){playSound(60,.15,'sine',.15)}
function sndWin(){[0,100,200,300,400].forEach((d,i)=>setTimeout(()=>playSound(400+i*100,.2,'square',.1),d))}
function sndLose(){playSound(300,.4,'sawtooth',.12);setTimeout(()=>playSound(200,.5,'sawtooth',.1),200)}

// ============== MAP GENERATION ==============
// 0=grass,1=wall,2=destructible,3=bush,4=crate,5=water
let map=[];
function generateMap(){
  map=Array.from({length:ROWS},()=>Array(COLS).fill(0));
  // border
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(r<2||r>=ROWS-2||c<2||c>=COLS-2)map[r][c]=1;
  }
  // inner features
  for(let r=3;r<ROWS-3;r++)for(let c=3;c<COLS-3;c++){
    let rn=Math.random();
    if(rn<.06)map[r][c]=1;
    else if(rn<.12)map[r][c]=2;
    else if(rn<.20)map[r][c]=3;
    else if(rn<.23)map[r][c]=4;
    else if(rn<.25)map[r][c]=5;
  }
  // clear spawn areas (corners + edges)
  const spawns=[[3,3],[3,COLS-5],[ROWS-5,3],[ROWS-5,COLS-5],[3,13],[ROWS-5,13],[13,3],[13,COLS-5]];
  spawns.forEach(([r,c])=>{for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){let rr=r+dr,cc=c+dc;if(rr>=2&&rr<ROWS-2&&cc>=2&&cc<COLS-2)map[rr][cc]=0;}});
  return spawns;
}

// ============== PIXI SETUP ==============
let app,gameContainer,mapContainer,entityContainer,effectContainer,stormGfx;
let screenW=window.innerWidth,screenH=window.innerHeight;

function initPixi(){
  app=new PIXI.Application({width:screenW,height:screenH,backgroundColor:0x1a1a2e,antialias:true,resolution:window.devicePixelRatio||1,autoDensity:true});
  document.body.insertBefore(app.view,document.body.firstChild);
  gameContainer=new PIXI.Container();
  mapContainer=new PIXI.Container();
  entityContainer=new PIXI.Container();
  effectContainer=new PIXI.Container();
  stormGfx=new PIXI.Graphics();
  gameContainer.addChild(mapContainer,entityContainer,effectContainer,stormGfx);
  app.stage.addChild(gameContainer);
}

// ============== DRAW MAP TILES ==============
function drawMap(){
  mapContainer.removeChildren();
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const x=c*TILE,y=r*TILE,t=map[r][c];
    const g=new PIXI.Graphics();
    if(t===0){
      // grass checker
      const dark=(r+c)%2===0;
      g.beginFill(dark?0x4a8c3f:0x55a044);g.drawRect(x,y,TILE,TILE);g.endFill();
      // texture dots
      for(let i=0;i<3;i++){g.beginFill(0x3d7a34,.3);g.drawCircle(x+Math.random()*TILE,y+Math.random()*TILE,1.5);g.endFill()}
    } else if(t===1){
      // stone wall beveled
      g.beginFill(0x555555);g.drawRect(x,y,TILE,TILE);g.endFill();
      g.beginFill(0x777777);g.drawRect(x,y,TILE,4);g.endFill();
      g.beginFill(0x777777);g.drawRect(x,y,4,TILE);g.endFill();
      g.beginFill(0x333333);g.drawRect(x,y+TILE-4,TILE,4);g.endFill();
      g.beginFill(0x333333);g.drawRect(x+TILE-4,y,4,TILE);g.endFill();
    } else if(t===2){
      // destructible wood
      g.beginFill(0x8B6914);g.drawRect(x+1,y+1,TILE-2,TILE-2);g.endFill();
      for(let i=0;i<4;i++){g.beginFill(0x6B4F10,.4);g.drawRect(x+2,y+3+i*12,TILE-4,2);g.endFill()}
    } else if(t===3){
      // bush - grass underneath
      const dark=(r+c)%2===0;
      g.beginFill(dark?0x4a8c3f:0x55a044);g.drawRect(x,y,TILE,TILE);g.endFill();
      // bush circles
      for(let i=0;i<5;i++){g.beginFill(0x2d6b1e,.7);g.drawCircle(x+10+Math.random()*28,y+10+Math.random()*28,8+Math.random()*6);g.endFill()}
    } else if(t===4){
      // crate on grass
      const dark=(r+c)%2===0;
      g.beginFill(dark?0x4a8c3f:0x55a044);g.drawRect(x,y,TILE,TILE);g.endFill();
      g.beginFill(0xC49A2A);g.drawRoundedRect(x+6,y+6,36,36,4);g.endFill();
      g.lineStyle(2,0x8B6914);g.moveTo(x+6,y+6);g.lineTo(x+42,y+42);g.moveTo(x+42,y+6);g.lineTo(x+6,y+42);g.lineStyle(0);
    } else if(t===5){
      // water
      g.beginFill(0x2288cc);g.drawRect(x,y,TILE,TILE);g.endFill();
      g.beginFill(0x44aaee,.3);g.drawEllipse(x+24,y+24,18,10);g.endFill();
    }
    mapContainer.addChild(g);
  }
}

// ============== ENTITY ==============
class Entity {
  constructor(x,y,color,name,isPlayer=false,personality='balanced',accessory='hat'){
    this.x=x;this.y=y;this.color=color;this.name=name;this.isPlayer=isPlayer;
    this.hp=3600;this.maxHp=3600;this.ammo=3;this.maxAmmo=3;this.ammoTimer=0;
    this.superCharge=0;this.alive=true;this.speed=2.8;this.cubes=0;
    this.aimAngle=0;this.moveAngle=0;this.moving=false;
    this.personality=personality;this.accessory=accessory;
    this.animT=0;this.inBush=false;this.kills=0;this.damageDealt=0;
    this.aiTimer=0;this.aiTarget=null;this.aiState='roam';
    this.container=new PIXI.Container();
    this.container.x=x;this.container.y=y;
    this.buildGraphics();
    entityContainer.addChild(this.container);
  }
  buildGraphics(){
    this.gfx=new PIXI.Graphics();
    this.container.addChild(this.gfx);
    this.redraw();
  }
  redraw(){
    const g=this.gfx;g.clear();
    const bob=this.moving?Math.sin(this.animT*8)*2:0;
    const armSwing=this.moving?Math.sin(this.animT*8)*.3:0;
    const c=this.color;
    const darkerC=darken(c,.3);
    // shadow
    g.beginFill(0x000000,.25);g.drawEllipse(0,20,16,6);g.endFill();
    // body
    g.beginFill(c);g.drawRoundedRect(-12,-4+bob,24,20,6);g.endFill();
    g.beginFill(darkerC,.4);g.drawRoundedRect(-12,6+bob,24,10,4);g.endFill();
    // arms
    const ax=Math.cos(this.aimAngle),ay=Math.sin(this.aimAngle);
    // left arm
    g.beginFill(c);
    const la=-armSwing;
    g.drawRoundedRect(-18,-2+bob+Math.sin(la)*4,8,14,4);g.endFill();
    // right arm + weapon
    g.beginFill(c);
    g.drawRoundedRect(10,-2+bob+Math.sin(-la)*4,8,14,4);g.endFill();
    // weapon on right
    g.beginFill(0x444444);g.drawRect(14,2+bob,10,5);g.endFill();
    // head
    g.beginFill(c);g.drawCircle(0,-12+bob,14);g.endFill();
    g.beginFill(darkerC,.3);g.drawCircle(0,-6+bob,12);g.endFill();
    // eyes
    g.beginFill(0xffffff);g.drawEllipse(-5,-14+bob,5,6);g.drawEllipse(5,-14+bob,5,6);g.endFill();
    // iris
    const ic=this.isPlayer?0x33aa33:darkerC;
    g.beginFill(ic);g.drawCircle(-4+ax*2,-14+bob+ay,3);g.drawCircle(6+ax*2,-14+bob+ay,3);g.endFill();
    // pupil
    g.beginFill(0x000000);g.drawCircle(-4+ax*2,-14+bob+ay,1.5);g.drawCircle(6+ax*2,-14+bob+ay,1.5);g.endFill();
    // shine
    g.beginFill(0xffffff);g.drawCircle(-5,-16+bob,1.5);g.drawCircle(5,-16+bob,1.5);g.endFill();
    // mouth
    g.lineStyle(1.5,darkerC);g.arc(0,-9+bob,4,0.2,Math.PI-0.2);g.lineStyle(0);
    // accessory
    if(this.accessory==='hat'){
      g.beginFill(darken(c,.5));g.drawRoundedRect(-10,-28+bob,20,6,3);g.drawRoundedRect(-7,-34+bob,14,8,3);g.endFill();
    } else if(this.accessory==='bandana'){
      g.beginFill(0xcc0000);g.drawRoundedRect(-12,-22+bob,24,5,2);g.endFill();
      g.beginFill(0xcc0000);g.moveTo(12,-22+bob);g.lineTo(18,-18+bob);g.lineTo(12,-17+bob);g.endFill();
    } else if(this.accessory==='crown'){
      g.beginFill(0xffd700);g.moveTo(-8,-26+bob);g.lineTo(-6,-32+bob);g.lineTo(-2,-28+bob);g.lineTo(0,-34+bob);g.lineTo(2,-28+bob);g.lineTo(6,-32+bob);g.lineTo(8,-26+bob);g.closePath();g.endFill();
    }
    // alpha if in bush
    this.container.alpha=this.inBush&&this.isPlayer?.4:1;
  }
  update(dt){
    if(!this.alive)return;
    this.animT+=dt;
    // ammo regen
    if(this.ammo<this.maxAmmo){this.ammoTimer+=dt;if(this.ammoTimer>=1.2){this.ammoTimer=0;this.ammo++}}
    // check bush
    const tr=Math.floor(this.y/TILE),tc=Math.floor(this.x/TILE);
    this.inBush=(tr>=0&&tr<ROWS&&tc>=0&&tc<COLS&&map[tr][tc]===3);
    this.container.x=this.x;this.container.y=this.y;
    this.redraw();
  }
  takeDamage(dmg,attacker){
    if(!this.alive)return;
    this.hp-=dmg;
    spawnDmgNumber(this.x,this.y-30,dmg);
    spawnHitParticles(this.x,this.y,this.color);
    sndHit();
    shakeScreen(3);
    if(attacker)attacker.superCharge=Math.min(100,attacker.superCharge+8);
    if(attacker)attacker.damageDealt+=dmg;
    if(this.hp<=0){this.hp=0;this.die(attacker)}
  }
  die(killer){
    this.alive=false;
    this.container.visible=false;
    if(killer&&killer.alive){killer.kills++;killer.superCharge=Math.min(100,killer.superCharge+20)}
    // drop cubes
    for(let i=0;i<this.cubes;i++){powerCubes.push({x:this.x+(Math.random()-0.5)*40,y:this.y+(Math.random()-0.5)*40,rot:0})}
    spawnDeathEffect(this.x,this.y,this.color);
    sndKill();shakeScreen(6);
    addKillMsg(killer?killer.name:'Storm',this.name);
    aliveCount--;
    if(this.isPlayer)endGame(false);
    else if(aliveCount<=1&&player.alive)endGame(true);
  }
  shoot(){
    if(this.ammo<=0||!this.alive)return;
    this.ammo--;this.ammoTimer=0;
    const bx=this.x+Math.cos(this.aimAngle)*20;
    const by=this.y+Math.sin(this.aimAngle)*20;
    const dmg=400+this.cubes*50;
    bullets.push({x:bx,y:by,vx:Math.cos(this.aimAngle)*8,vy:Math.sin(this.aimAngle)*8,owner:this,dmg,trail:[],isSuper:false,life:60});
    spawnMuzzleFlash(bx,by);
    sndShoot();
  }
  shootSuper(){
    if(this.superCharge<100||!this.alive)return;
    this.superCharge=0;
    sndSuperUse();
    for(let i=-2;i<=2;i++){
      const a=this.aimAngle+i*.15;
      const bx=this.x+Math.cos(a)*20;
      const by=this.y+Math.sin(a)*20;
      const dmg=500+this.cubes*60;
      bullets.push({x:bx,y:by,vx:Math.cos(a)*9,vy:Math.sin(a)*9,owner:this,dmg,trail:[],isSuper:true,life:80});
    }
    spawnMuzzleFlash(this.x+Math.cos(this.aimAngle)*20,this.y+Math.sin(this.aimAngle)*20);
  }
  moveToward(angle,dt){
    const s=this.speed*(1+this.cubes*0.03);
    let nx=this.x+Math.cos(angle)*s;
    let ny=this.y+Math.sin(angle)*s;
    // collision
    if(!isWalkable(nx,this.y))nx=this.x;
    if(!isWalkable(this.x,ny))ny=this.y;
    if(isWalkable(nx,ny)){this.x=nx;this.y=ny}
    this.moving=true;this.moveAngle=angle;
  }
}

function darken(color,amt){
  let r=(color>>16)&0xff,g=(color>>8)&0xff,b=color&0xff;
  r=Math.floor(r*(1-amt));g=Math.floor(g*(1-amt));b=Math.floor(b*(1-amt));
  return(r<<16)|(g<<8)|b;
}

function isWalkable(x,y){
  const r=Math.floor(y/TILE),c=Math.floor(x/TILE);
  if(r<0||r>=ROWS||c<0||c>=COLS)return false;
  const t=map[r][c];
  return t!==1&&t!==2&&t!==4;
}
function isSolid(r,c){
  if(r<0||r>=ROWS||c<0||c>=COLS)return true;
  return map[r][c]===1||map[r][c]===2;
}

// ============== BULLETS ==============
let bullets=[];

function updateBullets(dt){
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.trail.push({x:b.x,y:b.y});
    if(b.trail.length>4)b.trail.shift();
    b.x+=b.vx;b.y+=b.vy;b.life--;
    // wall collision
    const tr=Math.floor(b.y/TILE),tc=Math.floor(b.x/TILE);
    if(tr<0||tr>=ROWS||tc<0||tc>=COLS||map[tr][tc]===1){bullets.splice(i,1);continue}
    if(map[tr][tc]===2){map[tr][tc]=0;drawMap();bullets.splice(i,1);continue}
    if(map[tr][tc]===4){map[tr][tc]=0;drawMap();powerCubes.push({x:tc*TILE+24,y:tr*TILE+24,rot:0});bullets.splice(i,1);continue}
    if(b.life<=0){bullets.splice(i,1);continue}
    // hit entities
    for(const e of entities){
      if(e===b.owner||!e.alive)continue;
      const dx=e.x-b.x,dy=e.y-b.y;
      if(dx*dx+dy*dy<400){e.takeDamage(b.dmg,b.owner);bullets.splice(i,1);break}
    }
  }
}

// ============== POWER CUBES ==============
let powerCubes=[];

function updateCubes(dt){
  for(let i=powerCubes.length-1;i>=0;i--){
    const c=powerCubes[i];c.rot+=dt*2;
    for(const e of entities){
      if(!e.alive)continue;
      const dx=e.x-c.x,dy=e.y-c.y;
      if(dx*dx+dy*dy<600){
        e.cubes++;e.maxHp+=200;e.hp=Math.min(e.hp+200,e.maxHp);
        spawnCubeCollectEffect(c.x,c.y);sndCube();
        powerCubes.splice(i,1);break;
      }
    }
  }
}

// ============== STORM ==============
let stormRadius=MAP_W*.7,stormTarget=50,stormSpeed,gameTime=0,gameDuration=120;
let stormDmgTimer=0;

function updateStorm(dt){
  gameTime+=dt;
  const progress=Math.min(gameTime/gameDuration,1);
  stormRadius=MAP_W*.7*(1-progress)+stormTarget*progress;
  // damage
  stormDmgTimer+=dt;
  if(stormDmgTimer>=0.5){
    stormDmgTimer=0;
    const cx=MAP_W/2,cy=MAP_H/2;
    for(const e of entities){
      if(!e.alive)continue;
      const dx=e.x-cx,dy=e.y-cy;
      if(Math.sqrt(dx*dx+dy*dy)>stormRadius){
        e.takeDamage(100+(progress*200|0),null);
      }
    }
  }
}

function drawStorm(){
  stormGfx.clear();
  const cx=MAP_W/2,cy=MAP_H/2;
  const pulse=Math.sin(performance.now()*.003)*.1+.4;
  // large rect minus circle
  stormGfx.beginFill(0x7722aa,pulse);
  stormGfx.drawRect(-500,-500,MAP_W+1000,MAP_H+1000);
  stormGfx.beginHole();
  stormGfx.drawCircle(cx,cy,stormRadius);
  stormGfx.endHole();
  stormGfx.endFill();
  // glow ring
  stormGfx.lineStyle(3,0xcc44ff,.6);
  stormGfx.drawCircle(cx,cy,stormRadius);
  stormGfx.lineStyle(0);
}

// ============== RENDER ==============
let particleGfx;

function renderEffects(){
  if(!particleGfx){particleGfx=new PIXI.Graphics();effectContainer.addChild(particleGfx)}
  particleGfx.clear();
  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.life--;
    if(p.life<=0){particles.splice(i,1);continue}
    const alpha=p.life/p.maxLife;
    particleGfx.beginFill(p.color,alpha);
    particleGfx.drawCircle(p.x,p.y,p.size*alpha);
    particleGfx.endFill();
  }
  // bullets
  for(const b of bullets){
    const col=b.isSuper?0xffaa00:0xffff44;
    const sz=b.isSuper?6:4;
    // trail
    for(let j=0;j<b.trail.length;j++){
      const t=b.trail[j];
      const a=(j+1)/b.trail.length*.5;
      particleGfx.beginFill(col,a);
      particleGfx.drawCircle(t.x,t.y,sz*(j+1)/b.trail.length);
      particleGfx.endFill();
    }
    // main
    particleGfx.beginFill(0xffffff,.9);particleGfx.drawCircle(b.x,b.y,sz);particleGfx.endFill();
    particleGfx.beginFill(col,.6);particleGfx.drawCircle(b.x,b.y,sz+2);particleGfx.endFill();
  }
  // power cubes
  for(const c of powerCubes){
    particleGfx.beginFill(0xaa44ff,.3);particleGfx.drawCircle(c.x,c.y,14);particleGfx.endFill();
    // diamond shape rotated
    const s=8,a=c.rot;
    particleGfx.beginFill(0xcc66ff);
    particleGfx.moveTo(c.x+Math.cos(a)*s,c.y+Math.sin(a)*s);
    particleGfx.lineTo(c.x+Math.cos(a+Math.PI/2)*s*.6,c.y+Math.sin(a+Math.PI/2)*s*.6);
    particleGfx.lineTo(c.x+Math.cos(a+Math.PI)*s,c.y+Math.sin(a+Math.PI)*s);
    particleGfx.lineTo(c.x+Math.cos(a-Math.PI/2)*s*.6,c.y+Math.sin(a-Math.PI/2)*s*.6);
    particleGfx.closePath();particleGfx.endFill();
  }
}

// ============== AI ==============
function updateAI(bot,dt){
  if(!bot.alive)return;
  bot.aiTimer-=dt;
  if(bot.aiTimer>0)return;
  bot.aiTimer=0.2+Math.random()*0.3;

  // find nearest enemy
  let nearest=null,nd=Infinity;
  for(const e of entities){
    if(e===bot||!e.alive)continue;
    const d=Math.hypot(e.x-bot.x,e.y-bot.y);
    if(d<nd){nd=d;nearest=e}
  }
  // find nearest cube
  let nearCube=null,ncd=Infinity;
  for(const c of powerCubes){
    const d=Math.hypot(c.x-bot.x,c.y-bot.y);
    if(d<ncd){ncd=d;nearCube=c}
  }

  const personality=bot.personality;
  const lowHp=bot.hp<bot.maxHp*.3;
  const stormDist=Math.hypot(bot.x-MAP_W/2,bot.y-MAP_H/2);

  // move toward storm center if outside
  if(stormDist>stormRadius-60){
    bot.moveAngle=Math.atan2(MAP_H/2-bot.y,MAP_W/2-bot.x);
    bot.moveToward(bot.moveAngle,dt);
    return;
  }

  // collect nearby cubes
  if(nearCube&&ncd<200){
    bot.moveAngle=Math.atan2(nearCube.y-bot.y,nearCube.x-bot.x);
    bot.moveToward(bot.moveAngle,dt);
  }

  if(!nearest)return;
  const angleToEnemy=Math.atan2(nearest.y-bot.y,nearest.x-bot.x);
  bot.aimAngle=angleToEnemy;

  if(personality==='aggressive'){
    if(nd>200)bot.moveToward(angleToEnemy,dt);
    else if(lowHp)bot.moveToward(angleToEnemy+Math.PI,dt);
    else bot.moveToward(angleToEnemy+Math.sin(bot.animT*3)*.5,dt);
    if(nd<350&&bot.ammo>0)bot.shoot();
  } else if(personality==='camper'){
    if(nd<150)bot.moveToward(angleToEnemy+Math.PI,dt);
    else if(nd>400&&!bot.inBush){
      // find bush
      let bushAngle=Math.random()*Math.PI*2;
      bot.moveToward(bushAngle,dt);
    }
    if(nd<300&&bot.ammo>0)bot.shoot();
  } else {
    if(nd>250)bot.moveToward(angleToEnemy,dt);
    else if(nd<120)bot.moveToward(angleToEnemy+Math.PI,dt);
    else if(lowHp)bot.moveToward(angleToEnemy+Math.PI+Math.random()-.5,dt);
    if(nd<320&&bot.ammo>0)bot.shoot();
  }

  // dodge bullets
  for(const b of bullets){
    if(b.owner===bot)continue;
    const dx=bot.x-b.x,dy=bot.y-b.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<80){
      const dodge=Math.atan2(dy,dx)+((Math.random()>.5)?Math.PI/2:-Math.PI/2);
      bot.moveToward(dodge,dt);
      break;
    }
  }

  // use super
  if(bot.superCharge>=100&&nearest&&nd<300){bot.shootSuper()}
}

let keys={},mouseDown=false,mouseX=0,mouseY=0;
let moveTouchId=null,aimTouchId=null;
let moveJoyStart=null,aimJoyStart=null;
let moveVec={x:0,y:0},aimActive=false;

document.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key===' '||e.key==='q')useSuper()});
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.addEventListener('mousedown',e=>{mouseDown=true;mouseX=e.clientX;mouseY=e.clientY;audioCtx.resume()});
document.addEventListener('mouseup',()=>mouseDown=false);

// touch
document.addEventListener('touchstart',e=>{
  audioCtx.resume();
  for(const t of e.changedTouches){
    if(t.clientX<screenW/2&&moveTouchId===null){
      moveTouchId=t.identifier;
      moveJoyStart={x:t.clientX,y:t.clientY};
      const j=document.getElementById('moveJoy');
      j.style.left=(t.clientX-60)+'px';j.style.top=(t.clientY-60)+'px';j.style.display='block';
    } else if(t.clientX>=screenW/2&&aimTouchId===null){
      aimTouchId=t.identifier;
      aimJoyStart={x:t.clientX,y:t.clientY};
      aimActive=true;
      const j=document.getElementById('aimJoy');
      j.style.left=(t.clientX-60)+'px';j.style.top=(t.clientY-60)+'px';j.style.display='block';
    }
  }
},{passive:false});
document.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===moveTouchId&&moveJoyStart){
      const dx=t.clientX-moveJoyStart.x,dy=t.clientY-moveJoyStart.y;
      const d=Math.min(Math.sqrt(dx*dx+dy*dy),50);
      const a=Math.atan2(dy,dx);
      moveVec.x=Math.cos(a)*(d/50);moveVec.y=Math.sin(a)*(d/50);
      const thumb=document.getElementById('moveThumb');
      thumb.style.left=(35+Math.cos(a)*d)+'px';thumb.style.top=(35+Math.sin(a)*d)+'px';
    }
    if(t.identifier===aimTouchId&&aimJoyStart){
      const dx=t.clientX-aimJoyStart.x,dy=t.clientY-aimJoyStart.y;
      const d=Math.min(Math.sqrt(dx*dx+dy*dy),50);
      const a=Math.atan2(dy,dx);
      if(player)player.aimAngle=a;
      const thumb=document.getElementById('aimThumb');
      thumb.style.left=(35+Math.cos(a)*d)+'px';thumb.style.top=(35+Math.sin(a)*d)+'px';
    }
  }
},{passive:false});
document.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===moveTouchId){
      moveTouchId=null;moveJoyStart=null;moveVec.x=0;moveVec.y=0;
      document.getElementById('moveJoy').style.display='none';
      document.getElementById('moveThumb').style.left='35px';document.getElementById('moveThumb').style.top='35px';
    }
    if(t.identifier===aimTouchId){
      aimTouchId=null;aimJoyStart=null;aimActive=false;
      document.getElementById('aimJoy').style.display='none';
      document.getElementById('aimThumb').style.left='35px';document.getElementById('aimThumb').style.top='35px';
      // fire on release
      if(player&&player.alive&&player.ammo>0)player.shoot();
    }
  }
});

// ============== GAME STATE ==============
let player,entities=[],aliveCount=8,running=false;

function startGame(){
  document.getElementById('homeScreen').style.display='none';
  document.getElementById('hud').style.display='block';
  if(!app)initPixi();
  const spawns=generateMap();
  drawMap();
  entities=[];bullets=[];particles=[];powerCubes=[];
  gameTime=0;aliveCount=8;shakeMag=0;

  player=new Entity(spawns[0][1]*TILE+24,spawns[0][0]*TILE+24,COLORS.player,'You',true,'balanced','hat');
  entities.push(player);
  for(let i=0;i<7;i++){
    const sp=spawns[i+1];
    const bot=new Entity(sp[1]*TILE+24,sp[0]*TILE+24,COLORS.bots[i],BOT_NAMES[i],false,PERSONALITY[i],ACCESSORY[i]);
    entities.push(bot);
  }
  running=true;
  document.body.style.cursor='crosshair';
  app.ticker.add(gameLoop);
}

let lastAutoFire=0;
function gameLoop(delta){
  if(!running)return;
  const dt=delta/60;

  // player input
  if(player&&player.alive){
    let mx=0,my=0;
    if(keys['w'])my=-1;if(keys['s'])my=1;if(keys['a'])mx=-1;if(keys['d'])mx=1;
    // mobile
    if(moveVec.x||moveVec.y){mx=moveVec.x;my=moveVec.y}
    if(mx||my){
      const a=Math.atan2(my,mx);
      player.moveToward(a,dt);
    } else {player.moving=false}
    // aim (desktop)
    if(!aimActive&&app){
      const wx=mouseX-camX-shakeX;
      const wy=mouseY-camY-shakeY;
      player.aimAngle=Math.atan2(wy-player.y,wx-player.x);
    }
    // auto fire (desktop)
    if(mouseDown&&!aimActive){
      lastAutoFire+=dt;
      if(lastAutoFire>=0.25){lastAutoFire=0;if(player.ammo>0)player.shoot()}
    }
  }

  // AI
  for(let i=1;i<entities.length;i++)updateAI(entities[i],dt);

  // update
  for(const e of entities)e.update(dt);
  updateBullets(dt);
  updateCubes(dt);
  updateStorm(dt);
  drawStorm();
  renderEffects();
  updateCamera();
  updateHUD();
  drawMinimap();
  updateDmgPositions();

  // check game over
  if(aliveCount<=1&&running){
    if(player.alive)endGame(true);
  }
}

function endGame(win){
  running=false;
  const es=document.getElementById('endScreen');
  es.style.display='flex';
  es.className=win?'win':'lose';
  document.getElementById('endTitle').textContent=win?'VICTORY!':'DEFEATED';
  document.getElementById('endTitle').style.color=win?'#ffd700':'#ff4444';
  const time=Math.floor(gameTime);
  document.getElementById('endStats').innerHTML=`Kills: ${player.kills}<br>Damage: ${player.damageDealt}<br>Cubes: ${player.cubes}<br>Time: ${Math.floor(time/60)}:${('0'+time%60).slice(-2)}`;
  if(win){sndWin();spawnConfetti()}else sndLose();
}

function spawnConfetti(){
  const c=document.getElementById('confettiCanvas');
  c.width=screenW;c.height=screenH;
  const ctx=c.getContext('2d');
  const pieces=[];
  for(let i=0;i<100;i++)pieces.push({x:Math.random()*screenW,y:-20-Math.random()*200,vx:(Math.random()-.5)*4,vy:2+Math.random()*3,color:`hsl(${Math.random()*360},80%,60%)`,rot:Math.random()*6,w:8+Math.random()*6,h:4+Math.random()*3});
  let f=0;
  function draw(){
    if(f++>180)return;
    ctx.clearRect(0,0,screenW,screenH);
    for(const p of pieces){
      p.x+=p.vx;p.y+=p.vy;p.rot+=.1;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      ctx.fillStyle=p.color;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    }
    requestAnimationFrame(draw);
  }
  draw();
}

  let t=0;
  function frame(){
    t+=.03;
    ctx.clearRect(0,0,180,220);
    const bob=Math.sin(t*2)*4;
    const cx=90,cy=130+bob;
    // shadow
    ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(cx,190,30,10,0,0,Math.PI*2);ctx.fill();
    // body
    ctx.fillStyle='#44cc44';
    ctx.beginPath();ctx.roundRect(cx-20,cy-10,40,35,8);ctx.fill();
    // arms
    ctx.fillStyle='#44cc44';
    ctx.beginPath();ctx.roundRect(cx-30,cy-5+Math.sin(t*4)*5,12,25,5);ctx.fill();
    ctx.beginPath();ctx.roundRect(cx+18,cy-5-Math.sin(t*4)*5,12,25,5);ctx.fill();
    // head
    ctx.fillStyle='#44cc44';ctx.beginPath();ctx.arc(cx,cy-28,22,0,Math.PI*2);ctx.fill();
    // eyes
    ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(cx-8,cy-30,7,8,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+8,cy-30,7,8,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#228822';ctx.beginPath();ctx.arc(cx-7,cy-30,4,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+9,cy-30,4,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#000';ctx.beginPath();ctx.arc(cx-7,cy-30,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+9,cy-30,2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx-9,cy-33,2,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(cx+7,cy-33,2,0,Math.PI*2);ctx.fill();
    // mouth
    ctx.strokeStyle='#228822';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy-22,6,.2,Math.PI-.2);ctx.stroke();
    // hat
    ctx.fillStyle='#2a7a2a';
    ctx.beginPath();ctx.roundRect(cx-16,cy-55,32,10,4);ctx.fill();
    ctx.beginPath();ctx.roundRect(cx-12,cy-64,24,12,4);ctx.fill();
    requestAnimationFrame(frame);
  }
  frame();
})();

// resize
window.addEventListener('resize',()=>{
  screenW=window.innerWidth;screenH=window.innerHeight;
  if(app)app.renderer.resize(screenW,screenH);
});
</script>
